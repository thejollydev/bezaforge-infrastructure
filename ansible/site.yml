---
# ============================================================
# BezaForge Infrastructure — forge-hypervisor + forge-ops +
# forge-ai + forge-brizza
# ============================================================

- name: Configure BezaForge hypervisor
  hosts: hypervisor_hosts
  become: false  # ansible_user is root on forge-hypervisor

  roles:
    # Security-pocket auto-patching (never auto-reboots). Full upgrades are
    # a deliberate pass via update.yml.
    - role: unattended-upgrades
      tags: unattended-upgrades
    # Masks units that can never succeed on the host (opt-in per host_vars),
    # so the #552 failed-unit alert only ever fires on real failures.
    - role: systemd-hygiene
      tags: systemd-hygiene
    # Secondary internal resolver (#638). Opt-in via dnsmasq_manage. Early
    # in the play because everything after it may need to resolve a name,
    # and because this host is the fleet's DNS backstop when AdGuard (a
    # container on forge-ops) is down.
    - role: dnsmasq
      tags: dnsmasq
    - role: sanoid
      tags: sanoid
    - role: restic-gcs
      tags: restic-gcs
    # ADR 0002 v1.2: the vault git actor lives on the dataset owner —
    # local ZFS IO only (git-over-NFS wedged on brizza's 7.0 kernel).
    - role: vault-sync
      tags: vault-sync
    # FORGE-35 Phase 5: one-way Drive→bezapool/gdrive nightly rclone
    # mirror, replacing retired Insync. Also on the dataset owner
    # (local IO beats walking 177 GB over NFS) — ADR 0002 D4 as
    # amended v1.4.
    - role: gdrive-replica
      tags: gdrive-replica
    # ADR 0003 Bucket B: one Samba share + a live RW rclone Google Drive
    # mount, on the hypervisor directly (already the rclone/vault-sync
    # services host — avoids the FUSE-in-unprivileged-LXC unknown).
    - role: fileshare
      tags: fileshare
    # ⚠️ MUST STAY LAST IN EVERY PLAY, and `tags: always` so a tag-scoped
    # run still reaches it (#671). It records which commit each role that
    # actually ran was deployed from — placed anywhere but last, it would
    # stamp roles before they had run. scripts/deploy-drift-check.py and
    # the "Deploy Drift" alert turn those stamps into a merged-but-never-
    # deployed warning, so that "merged" stops standing in for "shipped".
    - role: deploy-stamp
      tags: always

- name: Configure BezaForge Docker hosts
  hosts: docker_hosts
  become: true

  roles:
    - role: unattended-upgrades
      tags: unattended-upgrades
    # Masks units that can never succeed on the host (opt-in per host_vars),
    # so the #552 failed-unit alert only ever fires on real failures.
    - role: systemd-hygiene
      tags: systemd-hygiene
    # /etc/network/interfaces (#628) — first, because it is the most
    # foundational config on the host. Opt-in via network_manage_interfaces
    # (default false), and deliberately handler-free: it restores config on a
    # REBUILD and never restarts networking, which would drop this SSH session
    # and fleet DNS. Byte-identical to live, so a normal deploy is a no-op.
    - role: network
      tags: network
    # Resolver config (#638). Before `common` and everything after it,
    # since any later role may need to resolve a name. Extracted OUT of
    # `common` because forge-brizza and forge-erp need DNS and deliberately
    # do not run `common` — they were silently unconfigured.
    - role: dns-client
      tags: dns-client
    # Read-only journal/log access for the admin user (#638 session). Same
    # four plays as dns-client because that is exactly the set of hosts with
    # a `joseph` account — forge-hypervisor is root-only.
    - role: admin-access
      tags: admin-access
    - role: common
      tags: common
    - role: fail2ban
      tags: fail2ban
    - role: docker
      tags: docker
    - role: traefik
      tags: traefik
    - role: adguard
      tags: adguard
    - role: monitoring
      tags: monitoring
    - role: services
      tags: services
    - role: outline
      tags: outline
    # OpenProject — self-hosted work tracking at pm.bezaforge.dev.
    # Replaced Plane 2026-07 (Plane retired, FORGE #455).
    - role: openproject
      tags: openproject
    - role: brizza-postgres
      tags: brizza-postgres
    - role: db-dumps
      tags: backups
    - role: minio-exports
      tags: backups
    - role: forge-ops-backup-rsync
      tags: backups
    # Deploy stamp — must stay LAST, `tags: always` (#671). See the
    # hypervisor play above for why.
    - role: deploy-stamp
      tags: always

- name: Configure BezaForge GPU hosts
  hosts: gpu_hosts
  become: true

  roles:
    - role: unattended-upgrades
      tags: unattended-upgrades
    # Masks units that can never succeed on the host (opt-in per host_vars),
    # so the #552 failed-unit alert only ever fires on real failures.
    - role: systemd-hygiene
      tags: systemd-hygiene
    # Removes obsolete duplicate dpkg conffiles left by distro upgrades
    # (currently the cloud-init logrotate duplicate, LP#2152107).
    - role: conffile-cleanup
      tags: conffile-cleanup
    # Resolver config (#638) — see the docker_hosts play for why this is
    # no longer inside `common`.
    - role: dns-client
      tags: dns-client
    # Read-only journal/log access for the admin user (#638 session). Same
    # four plays as dns-client because that is exactly the set of hosts with
    # a `joseph` account — forge-hypervisor is root-only.
    - role: admin-access
      tags: admin-access
    - role: common
      tags: common
    - role: guest-agent
      tags: guest-agent
    - role: fail2ban
      tags: fail2ban
    - role: rocm
      tags: rocm
    - role: ollama
      tags: ollama
    # ADR 0003 Bucket B consumer: mount the hypervisor's `files` SMB
    # share (docs + live two-way Google Drive) at /mnt/bezashare.
    - role: fileshare-client
      tags: fileshare-client
    # Deploy stamp — must stay LAST, `tags: always` (#671). See the
    # hypervisor play above for why.
    - role: deploy-stamp
      tags: always

- name: Configure BezaForge assistant hosts
  hosts: assistant_hosts
  become: true

  roles:
    - role: unattended-upgrades
      tags: unattended-upgrades
    # Masks units that can never succeed on the host (opt-in per host_vars),
    # so the #552 failed-unit alert only ever fires on real failures.
    - role: systemd-hygiene
      tags: systemd-hygiene
    # Removes obsolete duplicate dpkg conffiles left by distro upgrades
    # (currently the cloud-init logrotate duplicate, LP#2152107).
    - role: conffile-cleanup
      tags: conffile-cleanup
    # Resolver config (#638). forge-brizza does NOT run `common`, so before
    # this role its DNS was configured only by roles/forge-brizza's own
    # netplan drop-in — correct, but invisible to every fleet-wide DNS
    # change. That ownership now lives here.
    - role: dns-client
      tags: dns-client
    # Read-only journal/log access for the admin user (#638 session). Same
    # four plays as dns-client because that is exactly the set of hosts with
    # a `joseph` account — forge-hypervisor is root-only.
    - role: admin-access
      tags: admin-access
    - role: fail2ban
      tags: fail2ban
    - role: forge-brizza
      tags: forge-brizza
    # FORGE-49: local vault clone for Hermes grounding — replaces the
    # NFS-RW mount (vaultsync-checkout-vs-NFS-reader race). Timer-only;
    # all hypervisor-specific behavior is disabled in host_vars.
    - role: vault-sync
      tags: vault-sync
    # ADR 0003 Bucket B consumer: mount the hypervisor's `files` SMB
    # share (docs + live two-way Google Drive) at /mnt/bezashare.
    - role: fileshare-client
      tags: fileshare-client
    # Deploy stamp — must stay LAST, `tags: always` (#671). See the
    # hypervisor play above for why.
    - role: deploy-stamp
      tags: always

- name: Configure BezaForge ERP host
  hosts: erp_hosts
  become: true

  # forge-erp management (no `common` role — a first-touch UFW enable could
  # lock admin out of this otherwise-unmanaged host). erpnext (FORGE-30, the
  # frappe_docker app) deploys first so the stack is up before the forge-erp
  # backup layer (FORGE-60/61/62) runs.
  roles:
    - role: unattended-upgrades
      tags: unattended-upgrades
    # Masks units that can never succeed on the host (opt-in per host_vars),
    # so the #552 failed-unit alert only ever fires on real failures.
    - role: systemd-hygiene
      tags: systemd-hygiene
    # Removes obsolete duplicate dpkg conffiles left by distro upgrades
    # (currently the cloud-init logrotate duplicate, LP#2152107).
    - role: conffile-cleanup
      tags: conffile-cleanup
    # Resolver config (#638). forge-erp runs no `common` BY DESIGN (a
    # first-touch UFW enable could lock admin out — see the play comment
    # above), which is exactly why it had no DNS management at all until
    # now. This role touches no firewall, so it is safe here.
    - role: dns-client
      tags: dns-client
    # Read-only journal/log access for the admin user (#638 session). Same
    # four plays as dns-client because that is exactly the set of hosts with
    # a `joseph` account — forge-hypervisor is root-only.
    - role: admin-access
      tags: admin-access
    - role: erpnext
      tags: erpnext
    - role: forge-erp
      tags: forge-erp
    # Deploy stamp — must stay LAST, `tags: always` (#671). See the
    # hypervisor play above for why.
    - role: deploy-stamp
      tags: always
