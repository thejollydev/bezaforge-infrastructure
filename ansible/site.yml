---
# ============================================================
# BezaForge Infrastructure — forge-hypervisor + forge-ops +
# forge-ai + forge-agents + forge-erp
# ============================================================

- name: Configure BezaForge hypervisor
  hosts: hypervisor_hosts
  become: false  # ansible_user is root on forge-hypervisor

  roles:
    # Security-pocket auto-patching (never auto-reboots). Full upgrades are
    # a deliberate pass via update.yml.
    - role: unattended-upgrades
      tags: unattended-upgrades
    # Masks units that can never succeed on the host (opt-in per host_vars),
    # so the #552 failed-unit alert only ever fires on real failures.
    - role: systemd-hygiene
      tags: systemd-hygiene
    # Pins SATA LPM to max_performance (#1101): the kernel's
    # med_power_with_dipm default flapped the bezapool WD Reds' links for
    # months across three misdiagnosed incidents (#92, #955, #1101). Early
    # in the play because everything below it does I/O against bezapool.
    - role: sata-lpm
      tags: sata-lpm
    # Secondary internal resolver (#638). Opt-in via dnsmasq_manage. Early
    # in the play because everything after it may need to resolve a name,
    # and because this host is the fleet's DNS backstop when AdGuard (a
    # container on forge-ops) is down.
    - role: dnsmasq
      tags: dnsmasq
    - role: sanoid
      tags: sanoid
    - role: restic-gcs
      tags: restic-gcs
    # vault-sync retired 2026-09-13: Ansible no longer manages a bezapool git
    # clone of the vault or its timer. bezapool/vault stays (sanoid + restic
    # keep it) and will hold the vault's Syncthing copy. The service user and
    # /etc/hosts pins that role created moved to gdrive-replica and dnsmasq.
    # FORGE-35 Phase 5: one-way Drive→bezapool/gdrive nightly rclone
    # mirror, replacing retired Insync. Also on the dataset owner
    # (local IO beats walking 177 GB over NFS) — ADR 0002 D4 as
    # amended v1.4.
    - role: gdrive-replica
      tags: gdrive-replica
    # ADR 0003 Bucket B: one Samba share + a live RW rclone Google Drive
    # mount, on the hypervisor directly (already the rclone services
    # host — avoids the FUSE-in-unprivileged-LXC unknown).
    - role: fileshare
      tags: fileshare
    # ⚠️ MUST STAY LAST IN EVERY PLAY, and `tags: always` so a tag-scoped
    # run still reaches it (#671). It records which commit each role that
    # actually ran was deployed from — placed anywhere but last, it would
    # stamp roles before they had run. scripts/deploy-drift-check.py and
    # the "Deploy Drift" alert turn those stamps into a merged-but-never-
    # deployed warning, so that "merged" stops standing in for "shipped".
    - role: deploy-stamp
      tags: always

- name: Configure BezaForge Docker hosts
  hosts: docker_hosts
  become: true

  roles:
    - role: unattended-upgrades
      tags: unattended-upgrades
    # Masks units that can never succeed on the host (opt-in per host_vars),
    # so the #552 failed-unit alert only ever fires on real failures.
    - role: systemd-hygiene
      tags: systemd-hygiene
    # /etc/network/interfaces (#628) — first, because it is the most
    # foundational config on the host. Opt-in via network_manage_interfaces
    # (default false), and deliberately handler-free: it restores config on a
    # REBUILD and never restarts networking, which would drop this SSH session
    # and fleet DNS. Byte-identical to live, so a normal deploy is a no-op.
    - role: network
      tags: network
    # Resolver config (#638). Before `common` and everything after it,
    # since any later role may need to resolve a name. Extracted OUT of
    # `common` because forge-brizza and forge-erp need DNS and deliberately
    # do not run `common` — they were silently unconfigured.
    - role: dns-client
      tags: dns-client
    # Read-only journal/log access for the admin user (#638 session). Same
    # four plays as dns-client because that is exactly the set of hosts with
    # a `joseph` account — forge-hypervisor is root-only.
    - role: admin-access
      tags: admin-access
    - role: common
      tags: common
    - role: fail2ban
      tags: fail2ban
    - role: docker
      tags: docker
    # Source-restricts Docker-PUBLISHED ports (#963). Immediately after
    # `docker` because it needs the DOCKER-USER chain to exist, and
    # before every role that publishes a port, so a container is never
    # up and unfiltered between the two. Opt-in per host_vars; UFW in
    # `common` above structurally cannot cover these — Docker's rules
    # bypass its INPUT chain entirely.
    - role: docker-firewall
      tags: docker-firewall
    # Weekly image + build-cache reclaim (#982). Nothing pruned anything
    # until 2026-09-02, so forge-ops accumulated 120 images with 26 in
    # use and filled its root LV to 85 %. Placed after `docker` because
    # it needs the daemon, and before the service roles so a prune is
    # never scheduled against a host whose Docker was only half set up.
    - role: docker-prune
      tags: docker-prune
    - role: traefik
      tags: traefik
    - role: adguard
      tags: adguard
    - role: monitoring
      tags: monitoring
    - role: services
      tags: services
    - role: outline
      tags: outline
    # OpenProject — self-hosted work tracking at pm.bezaforge.dev.
    # Replaced Plane 2026-07 (Plane retired, FORGE #455).
    - role: openproject
      tags: openproject
    - role: db-dumps
      tags: backups
    - role: minio-exports
      tags: backups
    - role: forge-ops-backup-rsync
      tags: backups
    # Deploy stamp — must stay LAST, `tags: always` (#671). See the
    # hypervisor play above for why.
    - role: deploy-stamp
      tags: always

- name: Configure BezaForge GPU hosts
  hosts: gpu_hosts
  become: true

  roles:
    - role: unattended-upgrades
      tags: unattended-upgrades
    # Masks units that can never succeed on the host (opt-in per host_vars),
    # so the #552 failed-unit alert only ever fires on real failures.
    - role: systemd-hygiene
      tags: systemd-hygiene
    # Removes obsolete duplicate dpkg conffiles left by distro upgrades
    # (currently the cloud-init logrotate duplicate, LP#2152107).
    - role: conffile-cleanup
      tags: conffile-cleanup
    # Resolver config (#638) — see the docker_hosts play for why this is
    # no longer inside `common`.
    - role: dns-client
      tags: dns-client
    # Read-only journal/log access for the admin user (#638 session). Same
    # four plays as dns-client because that is exactly the set of hosts with
    # a `joseph` account — forge-hypervisor is root-only.
    - role: admin-access
      tags: admin-access
    - role: common
      tags: common
    - role: guest-agent
      tags: guest-agent
    - role: fail2ban
      tags: fail2ban
    - role: rocm
      tags: rocm
    - role: ollama
      tags: ollama
    # ComfyUI image generation for BezaCore brand work (#1188). After rocm
    # (its service user joins the GPU groups) and ollama (the card's other
    # tenant). Downloads about 45 GB of models on first run.
    - role: comfyui
      tags: comfyui
    # ADR 0003 Bucket B consumer: mount the hypervisor's `files` SMB
    # share (docs + live two-way Google Drive) at /mnt/bezashare.
    - role: fileshare-client
      tags: fileshare-client
    # Deploy stamp — must stay LAST, `tags: always` (#671). See the
    # hypervisor play above for why.
    - role: deploy-stamp
      tags: always

# ------------------------------------------------------------
# forge-agents (assistant_hosts) — the Brizza agent team's host.
#
# The Lenovo M920Q, bare metal, Ubuntu 26.04 at 10.10.50.20 (BezaForge
# ADR 0011). It took over the identity Brizza v1's forge-brizza held
# until 2026-08-30: the address and DNS record followed the name, and
# VMID 104 was released because this host is not a VM.
#
# This play is the base only (#1215). The team's runtime — Hermes
# profiles, Never4gA, Syncthing, the tracker sync, the nightly backup
# push — joins it as roles in later steps of the Brizza build plan.
#
# Left out on purpose:
#   - monitoring       is the Prometheus/Grafana/Loki STACK on forge-ops,
#                      not a client. This host's exporter is node-exporter.
#   - guest-agent      qemu-guest-agent means nothing on bare metal.
#   - conffile-cleanup clears duplicates a distro UPGRADE leaves behind;
#                      this host was installed fresh on 26.04.
# ------------------------------------------------------------

- name: Configure BezaForge assistant hosts
  hosts: assistant_hosts
  become: true

  roles:
    - role: unattended-upgrades
      tags: unattended-upgrades
    # Masks units that can never succeed on the host (opt-in per host_vars),
    # so the #552 failed-unit alert only ever fires on real failures.
    - role: systemd-hygiene
      tags: systemd-hygiene
    # Resolver config (#638) — see the docker_hosts play for why this is
    # no longer inside `common`.
    - role: dns-client
      tags: dns-client
    # Read-only journal/log access for the admin user (#638 session).
    - role: admin-access
      tags: admin-access
    # Unlike v1's forge-brizza, this host runs `common`. The worry that
    # keeps forge-erp off it is a first-touch UFW enable locking admin out;
    # here the laptop's addresses and the Prometheus scrape source are
    # already in group_vars/all, so UFW comes up with both allowed.
    - role: common
      tags: common
    - role: fail2ban
      tags: fail2ban
    # The distro node_exporter, after `common` so UFW already allows the
    # scrape. forge-ai and forge-erp run the same package, installed by
    # hand; this is the first host where a role owns it.
    - role: node-exporter
      tags: node-exporter
    # Deploy stamp — must stay LAST, `tags: always` (#671). See the
    # hypervisor play above for why.
    - role: deploy-stamp
      tags: always

- name: Configure BezaForge ERP host
  hosts: erp_hosts
  become: true

  # forge-erp management (no `common` role — a first-touch UFW enable could
  # lock admin out of this otherwise-unmanaged host). erpnext (FORGE-30, the
  # frappe_docker app) deploys first so the stack is up before the forge-erp
  # backup layer (FORGE-60/61/62) runs.
  roles:
    - role: unattended-upgrades
      tags: unattended-upgrades
    # Masks units that can never succeed on the host (opt-in per host_vars),
    # so the #552 failed-unit alert only ever fires on real failures.
    - role: systemd-hygiene
      tags: systemd-hygiene
    # Removes obsolete duplicate dpkg conffiles left by distro upgrades
    # (currently the cloud-init logrotate duplicate, LP#2152107).
    - role: conffile-cleanup
      tags: conffile-cleanup
    # Resolver config (#638). forge-erp runs no `common` BY DESIGN (a
    # first-touch UFW enable could lock admin out — see the play comment
    # above), which is exactly why it had no DNS management at all until
    # now. This role touches no firewall, so it is safe here.
    - role: dns-client
      tags: dns-client
    # Read-only journal/log access for the admin user (#638 session). Same
    # four plays as dns-client because that is exactly the set of hosts with
    # a `joseph` account — forge-hypervisor is root-only.
    - role: admin-access
      tags: admin-access
    - role: erpnext
      tags: erpnext
    - role: forge-erp
      tags: forge-erp
    # Same weekly reclaim as the docker_hosts play (#982). forge-erp has
    # no separate Docker volume — images share the 48 G root LV — so it
    # has less headroom than forge-ops, not more.
    - role: docker-prune
      tags: docker-prune
    # Deploy stamp — must stay LAST, `tags: always` (#671). See the
    # hypervisor play above for why.
    - role: deploy-stamp
      tags: always
