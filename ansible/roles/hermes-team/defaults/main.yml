---
# ============================================================
# hermes-team role defaults
#
# Brizza ADR 0014: the successor is a team of named Hermes agents, each its
# own Hermes profile with its own memory, its own Discord bot and its own
# credentials. This role installs Hermes and creates those profiles.
#
# The roster and each agent's role card are the decision, not a detail of
# this role: the cards live in the Brizza plan and reach the host as each
# profile's SOUL.md.
# ============================================================

# --- Per host (required) ---
# The user Hermes runs as. The role does not create it, and it must be the
# user that owns the vault copy, because the agents read the vault through
# Never4gA as that user (ADR 0016, #1217).
hermes_user: ""

# The team directory of a checkout of the private brizza repository, on the
# CONTROL machine. It holds roster.yml, which sets hermes_agents below, and
# souls/<agent>.md, the role cards. Both are internal and stay out of this
# public repository (#1335).
hermes_team_dir: ""

# --- Staying current (decided by Joseph, 2026-09-18) ---
# Hermes follows its NEWEST PUBLISHED RELEASE, automatically: on every
# deploy, and nightly by a timer. Nothing here names a version.
#
# The first version of this role pinned v2026.9.14 by tag and commit, and
# would have sat there until someone edited it — falling behind on
# features and security fixes, which is the thing Joseph does not want.
#
# Releases, not `main`. Upstream publishes a release every 3-7 days and
# commits to `main` more than a hundred times a day; releases are what it
# calls ready. So the agents are never more than a day behind a release,
# and never run work upstream has not shipped.
#
# Integrity moves with each release instead of freezing it: the tag comes
# from GitHub over TLS, and `uv sync --locked` checks every dependency
# against the SHA-256 recorded in that release's own lockfile.
hermes_repo: NousResearch/hermes-agent
hermes_latest_release_api: "https://api.github.com/repos/{{ hermes_repo }}/releases/latest"

# The nightly update. A recurring job, which ADR 0014 principle 2 says runs
# only once Joseph approves it — approved 2026-09-18 when he chose "latest
# release" with a nightly timer. Persistent, so a night the host was off is
# caught up at the next boot.
hermes_update_on_calendar: "*-*-* 04:00:00"

# The installer is used ONLY for a first install; once Hermes exists the
# updater never touches it. Fetched fresh each time it is needed, with no
# checksum: a recorded hash of a script upstream edits routinely is a
# version pin in disguise, and it broke the run every time upstream fixed
# something. The website's copy is the one proven on forge-agents; it is
# newer than the copy inside each release.
hermes_installer_url: https://hermes-agent.nousresearch.com/install.sh

# Installed as root BEFORE the installer runs, and the list is longer than
# the installer's own prerequisites for a reason measured the hard way.
#
# The installer runs as the agents' user, and on Ubuntu it reaches for
# `sudo apt-get` for several of these — some carefully (checking `sudo -n`
# first), some not. The careless ones hung the first deployment on
# 2026-09-18 for ten minutes at a password prompt nobody could see:
# `sudo ... apt-get install -y -qq libatomic1`, which it calls on EVERY
# Ubuntu run whether or not the package is present.
#
# The installer now runs with no terminal (see tasks), so those calls fail
# at once instead of waiting. Everything they would have installed is here
# so that failing costs nothing:
#
#   git, curl, xz-utils        the installer's stated prerequisites
#   libatomic1                 the Node it downloads will not start without it
#   build-essential            a C++ compiler, for native Python wheels
#   python3-dev, libffi-dev    headers for the same
#   ripgrep, ffmpeg            optional tools it would otherwise skip
hermes_install_packages:
  - git
  - curl
  - xz-utils
  - libatomic1
  - build-essential
  - python3-dev
  - libffi-dev
  - ripgrep
  - ffmpeg

# The longest the installer may run before it is stopped.
#
# Measured on the second deployment, 2026-09-18: GitHub served the clone at
# 100-160 KB/s (the laptop saw the same, so it was not this host's link),
# and the run hit the first limit of 1200 s partway through `uv sync` —
# downloading, not waiting. 1200 was a guess; this is sized so a slow but
# healthy install finishes and a genuine hang still ends.
#
# A stopped install is not wasted: the clone and uv's download cache
# survive (282 MB of packages that time), so a second run has far less to
# fetch.
hermes_installer_timeout: 3600

# `--skip-setup` because setup is interactive and asks for a model and
# tokens; this role configures the profiles itself and leaves credentials to
# Joseph. `--branch` takes the pinned tag.
hermes_installer_arguments:
  - --skip-setup

# --- The agents ---
# Read from <hermes_team_dir>/roster.yml, never set here or in host_vars.
# One entry per profile. `soul` names a file in <hermes_team_dir>/souls/,
# and `model` is what the profile's model.default is set to. A `dispatch`
# field is ignored: with one gateway there is one dispatcher (ADR-0024).
#
# ⚠️ `approved` IS THE GATE, AND IT DEFAULTS TO FALSE EVERYWHERE.
# ADR 0014 principle 2: nothing starts without Joseph's approval. The role
# creates the profile and writes its soul, but the profile stays PARKED —
# a gateway.parked marker the host gateway skips — until Joseph sets
# `approved: true` for that agent in the roster. An approved agent also
# needs its Discord token on the host before it has a bot to answer with.
# That is the difference between a profile being ready and an agent running.
hermes_agents: []

# --- Models (ADR 0014 principle 3) ---
# Local by default, a frontier model through a subscription Joseph already
# pays for only where a local one would drastically worsen the result, and
# no metered API spend, ever.
#
# Joseph, 2026-09-20: agent work IS that case, so the primary is Codex and
# the local model becomes the fallback. Two reasons, both measured rather
# than assumed. Hermes requires at least 64,000 tokens of context for agent
# use with tools, and forge-ai's 20 GiB card cannot give a 27B that much
# (see host_vars). And a researcher reading several sources exhausts 64K
# anyway, which is what a frontier context is for.
#
# ⚠️ THIS IS THE ONE PROVIDER WHERE A SUBSCRIPTION IS SANCTIONED RATHER
# THAN TOLERATED. OpenAI opened Codex to all paid ChatGPT plans and
# documented third-party clients in May 2026; Anthropic went the other way
# in April, restricting always-on third-party agents and pushing them to
# metered API. That asymmetry is what RSK-03 tracks. It is also why no
# Google route appears here: an AI Ultra subscription grants no API-shaped
# access, Vertex and AI Studio both bill separately, and driving
# Antigravity from a harness is refused outright by Joseph's standards.
#
# OAuth, not a key: hermes_forbidden_env_keys is unaffected and there is
# still no key on this host to bill against.
#
# ⚠️ ONE GRANT FOR THE WHOLE TEAM, SIGNED IN WITHOUT A PROFILE FLAG.
# `hermes auth add openai-codex` — no `-p`. Codex is a single-use-refresh
# provider (with anthropic and xai-oauth): each refresh invalidates the
# previous token, so two profiles refreshing one grant would kill each
# other. Hermes keeps one grant at the root and strips per-profile copies
# on read. A per-profile add APPEARS to work, prints "Added ... credential
# #1", writes active_provider, and is discarded on the next read.
#
# The corollary: revoking it in the OpenAI account stops every agent
# at once. They are less independent than their Discord tokens suggest.
#
# ⚠️ ONE BUCKET, SHARED BY THE WHOLE TEAM. The limit is per ChatGPT
# ACCOUNT, not per agent. On the $20 Plus plan gpt-5.6-luna allows roughly
# 250-2,000 local messages per five hours across every agent on the team
# TOGETHER, with weekly caps on top. Luna is chosen for exactly that: the
# same plan gives gpt-5.6-terra 25-200 and gpt-6-astra 5-45, and five
# messages per five hours does not finish one task.
hermes_model_provider: openai-codex
# Empty on purpose. base_url belongs to the fallback's OpenAI-compatible
# endpoint; forge-ai's URL left here under an openai-codex provider is a
# misrouting shape, and misrouting is what the forbidden-key list exists to
# make fail rather than bill.
hermes_model_base_url: ""
# The Codex model for an agent whose entry does not name one. See the
# shared-bucket warning above for why this is Luna.
hermes_model_default: gpt-5.6-luna

# --- The fallback: forge-ai, when the subscription is spent ---
# SHARED BY EVERY AGENT, DELIBERATELY, rather than one "most appropriate"
# model each. Only ONE model is ever resident: the weights are ~16 GiB on a
# 20 GiB card, so OLLAMA_MAX_LOADED_MODELS=2 does not mean two of these.
# And because the agents share one Codex bucket they exhaust it together,
# so per-agent fallbacks would all engage at once and evict each other — a
# 16 GiB reload per alternation at the moment things are already degraded.
# An agent whose primary is a specialist model loses it in fallback; a warm
# general model beats a cold specialist.
#
# The `-64k` suffix is load-bearing and names a Modelfile variant built by
# roles/ollama on forge-ai. Naming the base gets Ollama's 4096 default,
# because an OpenAI-compat /v1 client cannot set context per request. See
# that host's ollama_modelfiles for why gemma4 and not qwen3.8.
hermes_fallback_provider: custom
hermes_fallback_model: gemma4:26b-64k
hermes_fallback_base_url: http://10.10.50.10:11434/v1

# ⚠️ DECLARED BECAUSE AUTO-DETECTION IS WRONG HERE. Hermes auto-detects
# context length from the provider and upstream says to set it manually
# only when that is wrong — "a local server with a custom num_ctx" is the
# example they give, and it is exactly this. Ollama's /api/show reports the
# MODEL's maximum (262144) rather than the effective num_ctx, so without
# this Hermes believes it has 262K on an endpoint serving 64K, and
# compression never triggers before the server truncates.
hermes_fallback_context_length: 65536

# Local models answer slowly on a long context, and Hermes' own timeouts
# are sized for hosted APIs. The local-Ollama guide raises both.
#
# Written to the host's .env AND each profile's. They are read with a plain
# os.getenv, so a turn served by the shared gateway sees the host process's
# environment (the root .env), while a board worker is its own process and
# loads its profile's .env.
hermes_api_timeout: 1800
hermes_stream_read_timeout: 1800

# --- The self-improvement review, on forge-ai (Joseph, 2026-09-30) ---
# After every turn Hermes forks the agent, replays the conversation and asks
# whether anything should be saved as a memory or a skill
# (auxiliary.background_review). It is what proposes the memory writes ADR
# 0016 holds for approval, so it stays on — but on the agent's own model it
# spent the shared Codex allowance after every turn: about 20 of Brizza's 67
# calls on the first board task under one gateway (#1334). Routed to the
# local fallback it costs the subscription nothing, and Hermes replays a
# compact digest instead of the whole conversation when the review runs on
# a different model.
#
# Same model, provider and endpoint as the fallback, so forge-ai keeps one
# model resident rather than two (see the fallback block above).
hermes_background_review_provider: "{{ hermes_fallback_provider }}"
hermes_background_review_model: "{{ hermes_fallback_model }}"
hermes_background_review_base_url: "{{ hermes_fallback_base_url }}"

# ⚠️ TWO GUARDS AGAINST THE 262K TRAP. Ollama's /api/show reports the
# model's maximum, not the 64K the -64k variant serves, and nothing in the
# review's routing carries fallback_model.context_length across. So:
#   - a model_overrides entry declares the real window for that provider and
#     model, which is the first thing Hermes' context lookup consults;
#   - max_input_tokens caps the SUM of input over one review loop (it stops
#     before crossing it), so even a misjudged window cannot send a request
#     the server would truncate. 75% of 64K, the same fraction Hermes uses
#     when it derives the cap itself.
hermes_background_review_max_input_tokens: 49152

# The defence in depth behind the shape above. If any of these appears in
# a profile's .env, the run FAILS: a fallback to a paid provider can only
# bill if it has a key, so refusing the keys means a misrouted request
# errors instead of costing money. ANTHROPIC_API_KEY is here for RSK-03 as
# well — no Anthropic credential in a third-party harness.
#
# Codex is unaffected: an OAuth login lands in auth.json, not in .env, so
# it is not an API key and is not refused.
hermes_forbidden_env_keys:
  - OPENROUTER_API_KEY
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
  - NOUS_API_KEY

# --- Turn limits ---
# The most iterations one agent run may take before Hermes ends it.
#
# ⚠️ UNSET MEANS UNLIMITED, and it was unset on every profile until
# 2026-09-20. `resolve_turn_limit` (hermes_cli/config.py) returns
# TURN_LIMIT_UNLIMITED — sys.maxsize — for a missing agent.max_turns, and
# DEFAULT_CONFIG leaves it None. Meanwhile ~/.hermes/config.yaml held 500
# and was read by nothing, which is the root-versus-profile trap below
# wearing its most expensive face: the cap looked set and was not.
#
# The loop guardrails are not a substitute. tool_loop_guardrails defaults
# to warnings only (`hard_stop_enabled: false`), so a run that stops making
# progress is narrated rather than stopped.
#
# 500 is the number already written down rather than a measured one. It is
# generous for anything the board hands an agent and it still ends a loop,
# which is the whole job.
hermes_agent_max_turns: 500

# --- Memory (Brizza ADR-0026, amending ADR 0016) ---
# Written freely. Each agent keeps its own MEMORY.md and USER.md — what it
# learns about Joseph included — and sends him a weekly summary of what it
# added or changed, which he corrects. Until 2026-10-01 every write was held
# for approval behind a daily digest nobody had built, so in practice the
# agents remembered nothing: every profile's memories/ was still empty from
# the day it was created, and nothing had ever been staged under pending/.
#
# ⚠️ PERSONAL DATA NOW LIVES ON FORGE-AGENTS. USER.md holds what the agents
# learn about Joseph, under ~/.hermes/profiles/<agent>/memories/. It never
# goes into a repository, and a backup of this host has to treat it as
# personal data.
hermes_memory_write_approval: false

# The weekly summary, one scheduled Hermes job per agent (ADR-0026). The job
# only triggers it; what goes in the summary is each agent's soul's to say.
# Delivered to the agent's own Discord home channel. The schedule is cron
# syntax in the host's time zone (America/Detroit); the time is Joseph's to
# choose.
hermes_memory_summary_job_name: weekly-memory-summary
hermes_memory_summary_schedule: "0 18 * * 0"
hermes_memory_summary_prompt: >-
  Send Joseph this week's memory summary, as your soul's Memory section
  says.
hermes_memory_summary_deliver: discord

# --- Discord (ADR 0015) ---
# One application and bot per agent, created by Joseph in the Discord
# developer portal. Each needs the Message Content and Server Members
# privileged intents; without them the bot receives events whose text is
# empty and cannot see what was typed.
#
# The role writes every NON-secret Discord setting into each profile's
# .env and never touches the DISCORD_BOT_TOKEN line. The token reaches the
# host by Joseph's hand. Every other secret in this fleet lives in
# group_vars/all/vault.yml, and this one deliberately does not — step 5 of
# the build plan asks that the role never hold a token in git, and
# encrypted-in-git is still in git.

# Joseph's Discord user ID: who each agent takes orders from. A user ID is
# an identifier, not a secret.
#
# ⚠️ EMPTY MEANS EVERY AGENT IGNORES EVERYONE, JOSEPH INCLUDED. Hermes
# denies all users when neither this nor DISCORD_ALLOWED_ROLES is set —
# safe, but a bot that comes online and never answers looks exactly like a
# broken one. The role refuses to start an approved agent until it is set.
hermes_discord_allowed_users: ""

# ⚠️ `none` is Hermes' own default and ADR 0015's decision. Hermes now
# documents bot-to-bot handoffs at `mentions` or `all`, guarded against the
# reply-ping loop by DISCORD_BOTS_REQUIRE_INLINE_MENTION. That is ADR 0015's
# stated revisit condition and it is Joseph's to rule on; until he does,
# agents coordinate through the board and Bot Mode rooms as decided.
hermes_discord_allow_bots: none
# Default on upstream, and ADR 0015 owes a test of whether the backfill
# includes other bots' replies.
hermes_discord_history_backfill: true
hermes_discord_history_backfill_limit: 50

# --- Bot Mode (ADR 0014, ADR 0015) ---
# Agent-to-agent messages need Hermes to treat the install as Bot Mode
# managed: `message_agent` appears only in a session titled exactly
# `Bot Chat`, and only when some profile's profile.yaml carries a
# `ui_meta: {hermes-bots: ...}` block. The desktop app writes that block for
# every Bot it creates; a headless install never gets one, and there is no
# CLI command that writes it. So the role does, on every agent's profile.
#
# Measured on forge-agents 2026-09-21 (#1218): with the block in place,
# Brizza's Bot Chat messaged the Researcher and the answer came back to
# her. It
# changes nothing in Discord: the tool is never offered in a Discord session.
hermes_bot_mode_marker: true

# --- The service (Brizza ADR-0024) ---
# ONE gateway for the whole team. Hermes v2026.9.24 serves every profile on
# a host from a single `hermes gateway run`, by maintainer ruling, and
# refuses a per-profile `gateway install` with rc 78. So the host gateway is
# installed from the default profile (~/.hermes) and serves the default plus
# every named profile that is not parked.
#
# The name has no suffix (`get_service_name` in hermes_cli/gateway.py), and
# that matters: the old `hermes-gateway-*.service` glob does not match it.
hermes_gateway_unit: hermes-gateway.service

# A user manager only runs while the user has a session unless lingering is
# on, and nobody logs into the team host — the same reason roles/never4ga
# enables it.
hermes_enable_linger: true

# --- The kanban board (ADR 0020) ---
# One board per machine, shared by every profile, and Hermes means it:
# `kanban_home()` resolves through the platform default rather than the
# active profile's HERMES_HOME, "because resolving through the active
# profile's HERMES_HOME would fork the board per profile and break the
# dispatcher/worker handoff". So every agent shares one board, and one
# process dispatches from it. That much is upstream's design and this role
# does not fight it.
#
# Since Brizza ADR-0024 there is one gateway on the host, so there is one
# dispatcher by construction. Until then each agent ran its own gateway,
# every one raced for an flock at boot, and the role named the winner with
# a `dispatch: true` roster field; that field and the per-profile
# kanban.dispatch_in_gateway it wrote are gone.
#
# ⚠️ ROOT, NOT PER-PROFILE. The dispatcher runs in the host process, which
# reads kanban.* from the ROOT ~/.hermes/config.yaml only
# (`_kanban_dispatcher_boot`, `_resolve_dispatcher_settings` in gateway/).
# So the caps below and dispatch_in_gateway are written there, by main.yml.
# Everything about an agent itself — model, soul, turn limit, MCP servers,
# Discord — is still read from that agent's own profile on each turn.

# The host never runs more than this many workers at once, across every
# board and both dispatch lanes. Unset upstream, which derives it from
# MemTotal clamped to [2, 8] — 8 on this 16 GB host.
#
# 4, because the bottleneck is not this machine. The workers are processes
# here but the thinking happens on forge-ai's single Ollama, so eight
# concurrent workers would queue at the model rather than run. Tune it once
# there is real load; it is a starting point, not a measurement.
hermes_kanban_max_in_progress: 4

# No single profile runs more than this many workers even when the global
# cap would allow more (upstream #21582; unset means no per-profile cap).
#
# Without it one agent's fan-out takes every slot and the other two sit
# idle behind it.
hermes_kanban_max_in_progress_per_profile: 2

# --- Never4gA, as every agent's MCP server (#1217) ---
# Brizza ADR 0016: an agent that needs to find something looks in the vault
# through Never4gA, and every agent loads Joseph's standards from it at the
# start of its work. This is how an agent reaches it: Never4gA's own MCP
# server, on stdio, registered in each profile's config.yaml.
#
# Written with `config set` rather than `hermes mcp add`, which asks which
# tools to enable and whether to overwrite, and has no flag for either.
# `config set` takes a JSON list as a real list — measured 2026-09-22 in a
# throwaway HERMES_HOME; it is dotted indices (`key.0`) that produce the
# dict the fallback comment in profile.yml describes.
hermes_never4ga_mcp_enabled: true
hermes_never4ga_mcp_name: never4ga
hermes_never4ga_mcp_command: /usr/local/bin/never4ga-mcp
# The vault the server reads. Per host; on forge-agents it is
# never4ga_vault_path, the same copy roles/never4ga serves.
hermes_never4ga_vault_path: ""

# The tools an agent does NOT get. ADR 0020: OpenProject is Joseph's view
# and the sync (Build 7, #1221) is the only thing that writes it; an agent
# creating or changing a work package itself would go around both the sync
# and his approval. Reading the tracker, and reading and writing the vault
# (ADR 0016: agents write their own projects' documents directly), stay.
#
# Exact tool names as the server reports them. Hermes matches these when it
# registers tools, so an excluded tool never reaches the agent at all.
hermes_never4ga_mcp_exclude:
  - never4ga_work_create
  - never4ga_work_update
  - never4ga_work_comment
