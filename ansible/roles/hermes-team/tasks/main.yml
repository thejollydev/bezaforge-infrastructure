---
# ============================================================
# hermes-team role — the agents themselves (#1218)
#
# Brizza ADRs 0014 and 0015. Hermes is the runtime for the whole team; each
# agent is a profile with its own memory, soul, credentials and Discord bot.
#
# WHAT THIS ROLE DOES NOT DO, ON PURPOSE:
#
#   - It does not write Discord tokens. Joseph creates one application per
#     agent and completes each login; the role notices whether the
#     credential is there and says so.
#   - It does not start an agent. ADR 0014 principle 2 — nothing runs until
#     Joseph approves its first run — so a gateway starts only for an agent
#     whose roster entry says `approved: true`.
#   - It does not run `hermes setup`. That is interactive and would ask for
#     a model and tokens the role has opinions about and credentials it
#     refuses to hold.
#
# Hermes follows its newest published release — on every deploy, and
# nightly by a timer — and nothing here names a version (Joseph,
# 2026-09-18). The installer is used only for a first install; after that
# hermes-update-release moves the checkout from release to release.
# ============================================================

# The roster and the role cards are internal and live in the private brizza
# repository (#1335). Read before the input checks, which check what the
# roster holds.
- name: Require the team directory on the control machine
  ansible.builtin.assert:
    that:
      - hermes_team_dir | length > 0
      - (hermes_team_dir ~ '/roster.yml') is file
    fail_msg: >-
      No roster at {{ hermes_team_dir }}/roster.yml. hermes_team_dir must
      point at the team/ directory of a brizza checkout on the machine
      running the playbook, on a branch that has team/roster.yml.
    quiet: true

- name: Read the roster
  ansible.builtin.include_vars:
    file: "{{ hermes_team_dir }}/roster.yml"

- name: Check the role's inputs
  ansible.builtin.assert:
    that:
      - hermes_user | length > 0
      - hermes_agents | length > 0
      - not hermes_never4ga_mcp_enabled or hermes_never4ga_vault_path | length > 0
      - hermes_agents | map(attribute='name') | list | unique | length == hermes_agents | length
    fail_msg: >-
      roles/hermes-team needs hermes_user in host_vars and a roster with
      one entry per profile and no repeated name. Two
      profiles with one name would be two processes on one Hermes home,
      which corrupts both agents' memory. With Never4gA registered for the
      agents, hermes_never4ga_vault_path is required too.
    quiet: true

# Checked here, before any profile is touched, so a missing card stops the
# run whole instead of leaving some agents rewritten and the rest not. The
# usual cause is the brizza checkout being on a branch without team/souls/.
- name: Require every agent's role card on the control machine
  ansible.builtin.assert:
    that: (hermes_team_dir ~ '/souls/' ~ item.soul) is file
    fail_msg: >-
      No role card at {{ hermes_team_dir }}/souls/{{ item.soul }} for
      {{ item.name }}. The roster names it but the brizza checkout does not
      have it; check out a branch where team/roster.yml and team/souls/
      agree.
    quiet: true
  loop: "{{ hermes_agents }}"
  loop_control:
    label: "{{ item.name }}"

# No dispatcher check any more. One gateway serves the whole team (Brizza
# ADR-0024), so there is one dispatcher by construction and nothing left to
# race for. A roster that still carries `dispatch` is read and ignored, so
# the field can leave brizza's roster before or after this role changes.

- name: Read the runtime user
  ansible.builtin.getent:
    database: passwd
    key: "{{ hermes_user }}"

- name: Keep the user's home and uid for the paths below
  ansible.builtin.set_fact:
    hermes_home: "{{ ansible_facts.getent_passwd[hermes_user][4] }}"
    hermes_uid: "{{ ansible_facts.getent_passwd[hermes_user][1] }}"

- name: Set the paths the installer uses
  ansible.builtin.set_fact:
    # Per-user install: the installer puts the checkout here and a symlink
    # at ~/.local/bin/hermes. Profiles then live under ~/.hermes/profiles/.
    hermes_checkout: "{{ hermes_home }}/.hermes/hermes-agent"
    hermes_bin: "{{ hermes_home }}/.local/bin/hermes"
    hermes_profiles_dir: "{{ hermes_home }}/.hermes/profiles"
    hermes_cache: "{{ hermes_home }}/.cache/bezaforge-hermes"

# ------------------------------------------------------------
# Install
# ------------------------------------------------------------

- name: Install what the installer cannot provision itself
  ansible.builtin.apt:
    name: "{{ hermes_install_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Which release is newest is asked once per run, on the host, the same way
# the nightly updater asks — so a deploy and the timer can never disagree
# about what "current" means.
- name: Ask GitHub for Hermes' newest release
  ansible.builtin.uri:
    url: "{{ hermes_latest_release_api }}"
    return_content: true
  register: hermes_latest_release
  changed_when: false

- name: Keep its tag
  ansible.builtin.set_fact:
    hermes_latest_tag: "{{ hermes_latest_release.json.tag_name }}"

# Whether Hermes is installed is answered by `hermes` itself. The clone is
# the installer's first step, so a checkout alone proves only that an
# install began — a run stopped partway on 2026-09-18 left exactly that.
- name: Ask whether the hermes command works
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} --version"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  register: hermes_version_probe
  changed_when: false
  failed_when: false

# --- First install only -------------------------------------------------

- name: Create the installer cache
  ansible.builtin.file:
    path: "{{ hermes_cache }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'
  when: hermes_version_probe.rc != 0

# Fresh each time and with no checksum: see hermes_installer_url.
- name: Fetch the installer
  ansible.builtin.get_url:
    url: "{{ hermes_installer_url }}"
    dest: "{{ hermes_cache }}/install.sh"
    force: true
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'
  become: true
  become_user: "{{ hermes_user }}"
  when: hermes_version_probe.rc != 0

# ⚠️ NO TERMINAL, ON PURPOSE. The first deployment hung here for ten
# minutes: Ansible's become gave the installer a controlling terminal, so
# its unguarded `sudo apt-get install libatomic1` sat at a password prompt
# that nobody could see or answer.
#
# `setsid` starts the installer in a new session with no controlling
# terminal, and stdin is /dev/null. With no terminal, a bare `sudo` fails
# immediately ("a terminal is required") — which those calls tolerate, each
# ending in `|| true` — and the installer's own prompts take their
# defaults. Everything those `sudo` calls would have installed is already
# present (see defaults).
#
# `timeout` is the backstop against a future installer finding another way
# to wait for a person.
- name: Install Hermes at its newest release, with no terminal to prompt on
  ansible.builtin.shell:
    cmd: >-
      timeout {{ hermes_installer_timeout }}
      setsid --wait
      {{ hermes_cache }}/install.sh
      {{ hermes_installer_arguments | join(' ') }}
      --branch {{ hermes_latest_tag }}
      < /dev/null
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  register: hermes_install
  when: hermes_version_probe.rc != 0
  changed_when: true
  # 124 is let through so the next task can say what it means; any other
  # failure fails here as usual.
  failed_when: hermes_install.rc not in [0, 124]

# `timeout` exits 124 when it had to stop the installer. Name that case,
# because "failed" and "was still going when the limit came" need
# different fixes.
- name: Say so if the installer had to be stopped
  ansible.builtin.fail:
    msg: >-
      The installer was still running after {{ hermes_installer_timeout }}
      seconds and was stopped. That is one of two things, and they need
      different fixes. A SLOW DOWNLOAD: run the play again — the clone and
      uv's package cache survive, so the second run has much less to fetch.
      A PROMPT: something was waiting for input; the installer's last lines
      below will show a question, and whatever it wanted belongs in
      hermes_install_packages. To tell them apart while it runs, look on the
      host for a `sudo` with no child process (a prompt) versus a busy
      `git clone` or `uv sync` (a download).
      Last output: {{ (hermes_install.stdout_lines | default([]))[-5:] | join(' / ') }}
  when:
    - hermes_install is not skipped
    - hermes_install.rc | default(0) == 124

# --- Every run: the updater, and the timer that runs it nightly ---------

# ------------------------------------------------------------
# Install only (see defaults): report what was installed and stop
# ------------------------------------------------------------

- name: Report the version installed on an install-only host
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} --version"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  register: hermes_install_only_version
  changed_when: false
  when: hermes_team_install_only | bool

- name: Say that the role stops here on an install-only host
  ansible.builtin.debug:
    msg: >-
      hermes_team_install_only is set: {{ (hermes_install_only_version.stdout_lines | default(['?']))[0] }}
      is installed, and nothing else was done — no updater, no profiles, no
      gateway, no timers.
  when: hermes_team_install_only | bool

- name: Stop here on an install-only host
  ansible.builtin.meta: end_role
  when: hermes_team_install_only | bool

- name: Install the release updater
  ansible.builtin.template:
    src: hermes-update-release.sh.j2
    dest: "{{ hermes_home }}/.local/bin/hermes-update-release"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'

- name: Create the user systemd directory
  ansible.builtin.file:
    path: "{{ hermes_home }}/.config/systemd/user"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'

- name: Install the updater's service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ hermes_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0644'
  loop:
    - hermes-update.service
    - hermes-update.timer

# Nobody logs into the team host, so without lingering the user manager
# never starts and every gateway service would be enabled against a manager
# that does not exist. Same reason as roles/never4ga.
- name: Let the user manager run without a session
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ hermes_user }}"
    creates: "/var/lib/systemd/linger/{{ hermes_user }}"
  when: hermes_enable_linger

# Approved by Joseph 2026-09-18 (ADR 0014 principle 2). Stopped and
# disabled while hermes_update_hold is set (see defaults), so a held host
# does not fail the same update every night.
- name: Enable the nightly update, unless held
  ansible.builtin.systemd_service:
    name: hermes-update.timer
    scope: user
    daemon_reload: true
    enabled: "{{ not (hermes_update_hold | bool) }}"
    state: "{{ 'stopped' if hermes_update_hold | bool else 'started' }}"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hermes_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ hermes_uid }}/bus"
  when: not ansible_check_mode

# A deploy is also an update: the same script the timer runs, so there is
# exactly one definition of "move to the newest release" and one of
# "already current".
- name: Bring Hermes to its newest release
  ansible.builtin.command:
    cmd: "{{ hermes_home }}/.local/bin/hermes-update-release"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ hermes_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ hermes_uid }}/bus"
  register: hermes_update
  changed_when: "'hermes updated to' in hermes_update.stdout"
  when:
    - not ansible_check_mode
    - not (hermes_update_hold | bool)

- name: Say that Hermes is held at its installed release
  ansible.builtin.debug:
    msg: >-
      hermes_update_hold is set, so Hermes was NOT updated and the nightly
      update is stopped. It stays on the installed release until the hold is
      removed from this host's variables.
  when: hermes_update_hold | bool

- name: Report the installed version
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} --version"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  register: hermes_installed_version
  changed_when: false

- name: Show it
  ansible.builtin.debug:
    msg: "{{ hermes_installed_version.stdout_lines[0] | default('') }} — newest release is {{ hermes_latest_tag }}"

# ------------------------------------------------------------
# The default profile, which is now also the host's
# ------------------------------------------------------------
#
# The installer creates a profile of its own at ~/.hermes, and it is the one
# that answers when anybody types plain `hermes` rather than an agent's
# name. It is not an agent — but out of the box it is aimed at OpenRouter
# (`provider: auto`, `base_url: https://openrouter.ai/api/v1`,
# `anthropic/claude-opus-4.6`), found on forge-agents after the first
# successful install on 2026-09-18.
#
# With no key it cannot spend, which is exactly why it is a trap: one
# pasted OPENROUTER_API_KEY and a stray `hermes` would bill. So it gets the
# same treatment as the agents — pointed at forge-ai, and refused a paid
# key — and ADR 0014 principle 3 holds for every profile on the host, not
# only the ones in the roster.
#
# ⚠️ SINCE BRIZZA ADR-0024 THE HOST GATEWAY RUNS FROM THIS PROFILE, so its
# config.yaml and .env are read by the process serving the whole team. Each
# agent's turn still reads its own profile's config.yaml and .env (Hermes
# scopes both to the serving profile), but a few things are host-wide and
# come from here only — measured in the v2026.9.24 source on 2026-09-30:
#
#   kanban.*                  the dispatcher runs in the host process
#   group_sessions_per_user   session keys come from the host's config;
#                             still unset and at the default (ADR 0022)
#   HERMES_API_TIMEOUT,       read with a plain os.getenv, which sees the
#   HERMES_STREAM_READ_TIMEOUT  host's process environment, not the scope
#
# The default profile is always served and cannot be parked. It has no
# Discord token, so it has no bot; it does run its own cron, of which it has
# none.

- name: Read the host's settings
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} -p default config get {{ item.key }}"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  loop: "{{ hermes_root_settings }}"
  loop_control:
    label: "{{ item.key }}"
  register: hermes_default_probe
  changed_when: false
  failed_when: false
  vars:
    hermes_root_settings:
      # ⚠️ THE FALLBACK'S SETTINGS, NOT THE AGENTS' PRIMARY. A bare `hermes`
      # on the host, and the board's auto-decompose, run on this profile's
      # model. Pointing it at Codex would spend the team's shared account on
      # a stray command line, so it keeps the local model the agents fall
      # back to — which is also what makes it safe, since forge-ai bills
      # nothing.
      - key: model.provider
        value: "{{ hermes_fallback_provider }}"
      - key: model.base_url
        value: "{{ hermes_fallback_base_url }}"
      - key: model.default
        value: "{{ hermes_fallback_model }}"
      - key: model.context_length
        value: "{{ hermes_fallback_context_length }}"
      # The board's caps. Read by the dispatcher in the host process from
      # this file only (`_resolve_dispatcher_settings`); per-profile copies
      # are ignored, which is why the profiles no longer carry them.
      - key: kanban.max_in_progress
        value: "{{ hermes_kanban_max_in_progress }}"
      - key: kanban.max_in_progress_per_profile
        value: "{{ hermes_kanban_max_in_progress_per_profile }}"

# argv rather than a cmd string: an EMPTY value vanishes from a templated
# command line, leaving `config set <key>` with no value, which is a usage
# error and a non-zero exit. argv keeps the empty string as its own
# argument. Nothing here is empty today, but `hermes_model_base_url` is,
# and this loop's twin in profile.yml sets it.
- name: Set what differs for the host
  ansible.builtin.command:
    argv:
      - "{{ hermes_bin }}"
      - -p
      - default
      - config
      - set
      - "{{ item.item.key }}"
      - "{{ item.item.value }}"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  loop: "{{ hermes_default_probe.results }}"
  loop_control:
    label: "{{ item.item.key }} = {{ item.item.value }}"
  # `| string`, because templating keeps native types: context_length
  # arrives as the integer 65536, `config get` prints the text "65536", and
  # the two never compare equal — so without it this rewrote a correct
  # value on every run. Its twin in profile.yml already did this.
  when: (item.stdout | default('') | trim) != (item.item.value | string)
  changed_when: true
  notify: Restart the hermes gateway

# `config get` answers with the EFFECTIVE value, defaults included, so the
# loop above cannot tell "written as true" from "true because upstream's
# default is true". The dispatcher is the one key whose silent change would
# stop the board — cards would sit in ready — so it is written whether or
# not it differs, rather than left resting on a default a nightly release
# is free to change.
- name: See whether the dispatcher key is written for the host
  ansible.builtin.command:
    cmd: >-
      grep -qE '^[[:space:]]*dispatch_in_gateway:[[:space:]]*true[[:space:]]*$'
      {{ hermes_home }}/.hermes/config.yaml
  become: true
  become_user: "{{ hermes_user }}"
  register: hermes_dispatch_key_probe
  changed_when: false
  failed_when: false

- name: Write the dispatcher key for the host, default or not
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} -p default config set kanban.dispatch_in_gateway true"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  when: hermes_dispatch_key_probe.rc != 0
  changed_when: true
  notify: Restart the hermes gateway

# The two timeouts, here as well as in each profile's .env. A turn served by
# the host reads them from the host's process environment, which is this
# file; a board worker is its own `hermes -p <agent> chat` process and reads
# its profile's .env. Line by line, for the reason the profiles' .env is:
# the rest of this file is upstream's template and stays as it is.
- name: Write the managed settings into the host's .env
  ansible.builtin.lineinfile:
    path: "{{ hermes_home }}/.hermes/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  loop:
    - { key: HERMES_API_TIMEOUT, value: "{{ hermes_api_timeout }}" }
    - { key: HERMES_STREAM_READ_TIMEOUT, value: "{{ hermes_stream_read_timeout }}" }
  loop_control:
    label: "{{ item.key }}"
  notify: Restart the hermes gateway

- name: Look for a paid-provider key in the default profile
  ansible.builtin.command:
    cmd: >-
      grep -lE '^({{ hermes_forbidden_env_keys | join('|') }})=.'
      {{ hermes_home }}/.hermes/.env
  become: true
  become_user: "{{ hermes_user }}"
  register: hermes_default_paid_key_probe
  changed_when: false
  failed_when: false

- name: Refuse a paid-provider key in the default profile
  ansible.builtin.assert:
    that: hermes_default_paid_key_probe.rc != 0
    fail_msg: >-
      {{ hermes_home }}/.hermes/.env — the default profile, which plain
      `hermes` and the host gateway both use — holds one of
      {{ hermes_forbidden_env_keys | join(', ') }}. ADR 0014 allows no
      metered API spend. Remove the line.
    quiet: true

# ------------------------------------------------------------
# The profiles
# ------------------------------------------------------------
#
# One include per agent rather than a loop over blocks, so a failure names
# the agent it happened to and the tasks read as what they are.

# The Google connector, only when the roster gives some agent an account
# (#1220). Before the profiles, because each profile's test starts it.
- name: Install the Google connector at its newest release
  ansible.builtin.pip:
    name: "{{ hermes_google_package }}"
    state: latest  # noqa: package-latest
    virtualenv: "{{ hermes_google_venv }}"
    virtualenv_command: python3 -m venv
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  when: hermes_agents | selectattr('google', 'defined') | list | length > 0
  notify: Restart the hermes gateway

- name: Create and configure each agent's profile
  ansible.builtin.include_tasks: profile.yml
  loop: "{{ hermes_agents }}"
  loop_control:
    loop_var: agent
    label: "{{ agent.name }}"

# ------------------------------------------------------------
# The host gateway (Brizza ADR-0024)
# ------------------------------------------------------------
#
# Last, so every profile is already parked or unparked by the time the
# gateway starts serving them.

# A per-agent unit left on the host would keep polling its agent's bot
# token while the host gateway polls the same one: two processes answering
# one bot. The conversion is `hermes gateway migrate --multiplex`, run once
# by Joseph (runbook), which stops and removes those units and installs the
# host's. The role refuses to go on until it has happened rather than
# repeat half of it.
- name: Look for per-agent gateway units
  ansible.builtin.find:
    paths: "{{ hermes_home }}/.config/systemd/user"
    patterns: "hermes-gateway-*.service"
  register: hermes_per_agent_units

- name: Refuse to start the host gateway beside per-agent ones
  ansible.builtin.assert:
    that: hermes_per_agent_units.matched == 0
    fail_msg: >-
      {{ hermes_per_agent_units.files | map(attribute='path') | map('basename') | join(', ') }}
      still {{ 'exists' if hermes_per_agent_units.matched == 1 else 'exist' }}.
      Brizza ADR-0024 runs the team on one gateway, and a per-agent unit
      beside it would answer the same bot twice. Convert the host once, as
      {{ hermes_user }} on forge-agents: `hermes gateway migrate --multiplex`
      (the runbook has it), then run this play again.
    quiet: true

# Two questions — start it now, and start it on login — answered on the
# command line, and `stdin: ""` so a future prompt fails at once instead of
# hanging under Ansible. `-p default` rather than nothing, so a sticky
# active profile (`hermes profile use`) cannot install the wrong one. On a
# converted host the migration already installed the unit and this skips.
- name: Install the host gateway
  ansible.builtin.command:
    cmd: >-
      {{ hermes_bin }} -p default gateway install
      --no-start-now --no-start-on-login
    creates: "{{ hermes_home }}/.config/systemd/user/{{ hermes_gateway_unit }}"
    stdin: ""
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ hermes_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ hermes_uid }}/bus"

# Started unconditionally: the host gateway is not an agent. Approval is
# per agent and lives in the park markers, so with nothing approved it runs
# and serves nobody but the token-less default profile.
- name: Enable and start the host gateway
  ansible.builtin.systemd_service:
    name: "{{ hermes_gateway_unit }}"
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hermes_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ hermes_uid }}/bus"
  when: not ansible_check_mode

# ------------------------------------------------------------
# What is waiting on Joseph
# ------------------------------------------------------------

- name: Say which agents are parked
  ansible.builtin.debug:
    msg: >-
      {{ hermes_waiting | join(', ') }} {{ 'has' if hermes_waiting | length == 1 else 'have' }}
      a profile but {{ 'is' if hermes_waiting | length == 1 else 'are' }}
      parked, so the host gateway does not serve {{ 'it' if hermes_waiting | length == 1 else 'them' }}.
      Each needs a Discord application with the Message Content and Server
      Members intents, its token on the host, and `approved: true` in the
      roster. ADR 0014 principle 2: nothing starts until you approve its
      first run.
  vars:
    hermes_waiting: "{{ hermes_agents | rejectattr('approved', 'defined') | map(attribute='name') | list
