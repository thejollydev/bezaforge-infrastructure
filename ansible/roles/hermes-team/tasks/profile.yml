---
# ============================================================
# One agent's profile. Included per entry in hermes_agents.
#
# A profile is a whole Hermes home: its own config.yaml, .env, SOUL.md,
# memories, sessions, skills, cron and state.db, under
# ~/.hermes/profiles/<name>/. Nothing is shared with another profile, which
# is what ADR 0014 wanted and why the roster maps onto profiles one to one.
#
# ⚠️ Never point two processes at one profile. Both write memory
# automatically and they corrupt each other. The role's input check refuses
# a repeated name for this reason.
# ============================================================

- name: "See whether the profile exists for {{ agent.name }}"
  ansible.builtin.stat:
    path: "{{ hermes_profiles_dir }}/{{ agent.name }}/config.yaml"
  register: hermes_profile_probe

# Blank rather than cloned. `--clone` would copy another agent's soul and
# curated memories, and every agent here has its own role card; a clone
# would start each one as a copy of Brizza with the wrong name.
- name: "Create the profile for {{ agent.name }}"
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} profile create {{ agent.name }}"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  when: not hermes_profile_probe.stat.exists
  changed_when: true

# Parked straight after it is created, before anything else is written to
# it. One gateway serves every profile on the host (Brizza ADR-0024), and
# `profile create` signals the host to rescan, so a new profile is served
# the moment it exists. An unapproved agent is therefore parked here rather
# than at the end of this file. ADR 0014 principle 2: nothing runs without Joseph's
# approval, and since ADR-0024 the way an agent does not run is the
# gateway.parked marker, which the host skips. The marker's contents are
# irrelevant to Hermes; it only has to exist.
#
# A brand-new profile also has no Discord token yet, so even in the moment
# before this task it has no bot to answer with.
#
# `force: false`, so an existing marker is left as it is and a converged
# host reports no change.
- name: "Park, unless approved, {{ agent.name }}"
  ansible.builtin.copy:
    content: ""
    dest: "{{ hermes_profiles_dir }}/{{ agent.name }}/gateway.parked"
    force: false
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0644'
  when: not (agent.approved | default(false))

# The role card IS the soul (ADR 0014: "the role cards ... are part of this
# decision"). They are authored in the private brizza repository and copied
# verbatim from a checkout of it, so the host's copy is still reviewable in
# a diff rather than pasted into a running agent. Copied, not templated:
# a card is prose, and nothing in it should be read as Jinja.
- name: "Write the soul for {{ agent.name }}"
  ansible.builtin.copy:
    src: "{{ hermes_team_dir }}/souls/{{ agent.soul }}"
    dest: "{{ hermes_profiles_dir }}/{{ agent.name }}/SOUL.md"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0644'
  notify: Restart the hermes gateway

# The Bot Mode marker (see defaults). Merged into profile.yaml rather than
# templated, because Hermes and the desktop app both write that file
# (description, display name, the Bot's title) and a template would drop
# what they wrote. Hermes' own YAML writer does the write, atomically, so a
# crash cannot truncate the file.
- name: "Write the Bot Mode marker for {{ agent.name }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_home }}/.hermes/hermes-agent/venv/bin/python"
      - -c
      - |
        import sys
        from pathlib import Path
        import yaml
        from utils import atomic_yaml_write
        path = Path(sys.argv[1])
        data = (yaml.safe_load(path.read_text()) if path.exists() else None) or {}
        ui_meta = data.get("ui_meta")
        if isinstance(ui_meta, dict) and isinstance(ui_meta.get("hermes-bots"), dict):
            print("present")
        else:
            if not isinstance(ui_meta, dict):
                ui_meta = data["ui_meta"] = {}
            ui_meta["hermes-bots"] = {}
            atomic_yaml_write(path, data, sort_keys=False)
            print("written")
      - "{{ hermes_profiles_dir }}/{{ agent.name }}/profile.yaml"
    chdir: "{{ hermes_home }}/.hermes/hermes-agent"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  register: hermes_bot_marker
  changed_when: hermes_bot_marker.stdout == 'written'
  when: hermes_bot_mode_marker | bool

# ------------------------------------------------------------
# Configuration
# ------------------------------------------------------------
#
# Through `config set` rather than a templated config.yaml: Hermes writes
# that file itself, and a template would fight it on every run — the same
# reason roles/syncthing drives the REST API instead of templating
# config.xml.
#
# Each setting is read first and written only when it differs, so a
# converged host reports no changes.

# `config get` was assumed when this was written — the documentation shows
# `config set` and not its counterpart, and Hermes was installed nowhere to
# check against. Verified on forge-agents 2026-09-20: it exists, and a
# converged host reports no changes here.
#
# ⚠️ IT RESOLVES RATHER THAN READS. The value printed is the effective
# one, defaults included, not what config.yaml holds. So a key sitting at
# its default reads as already set while being absent from the file, and
# this loop will never write it — which is what the host's dispatcher-key
# task in main.yml exists to handle. A key absent from DEFAULT_CONFIG
# prints nothing and exits 1; one present there but null prints `null` and exits 0. Both
# compare unequal to a real value, so both converge on the first run.
- name: "Read the settings already held by {{ agent.name }}"
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} -p {{ agent.name }} config get {{ item.key }}"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  loop: "{{ hermes_profile_settings }}"
  loop_control:
    label: "{{ item.key }}"
  register: hermes_config_probe
  changed_when: false
  failed_when: false
  vars:
    hermes_profile_settings:
      # All three together or not at all: a model name without the custom
      # provider and its base_url is the shape that falls through to a
      # paid API (see defaults).
      - key: model.provider
        value: "{{ hermes_model_provider }}"
      - key: model.base_url
        value: "{{ hermes_model_base_url }}"
      - key: model.default
        value: "{{ agent.model | default(hermes_model_default) }}"
      - key: memory.write_approval
        value: "{{ hermes_memory_write_approval | string | lower }}"
      - key: memory.nudge_interval
        value: "{{ hermes_memory_nudge_interval }}"
      # ⚠️ Unset is UNLIMITED, not a modest default: resolve_turn_limit
      # returns sys.maxsize for a missing agent.max_turns. On every
      # profile, because each turn reads its own profile's config.yaml,
      # under the shared gateway as before; the root file's 500 never
      # reached any of them.
      - key: agent.max_turns
        value: "{{ hermes_agent_max_turns }}"
      # The local fallback, shared by every agent. `fallback_model` is the
      # LEGACY key and that is intentional: `fallback_providers` is the
      # current one and is a LIST, which `config set` cannot write —
      # dotted indices produce a dict keyed by '0' that does not parse as
      # a chain. `get_fallback_chain()` still merges `fallback_model`, and
      # a dict takes dotted scalar sets, so this is what the role can
      # manage. Running `hermes fallback add` interactively would drop it;
      # re-run the role if that happens.
      - key: fallback_model.provider
        value: "{{ hermes_fallback_provider }}"
      - key: fallback_model.model
        value: "{{ hermes_fallback_model }}"
      - key: fallback_model.base_url
        value: "{{ hermes_fallback_base_url }}"
      - key: fallback_model.context_length
        value: "{{ hermes_fallback_context_length }}"
      # The self-improvement review runs on forge-ai, not Codex (see
      # defaults). The model_overrides key is the 64K window the routed
      # review would otherwise misread as 262K; it is keyed by provider and
      # model, so it covers the fallback as well.
      - key: auxiliary.background_review.provider
        value: "{{ hermes_background_review_provider }}"
      - key: auxiliary.background_review.model
        value: "{{ hermes_background_review_model }}"
      - key: auxiliary.background_review.base_url
        value: "{{ hermes_background_review_base_url }}"
      - key: auxiliary.background_review.max_input_tokens
        value: "{{ hermes_background_review_max_input_tokens }}"
      - key: "model_overrides.{{ hermes_background_review_provider }}.{{ hermes_background_review_model }}.context_window"
        value: "{{ hermes_fallback_context_length }}"

# argv rather than a cmd string: `hermes_model_base_url` is deliberately
# empty under an openai-codex primary, and an empty value vanishes from a
# templated command line — leaving `config set model.base_url` with no
# value, a usage error and a non-zero exit. argv keeps it as an argument.
- name: "Set what differs for {{ agent.name }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_bin }}"
      - -p
      - "{{ agent.name }}"
      - config
      - set
      - "{{ item.item.key }}"
      - "{{ item.item.value }}"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  loop: "{{ hermes_config_probe.results }}"
  loop_control:
    label: "{{ item.item.key }} = {{ item.item.value }}"
  # Exact, not substring. `config get` prints a bare value and nothing
  # else, so this converges on every key above — and a substring test
  # would read max_in_progress=4 as already satisfied by a stored 14.
  when: item.item.value | string != item.stdout | default('') | trim
  changed_when: true
  notify: Restart the hermes gateway

# A profile created after the default profile was pointed at the local model
# inherits that profile's model.context_length (65536). On an agent whose
# primary is Codex that caps a 272K model at 64K: the session banner reads
# "Context: 65K tokens (config)" where an older profile reads "272K tokens
# (detected)". The key belongs to the local endpoint only; the fallback
# carries its own fallback_model.context_length. So it is removed from any
# agent whose provider detects its window itself. `config get` exits
# non-zero when the key is absent, which is the converged state.
- name: "Read an inherited context length for {{ agent.name }}"
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} -p {{ agent.name }} config get model.context_length"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  register: hermes_context_length_probe
  changed_when: false
  failed_when: false
  when: hermes_model_provider == 'openai-codex'

- name: "Remove the inherited context length from {{ agent.name }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_bin }}"
      - -p
      - "{{ agent.name }}"
      - config
      - unset
      - model.context_length
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  when:
    - hermes_model_provider == 'openai-codex'
    - hermes_context_length_probe.rc == 0
    - (hermes_context_length_probe.stdout | trim) not in ['', 'null', 'None']
  changed_when: true
  notify: Restart the hermes gateway

# The board's settings left over from one gateway per agent. Since Brizza
# ADR-0024 the dispatcher runs in the host gateway and reads kanban.* from
# the root config only (main.yml writes them there), so these copies decide
# nothing. They are removed rather than left, because a profile still
# saying `dispatch_in_gateway: false` misleads whoever reads it, and
# `hermes -p <agent> kanban` reads it to report whether the board is being
# dispatched. A no-op once they are gone.
- name: "Look for board settings left in the profile of {{ agent.name }}"
  ansible.builtin.command:
    cmd: >-
      grep -qE '^[[:space:]]+{{ item }}:'
      {{ hermes_profiles_dir }}/{{ agent.name }}/config.yaml
  become: true
  become_user: "{{ hermes_user }}"
  loop:
    - dispatch_in_gateway
    - max_in_progress
    - max_in_progress_per_profile
  register: hermes_stale_kanban_probe
  changed_when: false
  failed_when: false

- name: "Remove them from the profile of {{ agent.name }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_bin }}"
      - -p
      - "{{ agent.name }}"
      - config
      - unset
      - "kanban.{{ item.item }}"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  loop: "{{ hermes_stale_kanban_probe.results }}"
  loop_control:
    label: "kanban.{{ item.item }}"
  when: item.rc == 0
  changed_when: true

# ------------------------------------------------------------
# Never4gA, over MCP (#1217; Brizza ADR 0016)
# ------------------------------------------------------------
#
# One entry in the profile's config.yaml. Compared whole, and replaced
# whole when it differs: setting keys one by one over an old entry would
# leave a key nobody set any more (a `tools.include` from an interactive
# `hermes mcp add`, say) quietly narrowing what the agent sees.
#
# `--actor` names the agent, so a document it writes into the vault
# records who wrote it (core/02 section 5.2) rather than `mcp/never4ga`.

- name: "Read the Never4gA server held by {{ agent.name }}"
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} -p {{ agent.name }} config get mcp_servers.{{ hermes_never4ga_mcp_name }}"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  register: hermes_never4ga_mcp_probe
  changed_when: false
  failed_when: false
  when: hermes_never4ga_mcp_enabled

- name: "Replace the Never4gA server for {{ agent.name }}"
  when:
    - hermes_never4ga_mcp_enabled
    - >-
      hermes_never4ga_mcp_probe.rc != 0
      or (hermes_never4ga_mcp_probe.stdout | from_yaml) != hermes_never4ga_mcp_wanted
  vars:
    hermes_never4ga_mcp_wanted:
      command: "{{ hermes_never4ga_mcp_command }}"
      args:
        - --vault
        - "{{ hermes_never4ga_vault_path }}"
        - --actor
        - "hermes-{{ agent.name }}/{{ agent.model | default(hermes_model_default) }}"
      tools:
        exclude: "{{ hermes_never4ga_mcp_exclude }}"
      enabled: true
  block:
    - name: "Remove the old entry for {{ agent.name }}"
      ansible.builtin.command:
        argv:
          - "{{ hermes_bin }}"
          - -p
          - "{{ agent.name }}"
          - config
          - unset
          - "mcp_servers.{{ hermes_never4ga_mcp_name }}"
      become: true
      become_user: "{{ hermes_user }}"
      environment:
        HOME: "{{ hermes_home }}"
      when: hermes_never4ga_mcp_probe.rc == 0
      changed_when: true

    # JSON for the two lists: `config set` parses the value, and a JSON
    # list lands as a YAML list.
    - name: "Write the Never4gA server for {{ agent.name }}"
      ansible.builtin.command:
        argv:
          - "{{ hermes_bin }}"
          - -p
          - "{{ agent.name }}"
          - config
          - set
          - "mcp_servers.{{ hermes_never4ga_mcp_name }}.{{ item.key }}"
          - "{{ item.value }}"
      become: true
      become_user: "{{ hermes_user }}"
      environment:
        HOME: "{{ hermes_home }}"
      loop:
        - { key: command, value: "{{ hermes_never4ga_mcp_wanted.command }}" }
        - { key: args, value: "{{ hermes_never4ga_mcp_wanted.args | to_json }}" }
        - { key: tools.exclude, value: "{{ hermes_never4ga_mcp_wanted.tools.exclude | to_json }}" }
        - { key: enabled, value: "true" }
      loop_control:
        label: "{{ item.key }}"
      changed_when: true
      notify: Restart the hermes gateway

# The test that fails without this: the profile's own `mcp test` starts the
# server the way a gateway will and lists what it offers. Every run, not
# once, because the server is a separate install (roles/never4ga) that can
# break under this one.
- name: "Test the Never4gA server from the profile of {{ agent.name }}"
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} -p {{ agent.name }} mcp test {{ hermes_never4ga_mcp_name }}"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  register: hermes_never4ga_mcp_test
  changed_when: false
  failed_when: >-
    hermes_never4ga_mcp_test.rc != 0
    or 'never4ga_context_startup' not in hermes_never4ga_mcp_test.stdout
  when: hermes_never4ga_mcp_enabled

# ------------------------------------------------------------
# The board, from chat
# ------------------------------------------------------------
#
# Joseph hands out work by talking to Brizza, and she puts it on the board.
# That needs the `kanban` toolset on her Discord platform, which is off by
# default: a gateway agent without it cannot create a card from a chat, and
# nothing he types in Discord reaches the board. With it, a card she
# creates from his chat subscribes that chat to the card's end, so she is
# woken when it finishes and brings him the result.
#
# Only the agent marked `orchestrates` gets it (ADR 0014: she orchestrates).
# The others do not need it in chat — the dispatcher gives the workers it
# spawns their board tools itself — and it is taken back from any agent no
# longer marked, so the roster stays the one place this is decided.
#
# ⚠️ ENABLING ONE TOOLSET SAVES THE WHOLE DISCORD SELECTION. Until then the
# platform follows upstream's defaults; afterwards config.yaml holds an
# explicit list (today's 17 defaults plus kanban), and a toolset a later
# release turns on by default does not appear for her on Discord by
# itself. Verified in a throwaway home 2026-09-20: the CLI selection is
# untouched and a second enable changes nothing.
#
# `tools list` has no machine-readable form, so the state is read from its
# text. "disabled" does not contain "enabled", which keeps the match exact.
- name: "Read whether the board is usable from Discord for {{ agent.name }}"
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} -p {{ agent.name }} tools list --platform discord"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  register: hermes_chat_toolsets_probe
  changed_when: false

- name: "Give or take the board in Discord for {{ agent.name }}"
  ansible.builtin.command:
    cmd: >-
      {{ hermes_bin }} -p {{ agent.name }} tools
      {{ 'enable' if hermes_orchestrates | bool else 'disable' }}
      kanban --platform discord
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  vars:
    hermes_orchestrates: "{{ agent.orchestrates | default(false) | bool }}"
    hermes_has_board: >-
      {{ hermes_chat_toolsets_probe.stdout is search('(^|\s)enabled\s+kanban\s') }}
  when: hermes_orchestrates | bool != hermes_has_board | bool
  changed_when: true
  notify: Restart the hermes gateway

# ------------------------------------------------------------
# Discord
# ------------------------------------------------------------
#
# The role writes no token. It writes the settings around one, and reports
# whether the credential has arrived.

# ------------------------------------------------------------
# The profile's .env
# ------------------------------------------------------------
#
# Line by line rather than templated, because the file is shared: the role
# owns the settings below, and Joseph owns the DISCORD_BOT_TOKEN line. A
# template would overwrite his token on every run; lineinfile edits only
# the keys it is given and leaves every other line alone.
#
# 0600 because the token will be in here.

- name: "Write the managed settings into the .env for {{ agent.name }}"
  ansible.builtin.lineinfile:
    path: "{{ hermes_profiles_dir }}/{{ agent.name }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  loop:
    - { key: DISCORD_ALLOWED_USERS, value: "{{ hermes_discord_allowed_users }}" }
    - { key: DISCORD_ALLOW_BOTS, value: "{{ hermes_discord_allow_bots }}" }
    - { key: DISCORD_HISTORY_BACKFILL, value: "{{ hermes_discord_history_backfill | string | lower }}" }
    - { key: DISCORD_HISTORY_BACKFILL_LIMIT, value: "{{ hermes_discord_history_backfill_limit }}" }
    - { key: HERMES_API_TIMEOUT, value: "{{ hermes_api_timeout }}" }
    - { key: HERMES_STREAM_READ_TIMEOUT, value: "{{ hermes_stream_read_timeout }}" }
  loop_control:
    label: "{{ item.key }}"
  notify: Restart the hermes gateway

- name: "Look for a paid-provider key in the .env for {{ agent.name }}"
  ansible.builtin.command:
    cmd: >-
      grep -lE '^({{ hermes_forbidden_env_keys | join('|') }})=.'
      {{ hermes_profiles_dir }}/{{ agent.name }}/.env
  become: true
  become_user: "{{ hermes_user }}"
  register: hermes_paid_key_probe
  changed_when: false
  failed_when: false

# ADR 0014 principle 3, enforced. The provider settings above keep the
# agents on forge-ai's Ollama; this is what makes a mistake in them fail
# instead of bill, because a fallback to a paid API has nothing to pay with.
- name: "Refuse a paid-provider key for {{ agent.name }}"
  ansible.builtin.assert:
    that: hermes_paid_key_probe.rc != 0
    fail_msg: >-
      {{ hermes_profiles_dir }}/{{ agent.name }}/.env holds one of
      {{ hermes_forbidden_env_keys | join(', ') }}. ADR 0014 allows no
      metered API spend, and a key there is what lets a misrouted request
      bill instead of failing. Remove the line; a subscription such as
      Codex is added with `hermes -p {{ agent.name }} auth add`, which
      stores an OAuth login in auth.json rather than a key here.
    quiet: true

- name: "Check whether a Discord token has been placed for {{ agent.name }}"
  ansible.builtin.command:
    cmd: "grep -q '^DISCORD_BOT_TOKEN=.' {{ hermes_profiles_dir }}/{{ agent.name }}/.env"
  become: true
  become_user: "{{ hermes_user }}"
  register: hermes_token_probe
  changed_when: false
  failed_when: false

- name: "Say what is missing for {{ agent.name }}"
  ansible.builtin.debug:
    msg: >-
      {{ agent.name }} has no DISCORD_BOT_TOKEN in its .env, so it has no
      bot to answer with. Create the application in Discord's developer portal with
      the Message Content and Server Members intents enabled, then put the
      token in {{ hermes_profiles_dir }}/{{ agent.name }}/.env. Without
      those intents the bot receives events with empty text and cannot see
      what was typed.
  when: hermes_token_probe.rc != 0

# ------------------------------------------------------------
# The weekly memory summary (Brizza ADR-0026)
# ------------------------------------------------------------
#
# One Hermes scheduled job per agent, installed here so a rebuilt host has
# it. Hermes keeps a profile's jobs in <profile>/cron/jobs.json as
# {"jobs": [...]}, and the CLI has no machine-readable list, so the file is
# read directly and the job found by name. Created when missing, edited
# when its schedule, prompt or delivery differs, left alone otherwise.
#
# Installed for every roster entry, approved or not: a parked profile is not
# served, and the host ticks cron only for served profiles, so an unapproved
# agent's job does not run until Joseph approves the agent.

- name: "Read the scheduled jobs of {{ agent.name }}"
  ansible.builtin.slurp:
    src: "{{ hermes_profiles_dir }}/{{ agent.name }}/cron/jobs.json"
  register: hermes_jobs_file
  failed_when: false

- name: "Find the memory summary job of {{ agent.name }}"
  ansible.builtin.set_fact:
    hermes_summary_job: >-
      {{ ((hermes_jobs_file.content | default('') | b64decode | from_json).jobs
          if hermes_jobs_file.content is defined else [])
         | selectattr('name', 'equalto', hermes_memory_summary_job_name)
         | first | default({}) }}

- name: "Create the memory summary job for {{ agent.name }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_bin }}"
      - -p
      - "{{ agent.name }}"
      - cron
      - create
      - --name
      - "{{ hermes_memory_summary_job_name }}"
      - --deliver
      - "{{ hermes_memory_summary_deliver }}"
      - "{{ hermes_memory_summary_schedule }}"
      - "{{ hermes_memory_summary_prompt }}"
    stdin: ""
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  when: hermes_summary_job | length == 0
  changed_when: true

# `schedule_display` is what Hermes stores for the expression it was given,
# so comparing it to the wanted string is exact for a cron expression.
- name: "Correct the memory summary job of {{ agent.name }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_bin }}"
      - -p
      - "{{ agent.name }}"
      - cron
      - edit
      - "{{ hermes_summary_job.id }}"
      - --schedule
      - "{{ hermes_memory_summary_schedule }}"
      - --prompt
      - "{{ hermes_memory_summary_prompt }}"
      - --deliver
      - "{{ hermes_memory_summary_deliver }}"
    stdin: ""
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  when:
    - hermes_summary_job | length > 0
    - >-
      hermes_summary_job.schedule_display | default('') != hermes_memory_summary_schedule
      or hermes_summary_job.prompt | default('') != hermes_memory_summary_prompt
      or hermes_summary_job.deliver | default('') != hermes_memory_summary_deliver
  changed_when: true

# ------------------------------------------------------------
# Approval
# ------------------------------------------------------------
#
# The host gateway serves every profile that is not parked (Brizza
# ADR-0024), so an approved agent is unparked here, last, after the checks
# below have passed. An agent with approval but no token is unparked too and
# simply has no bot until Joseph places one: the host rescans each served
# profile's .env every 30 seconds and picks the token up by itself.

# An approved agent with no allowlist would come online and deny everyone,
# Joseph included — safe, and indistinguishable from broken. Refuse it here
# with the reason, rather than let him debug a silent bot.
# The team moved to Codex as its primary 2026-09-20, and the credential is
# an OAuth login Joseph completes per profile — the role cannot create it
# and deliberately holds no key. An approved agent whose login is missing
# would start, take every message, and fail every turn at the provider.
#
# `auth status` exits 0 either way, so the state is in the text: a profile
# with no credential answers "openai-codex: logged out".
- name: "Read the Codex login state for {{ agent.name }}"
  ansible.builtin.command:
    cmd: "{{ hermes_bin }} -p {{ agent.name }} auth status {{ hermes_model_provider }}"
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_home }}"
  register: hermes_codex_probe
  changed_when: false
  failed_when: false
  when: hermes_model_provider == 'openai-codex'

- name: "Require a Codex login before starting {{ agent.name }}"
  ansible.builtin.assert:
    that: "'logged out' not in (hermes_codex_probe.stdout | default(''))"
    fail_msg: >-
      {{ agent.name }} is approved and its primary provider is
      {{ hermes_model_provider }}, but no Codex login is reachable, so every
      turn would fail at the provider. Complete it ONCE as {{ hermes_user }}
      on the host, with NO profile flag — `{{ hermes_bin }} auth add
      {{ hermes_model_provider }}` — which covers every agent. Codex is a
      single-use-refresh provider, so Hermes keeps one grant at the root and
      strips per-profile copies: `-p {{ agent.name }}` appears to succeed,
      prints "Added ... credential #1", and is then discarded on the next
      read. Over SSH it needs a terminal (ssh -t) and prints a URL to
      authorize. The local fallback does not cover this: a gateway with no
      primary credential fails before the fallback chain is reached.
    quiet: true
  when:
    - agent.approved | default(false)
    - hermes_model_provider == 'openai-codex'

- name: "Require an allowlist before starting {{ agent.name }}"
  ansible.builtin.assert:
    that: hermes_discord_allowed_users | length > 0
    fail_msg: >-
      {{ agent.name }} is approved but hermes_discord_allowed_users is empty,
      so it would deny every message, yours included. Set it to your Discord
      user ID in host_vars (Discord: Settings → Advanced → Developer Mode,
      then right-click your name → Copy User ID).
    quiet: true
  when: agent.approved | default(false)

# ADR 0014 principle 2, enforced rather than described: an agent is served
# when Joseph has said so for that agent, and not because the role reached
# this line. The host notices within 30 seconds (its rescan interval); so
# does it notice a marker the task near the top of this file put back.
- name: "Unpark, approved, {{ agent.name }}"
  ansible.builtin.file:
    path: "{{ hermes_profiles_dir }}/{{ agent.name }}/gateway.parked"
    state: absent
  when: agent.approved | default(false)
