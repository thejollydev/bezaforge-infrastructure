---
# ============================================================
# adguard role defaults
#
# Most AdGuard config is set via the web UI on first install
# (and intentionally NOT managed by this role — see the comment
# at the top of tasks/main.yml). But a few keys are worth pinning
# in code so they survive container rebuilds + a fresh setup
# wizard pass.
# ============================================================

# Query log retention. AdGuard's default after the setup wizard
# is 2160h (90 days), which writes a huge JSON log of every DNS
# query made on the LAN. For a homelab with ~6 devices doing
# thousands of queries/day, that climbs into the GB. 7 days is
# long enough to investigate "what was that weird DNS query"
# without the unbounded growth.
#
# IMPORTANT — store this as "7d", NOT "168h" (same duration).
# AdGuard canonicalizes the interval to days in AdGuardHome.yaml on
# container start, so a stored "168h" gets rewritten to "7d". That
# made the enforce task flap: Ansible writes 168h → AdGuard rewrites
# to 7d → next run sees a diff → restarts AdGuard, every single run.
# Matching AdGuard's own canonical form keeps it idempotent.
# (Found by the #493 dry-run idempotency audit, 2026-07-19.)
#
# AdGuard prunes existing entries on the next maintenance pass
# when this value is decreased.
#
# ⚠️ RAISED 7d -> 30d AFTER THE PICTURE-FRAME INCIDENT (#962, #964).
# The frame's C2 lookups were present in the FIRST MINUTE of retained
# log, so the infection could not be dated — "since when" is the first
# question in an incident and ~8 days of log could not answer it. 30d
# trades disk (the 90d default grew the volume to ~3 GB by 2026-05-17;
# expect roughly a third of that) for a month of incident-dating floor.
# Revisit toward 90d if the next incident is older than the window.
adguard_querylog_interval: "30d"

# ------------------------------------------------------------
# Blocklist reconciliation (#964)
# ------------------------------------------------------------
# Codified after the picture-frame incident (#962): the compromised
# device made 51,298 DNS queries in the retained log and AdGuard
# filtered ZERO of them — not the DGA C2 domains (kav.xcjvme.cc,
# fry.zupkix.cc, tikolkkj49df.site...), not the ad-fraud SDK endpoints,
# and not the public DoH resolvers it was probing to escape local DNS
# entirely. Whatever lists were enabled did not cover threat traffic,
# and nothing in code said what SHOULD be enabled.
#
# Same reconciliation shape as the rewrites above: add what is missing,
# report extras loudly, prune only on explicit opt-in. Compared on URL
# only — the name is cosmetic and the UI may hold its own.
adguard_blocklists_manage: true

# Both lists are HaGeZi's, in adblock syntax, maintained daily.
#   tif.txt  Threat Intelligence Feeds — malware, phishing, DGA/C2,
#            botnet domains (covers the BADBOX/Vo1d family the frame
#            matched). This is the list whose absence #964 is about.
#   doh.txt  Encrypted DNS endpoints — doh.pub, cloudflare-dns.com,
#            dns.google and several hundred more. Blocking the HOSTNAME
#            lookup is the cheap half of closing the DoH bypass; a
#            device that cannot resolve the resolver falls back to
#            port-53 DNS, which is the visible path. (Does not affect
#            AdGuard's own DoH upstreams — upstream traffic is not
#            filtered through the blocklists.) The thorough half —
#            forcing 53 to the local resolver and dropping outbound
#            853/known-DoH-IPs at the gateway — belongs with #963's ACL
#            work, not here.
# ⚠️ THE THIRD LIST MUST BE SERVED FROM A PUBLICLY RESOLVABLE HOST, and
# that is not a preference — it is a hard constraint discovered in
# deployment on 2026-09-02. This pointed at git.bezaforge.dev (Gitea, the
# fetch remote) and AdGuard rejected it with HTTP 400:
#     Couldn't fetch filter ... no addresses for host "git.bezaforge.dev"
# AdGuard resolves FILTER URLs through its own configured upstreams, not
# through the rewrite table it serves to clients — so an internal-only
# name is invisible to it. The confusing part, and the reason this was
# not caught earlier: `wget` from inside the very same container resolves
# git.bezaforge.dev perfectly, because that path uses the container's
# system resolver, which is AdGuard itself. Testing reachability from the
# container proves nothing about what AdGuard's own fetcher can resolve.
#
# So it is served from the GitHub mirror. Every repository here pushes to
# GitHub, GitLab and Gitea in one `git push`, so the mirror carries
# identical content and updating the list is still a git commit.
#
# ⚠️ THE THIRD LIST IS THE HONEST ONE. TIF was verified 2026-09-01 to
# contain NONE of the eleven C2/DGA domains the frame actually queried
# (checked as ||<registrable-domain>^ against the 2.19M-rule feed). A
# public feed protects against classes of threat; only the local list
# protects against the traffic this network has actually seen. It lives
# in this repo (roles/adguard/files/bezaforge-threat-blocklist.txt) and
# is served to AdGuard through Gitea raw — anonymous read verified —
# so updating it is a git commit, and a device asking for those names
# again lights up as IsFiltered in the query log: a tripwire, not just
# a block.
adguard_blocklists:
  - name: "HaGeZi Threat Intelligence Feeds"
    url: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.txt"
  - name: "HaGeZi Encrypted DNS Servers"
    url: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/doh.txt"
  - name: "BezaForge local threat blocklist"
    url: "https://raw.githubusercontent.com/thejollydev/bezaforge-infrastructure/main/ansible/roles/adguard/files/bezaforge-threat-blocklist.txt"

# Same deliberate stance as adguard_rewrites_prune: removing a filter
# list from the fleet's primary resolver on the strength of a list being
# complete is opt-in, never default. Extras are reported every run.
#   --tags adguard -e adguard_blocklists_prune=true
adguard_blocklists_prune: false

# ------------------------------------------------------------
# DNS rewrite reconciliation (#649)
# ------------------------------------------------------------
# The rewrite table is the ONE piece of AdGuard's app config that has a
# correctness invariant shared with another machine: dnsmasq on
# forge-hypervisor must answer identically (#638). Everything else here
# (upstreams, block lists, admin credentials) is AdGuard-only — no mirror,
# no parity risk — and is deliberately still hand-managed. That was a scope
# decision, not an oversight; see the role header.
#
# Reconciled through AdGuard's control API rather than by editing
# AdGuardHome.yaml. AdGuard owns that file and rewrites it on every UI
# change and on shutdown, so an Ansible edit made while the container runs
# can be silently overwritten before the restart handler lands. The API has
# no such race, needs no restart, and is idempotent by construction here
# because the tasks loop over the DIFF rather than over the whole table.
adguard_rewrites_manage: true

# Where the control API lives. production_ip is forge-ops' VLAN-20 address,
# which is also the address AdGuard binds (hardcoded in docker-compose.yml
# for the systemd-resolved-on-127.0.0.53 reason documented in tasks).
adguard_api_url: "http://{{ production_ip }}:3053"

# ⚠️ DELETION IS OPT-IN AND OFF BY DEFAULT.
# Pruning means removing rewrites from the fleet's PRIMARY resolver based on
# a list being complete — and if it is not complete, the failure lands on
# internal name resolution for everything. With this false, unmanaged extras
# are reported loudly and left alone, which is enough to satisfy #649's
# "drift is detected rather than discovered during an outage" without
# handing a list file the power to break DNS.
#
# Turn it on deliberately, once a run has shown you exactly what it would
# remove:  --tags adguard -e adguard_rewrites_prune=true
adguard_rewrites_prune: false
