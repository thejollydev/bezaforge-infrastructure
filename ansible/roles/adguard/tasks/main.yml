---
# ============================================================
# adguard role — AdGuard Home DNS server
#
# AdGuard Home provides:
# - Internal DNS for *.bezaforge.dev (via DNS rewrites)
# - Network-wide ad blocking
# - DNS-over-HTTPS upstream to Cloudflare/Google
#
# Dependencies: docker role (bezaforge-net must exist)
#
# NOTE: AdGuard's application config lives in conf/AdGuardHome.yaml
# inside the Docker volume, set up via the web UI during Phase 1.
# This role manages that config only in PART — know which part:
#
#   MANAGED   DNS rewrites — reconciled from group_vars/all's
#             `bezaforge_dns_rewrites` through the control API (#649).
#             They are managed because they are the one piece with a
#             correctness invariant shared with a SECOND machine:
#             dnsmasq on forge-hypervisor must answer identically (#638).
#   MANAGED   Query log retention (adguard_querylog_interval).
#   MANAGED   Blocklists — reconciled from `adguard_blocklists` through
#             the control API (#964). Promoted out of UNMANAGED after the
#             picture-frame incident: the enabled lists filtered zero of
#             a botnet's 51k queries, and nothing in code said what
#             should have been enabled.
#   UNMANAGED Upstream servers, admin credentials, client settings.
#             AdGuard-only, no mirror, no parity risk — a DR-rebuild
#             concern rather than a drift concern. Excluded from #649
#             deliberately, to keep the change surface on a live DNS
#             server small. Codifying them is unfiled follow-on work.
#
# On a fresh rebuild you would need to:
# 1. Run this role to deploy the container
# 2. Open http://10.10.20.20:3053 to complete the setup wizard
# 3. Set the admin credentials to match vault_adguard_admin_user /
#    vault_adguard_admin_password in host_vars/forge-ops/vault.yml —
#    without them this role cannot reach the control API at all
# 4. Re-run this role; it restores the DNS rewrites and the
#    blocklists by itself
# 5. Re-add upstreams by hand (see 04-adguard-home.md)
# ============================================================

# ------------------------------------------------------------
# Data directories
# ------------------------------------------------------------
# AdGuard stores its config in 'conf/' and working data
# (query logs, stats, filtering databases) in 'work/'.
# These are mounted as Docker volumes so data persists
# across container restarts and image upgrades.
#
# Owned by root because the AdGuard container runs as root
# internally — it needs to bind to port 53, which is a
# privileged port (below 1024).

- name: Create AdGuard data directories
  ansible.builtin.file:
    path: "{{ bezaforge_root }}/adguard/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - conf
    - work

# ------------------------------------------------------------
# Docker Compose
# ------------------------------------------------------------
# The compose file is a plain copy (not a template) because
# it contains no secrets or host-specific values — the
# production IP is hardcoded since AdGuard must bind to
# 10.10.20.20 specifically (not 0.0.0.0) to avoid conflicts
# with systemd-resolved on 127.0.0.53.
#
# Port 3053 maps to AdGuard's internal port 3000 (web UI).
# We use 3053 externally to avoid conflicts — port 3000 is
# commonly used by other services (Grafana uses it too).

- name: Deploy AdGuard docker-compose.yml
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ bezaforge_root }}/adguard/docker-compose.yml"
    owner: joseph
    group: joseph
    mode: '0644'
  notify: restart adguard

# ------------------------------------------------------------
# Start AdGuard
# ------------------------------------------------------------

- name: Start AdGuard
  community.docker.docker_compose_v2:
    project_src: "{{ bezaforge_root }}/adguard"
    state: present

# ------------------------------------------------------------
# Query log retention enforcement
# ------------------------------------------------------------
# AdGuard's web UI setup wizard sets the query log retention to
# 2160h (90 days) by default, which grew /opt/bezaforge/adguard/
# to ~3 GB by 2026-05-17. This task pins the value in code so:
#   1. A fresh setup wizard pass after a rebuild doesn't silently
#      reintroduce the 90-day default.
#   2. Drift from manual UI changes is caught on the next Ansible
#      run.
#
# 'after' + 'before' scope the regex to the querylog: section
# only, so we never accidentally match statistics:'s interval.
# Triggers 'restart adguard' on actual change — AdGuard reads
# this on container start (and mutates it in-memory thereafter).

- name: Enforce AdGuard query log retention
  # Inline (?s) flag enables DOTALL so '.' matches newlines, which lets
  # us bind the regex to the querylog: block specifically (via a non-greedy
  # match between the section header and its 'interval:' key). This is more
  # robust than the after/before anchors I tried first — those silently
  # no-op'd in the 2026-05-17 deploy, likely due to a subtle CR/whitespace
  # issue or the way after/before scope interacts with the multiline regex.
  ansible.builtin.replace:
    path: "{{ bezaforge_root }}/adguard/conf/AdGuardHome.yaml"
    regexp: '(?s)(querylog:.*?\n  interval:)[ \t]+\S+'
    replace: '\1 {{ adguard_querylog_interval }}'
  notify: restart adguard

# ------------------------------------------------------------
# DNS rewrite reconciliation (#649)
# ------------------------------------------------------------
# Makes group_vars/all's `bezaforge_dns_rewrites` the single source of truth
# for BOTH resolvers: this reconciles it into AdGuard, roles/dnsmasq renders
# the subset the wildcard does not cover. Before #649 the table was hand-kept
# on both sides and nothing detected them drifting.
#
# Idempotent by construction: the add/prune loops iterate the DIFF, so a
# converged fleet performs zero API calls and reports changed=0.
#
# ⚠️ Compared on domain+answer ONLY. RewriteEntry also carries `enabled`
# (v0.107.78 schema, confirmed against the openapi for that exact tag), and
# including it would make every converged run look like a diff — the source
# list does not express it and AdGuard defaults it to true on add.

- name: Read AdGuard's live rewrite table
  ansible.builtin.uri:
    url: "{{ adguard_api_url }}/control/rewrite/list"
    method: GET
    user: "{{ vault_adguard_admin_user }}"
    password: "{{ vault_adguard_admin_password }}"
    force_basic_auth: true
    return_content: true
  register: adguard_live_rewrites
  changed_when: false
  # Runs even under --check. The uri module has no check-mode support, so it
  # would otherwise be skipped and leave every fact below undefined — which
  # means a dry run could not show you the plan, the one thing a dry run of
  # this is for. Reading a rewrite table changes nothing.
  check_mode: false
  no_log: true          # the request carries the admin password
  when: adguard_rewrites_manage | bool

# Reduce both sides to [domain, answer] pairs so they can be set-differenced.
# Deliberately NOT json_query — that filter needs the jmespath library on the
# target, and this runs on forge-ops where nothing else requires it.
- name: Reduce both rewrite tables to comparable domain/answer pairs
  ansible.builtin.set_fact:
    adguard_live_pairs: >-
      {{ adguard_live_rewrites.json | map(attribute='domain')
         | zip(adguard_live_rewrites.json | map(attribute='answer'))
         | map('list') | list }}
    adguard_desired_pairs: >-
      {{ bezaforge_dns_rewrites | map(attribute='domain')
         | zip(bezaforge_dns_rewrites | map(attribute='answer'))
         | map('list') | list }}
  when: adguard_rewrites_manage | bool

- name: Determine the rewrite differences
  ansible.builtin.set_fact:
    adguard_pairs_to_add: "{{ adguard_desired_pairs | difference(adguard_live_pairs) }}"
    adguard_pairs_to_prune: "{{ adguard_live_pairs | difference(adguard_desired_pairs) }}"
  when: adguard_rewrites_manage | bool

# Printed BEFORE acting, and safe to print — pairs contain no secrets. On the
# very first run after #649 both lists must be empty: the source list was
# transcribed from this API, so a non-empty diff means the transcription is
# wrong, and that property is the migration's test.
- name: Report the rewrite reconciliation plan
  ansible.builtin.debug:
    msg:
      - "codified records : {{ bezaforge_dns_rewrites | length }}"
      - "live in AdGuard  : {{ adguard_live_pairs | length }}"
      - "to add           : {{ adguard_pairs_to_add | length }}"
      - "  {{ adguard_pairs_to_add | map('join', '=') | join(', ') | default('(none)', true) }}"
      - "unmanaged extras : {{ adguard_pairs_to_prune | length }}"
      - "  {{ adguard_pairs_to_prune | map('join', '=') | join(', ') | default('(none)', true) }}"
      - "prune enabled    : {{ adguard_rewrites_prune | bool | ternary('YES - extras above will be DELETED', 'no - extras left in place') }}"
  when: adguard_rewrites_manage | bool

- name: Add codified rewrites that AdGuard is missing
  ansible.builtin.uri:
    url: "{{ adguard_api_url }}/control/rewrite/add"
    method: POST
    user: "{{ vault_adguard_admin_user }}"
    password: "{{ vault_adguard_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      domain: "{{ item[0] }}"
      answer: "{{ item[1] }}"
    status_code: [200]
  loop: "{{ adguard_pairs_to_add | default([]) }}"
  loop_control:
    label: "{{ item[0] }} -> {{ item[1] }}"
  no_log: true          # the request carries the admin password
  when: adguard_rewrites_manage | bool

- name: Remove rewrites AdGuard holds that are not codified
  ansible.builtin.uri:
    url: "{{ adguard_api_url }}/control/rewrite/delete"
    method: POST
    user: "{{ vault_adguard_admin_user }}"
    password: "{{ vault_adguard_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      domain: "{{ item[0] }}"
      answer: "{{ item[1] }}"
    status_code: [200]
  loop: "{{ adguard_pairs_to_prune | default([]) }}"
  loop_control:
    label: "{{ item[0] }} -> {{ item[1] }}"
  no_log: true          # the request carries the admin password
  when:
    - adguard_rewrites_manage | bool
    - adguard_rewrites_prune | bool

# Warn rather than fail. An extra rewrite is not broken DNS — AdGuard will
# happily answer it — but it IS a name dnsmasq does not know, so it would
# resolve differently the moment AdGuard went away. That is worth a loud
# line every run until someone either codifies it or prunes it.
- name: WARN about unmanaged rewrites left in place
  ansible.builtin.debug:
    msg: >-
      WARNING — AdGuard holds {{ adguard_pairs_to_prune | length }} rewrite(s)
      not in bezaforge_dns_rewrites:
      {{ adguard_pairs_to_prune | map('join', '=') | join(', ') }}.
      dnsmasq does NOT know these names, so they would resolve differently
      during an AdGuard outage. Either add them to group_vars/all/vars.yml or
      re-run with -e adguard_rewrites_prune=true to delete them.
  when:
    - adguard_rewrites_manage | bool
    - adguard_pairs_to_prune | default([]) | length > 0
    - not (adguard_rewrites_prune | bool)

# ------------------------------------------------------------
# Blocklist reconciliation (#964)
# ------------------------------------------------------------
# Same shape as the rewrite reconciliation above, for the same reason it
# was built there: the picture-frame incident (#962) showed the enabled
# blocklists covered none of the threat traffic, and nothing in code
# said what should be enabled. See defaults/main.yml for the list
# rationale. Compared on URL only — AdGuard assigns its own ids and the
# display name is cosmetic.

- name: Read AdGuard's live filter list
  ansible.builtin.uri:
    url: "{{ adguard_api_url }}/control/filtering/status"
    method: GET
    user: "{{ vault_adguard_admin_user }}"
    password: "{{ vault_adguard_admin_password }}"
    force_basic_auth: true
    return_content: true
  register: adguard_live_filtering
  changed_when: false
  # Same reasoning as the rewrite read: uri has no check-mode support,
  # and a dry run that cannot show the plan is useless. Reading changes
  # nothing.
  check_mode: false
  no_log: true          # the request carries the admin password
  when: adguard_blocklists_manage | bool

- name: Reduce both filter sets to comparable URLs
  ansible.builtin.set_fact:
    adguard_live_filter_urls: >-
      {{ adguard_live_filtering.json.filters | default([], true)
         | map(attribute='url') | list }}
    adguard_live_disabled_urls: >-
      {{ adguard_live_filtering.json.filters | default([], true)
         | rejectattr('enabled') | map(attribute='url') | list }}
    adguard_desired_filter_urls: >-
      {{ adguard_blocklists | map(attribute='url') | list }}
  when: adguard_blocklists_manage | bool

- name: Determine the blocklist differences
  ansible.builtin.set_fact:
    adguard_blocklists_to_add: >-
      {{ adguard_blocklists
         | rejectattr('url', 'in', adguard_live_filter_urls) | list }}
    adguard_blocklist_urls_to_prune: >-
      {{ adguard_live_filter_urls | difference(adguard_desired_filter_urls) }}
  when: adguard_blocklists_manage | bool

- name: Report the blocklist reconciliation plan
  ansible.builtin.debug:
    msg:
      - "codified lists   : {{ adguard_blocklists | length }}"
      - "live in AdGuard  : {{ adguard_live_filter_urls | length }}"
      - "to add           : {{ adguard_blocklists_to_add | length }}"
      - "  {{ adguard_blocklists_to_add | map(attribute='url') | join(', ') | default('(none)', true) }}"
      - "unmanaged extras : {{ adguard_blocklist_urls_to_prune | length }}"
      - "  {{ adguard_blocklist_urls_to_prune | join(', ') | default('(none)', true) }}"
      - "prune enabled    : {{ adguard_blocklists_prune | bool | ternary('YES - extras above will be DELETED', 'no - extras left in place') }}"
  when: adguard_blocklists_manage | bool

# add_url both registers the list and triggers its first download, and
# it enables the list by default — no separate refresh call is needed.
- name: Add codified blocklists that AdGuard is missing
  ansible.builtin.uri:
    url: "{{ adguard_api_url }}/control/filtering/add_url"
    method: POST
    user: "{{ vault_adguard_admin_user }}"
    password: "{{ vault_adguard_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ item.name }}"
      url: "{{ item.url }}"
      whitelist: false
    status_code: [200]
  loop: "{{ adguard_blocklists_to_add | default([]) }}"
  loop_control:
    label: "{{ item.url }}"
  no_log: true          # the request carries the admin password
  when: adguard_blocklists_manage | bool

# A list that is PRESENT but switched off is the same false green #964
# is about — declared protection that protects nothing. Fail rather than
# warn: unlike an unmanaged extra, this is a direct contradiction of the
# codified intent, and silently continuing would let a UI toggle undo
# the whole feature without a trace.
- name: FAIL if a codified blocklist is present but disabled
  ansible.builtin.assert:
    that:
      - adguard_desired_filter_urls | intersect(adguard_live_disabled_urls)
        | length == 0
    fail_msg: >-
      Codified blocklist(s) exist in AdGuard but are DISABLED:
      {{ adguard_desired_filter_urls | intersect(adguard_live_disabled_urls) | join(', ') }}.
      Re-enable them in the UI (Filters -> DNS blocklists) or remove them
      from adguard_blocklists — a declared list that is switched off is
      protection the code claims and the resolver does not provide.
  when: adguard_blocklists_manage | bool

- name: Remove blocklists AdGuard holds that are not codified
  ansible.builtin.uri:
    url: "{{ adguard_api_url }}/control/filtering/remove_url"
    method: POST
    user: "{{ vault_adguard_admin_user }}"
    password: "{{ vault_adguard_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      url: "{{ item }}"
      whitelist: false
    status_code: [200]
  loop: "{{ adguard_blocklist_urls_to_prune | default([]) }}"
  loop_control:
    label: "{{ item }}"
  no_log: true          # the request carries the admin password
  when:
    - adguard_blocklists_manage | bool
    - adguard_blocklists_prune | bool

- name: WARN about unmanaged blocklists left in place
  ansible.builtin.debug:
    msg: >-
      WARNING — AdGuard holds {{ adguard_blocklist_urls_to_prune | length }}
      blocklist(s) not in adguard_blocklists:
      {{ adguard_blocklist_urls_to_prune | join(', ') }}.
      Either codify them in roles/adguard/defaults/main.yml or re-run with
      -e adguard_blocklists_prune=true to delete them.
  when:
    - adguard_blocklists_manage | bool
    - adguard_blocklist_urls_to_prune | default([]) | length > 0
    - not (adguard_blocklists_prune | bool)
