---
# ============================================================
# fileshare — Samba share + live RW rclone Google Drive mount
# on forge-hypervisor (ADR 0003 Bucket B)
# ============================================================

# --- service user ----------------------------------------------------
- name: Create fileshare group
  ansible.builtin.group:
    name: "{{ fileshare_group }}"
    gid: "{{ fileshare_gid }}"

- name: Create fileshare service user
  ansible.builtin.user:
    name: "{{ fileshare_user }}"
    uid: "{{ fileshare_uid }}"
    group: "{{ fileshare_group }}"
    shell: /usr/sbin/nologin
    home: "/home/{{ fileshare_user }}"
    create_home: true
    system: false

# --- storage ----------------------------------------------------------
# The pool + dataset are still created by hand (see defaults/main.yml), but
# IMPORT and BOOT PERSISTENCE are owned here.
#
# Why: sharepool is not a PVE storage, so nothing imported it at boot. It was
# imported by hand at creation (2026-06-28) and silently vanished on the first
# reboot after that (2026-07-25). /sharepool/files disappeared for ~24 h —
# Samba share down, rclone Drive mount down, sanoid CRITICAL every 15 min,
# syncoid failing nightly, agent-VM mounts dead, and restic quietly dropped
# the source while still exiting 0. bezapool survives reboots only because
# PVE imports it (it is cachefile=none). Never rely on a manual import again.
- name: Check whether the sharepool ZFS pool is imported
  ansible.builtin.command: zpool list -H -o name {{ fileshare_zpool }}
  register: fileshare_pool
  changed_when: false
  failed_when: false

- name: Import the sharepool ZFS pool if it is not currently imported
  ansible.builtin.command: zpool import {{ fileshare_zpool }}
  when: fileshare_pool.rc != 0
  changed_when: true

# Boot persistence is owned by a PER-POOL `zfs-import@<pool>.service` — the
# same mechanism PVE uses for bezapool — and explicitly NOT by
# /etc/zfs/zpool.cache.
#
# The cache-file approach was tried first (#552) and is UNFIXABLE on a
# Proxmox host. Proven against a real reboot on 2026-07-30 (#560):
#
#   zfs-import@.service carries `Before=zfs-import-cache.service` and runs
#     zpool import -N -d /dev/disk/by-id -o cachefile=none <pool>
#
#   Importing bezapool that way makes the ZFS module rewrite
#   /etc/zfs/zpool.cache from the set of imported pools using the DEFAULT
#   cachefile. At that instant that set is EMPTY — bezapool is
#   cachefile=none and sharepool is not imported yet — so the module writes
#   a ZERO-BYTE cache. One second later zfs-import-cache.service fails its
#   ConditionFileNotEmpty and skips. Timeline from that boot:
#     20:51:52.147  zfs-import@bezapool.service starts
#     20:51:54.743  /etc/zfs/zpool.cache truncated to 0 bytes
#     20:51:55.293  zfs-import-cache.service SKIPPED, unmet condition
#   `Before=` makes this deterministic, not a race. Every boot.
#
# The old tasks did `zpool set cachefile=` then asserted the file was
# non-empty. That assertion passed on every single Ansible run — you had
# just written the file — while the mechanism it claimed to prove had never
# once worked. ASSERT THE MECHANISM, NOT THE ARTIFACT.
- name: Enable boot-time import of the sharepool ZFS pool
  ansible.builtin.systemd:
    name: "zfs-import@{{ fileshare_zpool }}.service"
    enabled: true

# Deliberately a separate read-back rather than trusting the task above:
# this is the one property whose failure is invisible until a reboot, which
# is exactly how #552 stayed hidden for a month.
#
# noqa justified: the systemd module's return value reports what it just
# did; `systemctl is-enabled` interrogates the live unit-file state
# independently. service_facts is unreliable for template instances
# (zfs-import@<pool>). Given this role's history of asserting the wrong
# thing, the independent read is the point of the task.
- name: Assert boot-time import of sharepool is enabled (else it will NOT survive a reboot)  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-enabled zfs-import@{{ fileshare_zpool }}.service
  register: fileshare_import_unit
  changed_when: false
  check_mode: false
  failed_when: fileshare_import_unit.stdout | trim != 'enabled'

- name: Assert sharepool/files dataset is mounted at the expected path
  ansible.builtin.command: zfs list -H -o mountpoint {{ fileshare_zpool }}/files
  register: fileshare_ds
  changed_when: false
  failed_when: fileshare_ds.stdout | trim != fileshare_root

# Guard rail: if the pool were ever missing, /sharepool would be a plain
# directory on the 68 G root filesystem, and the tasks below would happily
# create the share + rclone cache there — putting a ~350 G Drive mount on the
# boot disk. Refuse to continue unless the path is genuinely a ZFS mountpoint.
- name: Assert the share root is a real ZFS mount, not a root-fs directory
  ansible.builtin.command: findmnt -no FSTYPE --target {{ fileshare_root }}
  register: fileshare_fstype
  changed_when: false
  failed_when: fileshare_fstype.stdout | trim != 'zfs'

- name: Ensure share root + cache dirs exist with correct ownership
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ fileshare_user }}"
    group: "{{ fileshare_group }}"
    mode: "0775"
  loop:
    - "{{ fileshare_root }}"
    - "{{ fileshare_drive_mountpoint }}"   # empty mountpoint when rclone is down
    - "{{ fileshare_cache_dir }}"

# --- rclone (Drive RW mount) ------------------------------------------
- name: Install pinned upstream rclone .deb {{ fileshare_rclone_version }}
  ansible.builtin.apt:
    deb: "https://downloads.rclone.org/v{{ fileshare_rclone_version }}/rclone-v{{ fileshare_rclone_version }}-linux-amd64.deb"

- name: Allow non-owner access to FUSE mounts (Samba must read the mount)
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    regexp: '^#?\s*user_allow_other'
    line: user_allow_other
    state: present

- name: Ensure rclone config dir for {{ fileshare_user }}
  ansible.builtin.file:
    path: "/home/{{ fileshare_user }}/.config/rclone"
    state: directory
    owner: "{{ fileshare_user }}"
    group: "{{ fileshare_group }}"
    mode: "0700"

- name: Deploy rclone config (Drive RW remote — secrets from vault)
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "/home/{{ fileshare_user }}/.config/rclone/rclone.conf"
    owner: "{{ fileshare_user }}"
    group: "{{ fileshare_group }}"
    mode: "0600"
    # Seed once, then hands-off — rclone rewrites the refreshed OAuth
    # token into this file at runtime, so a managed template would
    # differ on every run and needlessly restart the Drive mount
    # (via the handler below). force:false creates it on a fresh host
    # and lets rclone own it thereafter. To push a structural change,
    # delete the file on the host and re-run.
    # (Idempotency fix from the #493 dry-run audit, 2026-07-19.)
    force: false
  no_log: true
  notify: restart rclone gdrive mount

- name: Deploy rclone Drive mount systemd unit
  ansible.builtin.template:
    src: rclone-gdrive-mount.service.j2
    dest: /etc/systemd/system/rclone-gdrive-mount.service
    mode: "0644"
  notify: restart rclone gdrive mount

- name: Enable + start the rclone Drive mount
  ansible.builtin.systemd:
    name: rclone-gdrive-mount.service
    enabled: true
    state: started
    daemon_reload: true

# --- Samba ------------------------------------------------------------
- name: Install Samba
  ansible.builtin.apt:
    name: samba
    state: present
    update_cache: true

- name: Deploy smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    validate: testparm -s %s
    mode: "0644"
  notify: restart samba

- name: Set the Samba password (idempotent) for user {{ fileshare_user }}
  ansible.builtin.shell: >-
    set -o pipefail;
    printf '%s\n%s\n' '{{ vault_fileshare_smb_password }}' '{{ vault_fileshare_smb_password }}'
    | smbpasswd -s -a {{ fileshare_user }}
  args:
    executable: /bin/bash
  register: fileshare_smbpw
  changed_when: "'Added user' in fileshare_smbpw.stdout"
  no_log: true

- name: Enable + start Samba
  ansible.builtin.systemd:
    name: smbd
    enabled: true
    state: started
