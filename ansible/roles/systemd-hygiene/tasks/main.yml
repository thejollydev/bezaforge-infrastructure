---
# ============================================================
# systemd-hygiene — mask units that can never succeed on a host
# ============================================================
# A permanently-failed unit is not harmless. It pins
# node_systemd_unit_state{state="failed"} above zero forever, so the Grafana
# failed-unit alert added with #552 would page on it every time and train us
# to ignore the one generic signal that would have caught the sharepool
# outage. Masking the impossible ones is what keeps "a unit failed" meaningful.

- name: Mask units that cannot succeed on this host
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
    enabled: false
    state: stopped
  loop: "{{ systemd_masked_units }}"

# Masking does NOT clear a unit that has already failed. It stays in
# `systemctl --failed` -- and therefore in node_systemd_unit_state{state="failed"}
# -- until its state is explicitly reset, so without this the mask silences
# nothing and the #552 alert pages forever anyway. Caught by health.yml on the
# first run after masking openipmi.service on forge-hypervisor.
- name: Check whether a masked unit is still in the failed state  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-failed {{ item | quote }}
  register: systemd_hygiene_failed
  changed_when: false
  failed_when: false
  loop: "{{ systemd_masked_units }}"

- name: Reset the failed state of masked units  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl reset-failed {{ item.item | quote }}
  when: item.stdout | trim == 'failed'
  changed_when: true
  loop: "{{ systemd_hygiene_failed.results }}"
  loop_control:
    label: "{{ item.item }}"
