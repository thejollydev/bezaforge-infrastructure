---
# Installed with apt's default Recommends, to match forge-ai: that brings
# prometheus-node-exporter-collectors and, through it, ipmitool, jq,
# nvme-cli and smartmontools.
#
# ⚠️ ipmitool depends on openipmi, whose service can only start on a board
# with a BMC. On forge-hypervisor it sits failed and is masked through
# systemd_masked_units; on forge-ai (checked 2026-09-14) it is quietly
# inactive. If the "Systemd Unit Failed" rule names openipmi.service on a
# host this role manages, mask it the same way in that host's host_vars —
# not by dropping Recommends here, which would also drop the collectors.
node_exporter_packages:
  - prometheus-node-exporter

# Matches /etc/default/prometheus-node-exporter on forge-ai (2026-09-14).
# The systemd collector feeds the "Systemd Unit Failed" alert.
node_exporter_args: "--collector.systemd"

# --- User services ---
# The systemd collector reads the SYSTEM manager only. Everything a user
# runs under its own manager -- on forge-agents, until it was retired on
# 2026-10-21, the Hermes gateway and the agents' timers -- was invisible to
# the "Systemd Unit Failed" rule: Prometheus listed only user@1000.service
# for that host (2026-10-17). No host uses this role since forge-agents
# went; it stays for the next host that runs user services.
#
# For each user named here, a root timer asks that user's manager for its
# services and writes their state to the textfile directory as
# node_systemd_user_unit_state, in the systemd collector's own shape plus a
# `user` label. The alert reads both metrics. Empty on hosts with no
# user services worth watching.
node_exporter_user_unit_owners: []
node_exporter_textfile_dir: /var/lib/prometheus/node-exporter
node_exporter_user_units_every: 1min
