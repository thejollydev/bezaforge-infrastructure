---
# ============================================================
# node-exporter role — the distro Prometheus node_exporter
#
# Installs Debian/Ubuntu's prometheus-node-exporter the way forge-ai and
# forge-erp already run it (by hand, before this role existed): the
# package with its default Recommends, which bring the collectors package
# and its apt/nvme/smartmon textfile timers, and the systemd collector
# switched on so the "Systemd Unit Failed" rule can see the host.
#
# The textfile directory the fleet's own metrics are written to
# (/var/lib/prometheus/node-exporter, by dns-client and deploy-stamp) is
# the package's default, so nothing here configures it.
#
# Scrape side: roles/monitoring/files/prometheus.yml on forge-ops.
# Firewall: roles/common allows tcp/9100 from common_monitoring_sources,
# which is why site.yml places this role after `common`.
# ============================================================

- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name: "{{ node_exporter_packages }}"
    state: present
    update_cache: true

- name: Set the node_exporter arguments
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: '^ARGS='
    line: 'ARGS="{{ node_exporter_args }}"'
  notify: restart prometheus-node-exporter

- name: Enable and start prometheus-node-exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started

# ------------------------------------------------------------
# User services (see defaults: node_exporter_user_unit_owners)
# ------------------------------------------------------------

- name: Install the user-service reporter
  ansible.builtin.template:
    src: user-unit-state.py.j2
    dest: /usr/local/sbin/user-unit-state
    owner: root
    group: root
    mode: '0755'
  when: node_exporter_user_unit_owners | length > 0

- name: Install the user-service reporter's service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - user-unit-state.service
    - user-unit-state.timer
  when: node_exporter_user_unit_owners | length > 0

- name: Enable the user-service reporter
  ansible.builtin.systemd_service:
    name: user-unit-state.timer
    daemon_reload: true
    enabled: true
    state: started
  when:
    - node_exporter_user_unit_owners | length > 0
    - not ansible_check_mode

# The test that fails without this: one report, read back. The user
# manager must have answered, and the gateway's own service must be in it.
- name: Report the user services once, now
  ansible.builtin.command:
    cmd: /usr/local/sbin/user-unit-state
  changed_when: false
  when:
    - node_exporter_user_unit_owners | length > 0
    - not ansible_check_mode

- name: Read the report back
  ansible.builtin.slurp:
    src: "{{ node_exporter_textfile_dir }}/user_units.prom"
  register: node_exporter_user_report
  when:
    - node_exporter_user_unit_owners | length > 0
    - not ansible_check_mode

- name: Require every owner's manager in the report
  ansible.builtin.assert:
    that:
      - >-
        ('node_systemd_user_units_read{user="' ~ item ~ '"} 1')
        in (node_exporter_user_report.content | b64decode)
    fail_msg: >-
      The user manager of {{ item }} did not answer the reporter, so its
      services are still unwatched. Run /usr/local/sbin/user-unit-state as
      root and read what it prints.
    quiet: true
  loop: "{{ node_exporter_user_unit_owners }}"
  when:
    - node_exporter_user_unit_owners | length > 0
    - not ansible_check_mode
