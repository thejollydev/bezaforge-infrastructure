---
# ============================================================
# monitoring role — full observability stack
#
# Deploys three compose stacks:
# 1. Prometheus + Node Exporter + cAdvisor (metrics collection)
# 2. Grafana (dashboards and visualization)
# 3. Loki + Promtail (log aggregation)
#
# Together these give you the "three pillars of observability":
# - Metrics (Prometheus) — numeric time-series data like CPU,
#   memory, request counts. Queried with PromQL.
# - Logs (Loki) — text log streams from containers and system.
#   Queried with LogQL in Grafana.
# - Dashboards (Grafana) — visualizes both metrics and logs
#   in a single UI.
#
# Dependencies: docker role, traefik role (for HTTPS routing)
# Secrets: grafana_admin_password (in ansible-vault)
# ============================================================

# ============================================================
# PROMETHEUS + NODE EXPORTER + cADVISOR
# ============================================================

# ------------------------------------------------------------
# Prometheus config
# ------------------------------------------------------------
# prometheus.yml defines scrape targets — the endpoints
# Prometheus polls every 15s for metrics. Each job_name is
# a logical group:
#
# - prometheus (self-monitoring)
# - node-exporter-* (host-level CPU/memory/disk/network from
#   each BezaForge host running node_exporter)
# - cadvisor (per-container resource usage on forge-ops)
# - netbox (application metrics from NetBox)
#
# Targets on the same Docker network use container names
# (e.g., 'node-exporter:9100'). Remote hosts use IPs
# (e.g., '10.10.50.10:9100' for forge-ai).

- name: Deploy Prometheus scrape config
  ansible.builtin.copy:
    src: prometheus.yml
    dest: "{{ bezaforge_root }}/prometheus/prometheus.yml"
    owner: joseph
    group: joseph
    mode: '0644'
  notify: restart prometheus

# ------------------------------------------------------------
# Prometheus compose stack
# ------------------------------------------------------------
# Three containers in one compose file:
#
# prometheus — the time-series database. Scrapes targets,
# stores metrics for 30 days (--storage.tsdb.retention.time).
# Exposed via Traefik at prometheus.bezaforge.dev.
#
# node-exporter — collects host metrics (CPU, memory, disk,
# network). Runs with pid: host to see all host processes,
# not just container processes. Mounts /proc, /sys, and /
# as read-only to gather system stats.
#
# cadvisor (Container Advisor) — Google's container metrics
# collector. Runs privileged to access /dev/kmsg (kernel
# messages) and Docker internals. Provides per-container
# CPU, memory, network, and filesystem metrics.

- name: Deploy Prometheus docker-compose.yml
  ansible.builtin.copy:
    src: prometheus-compose.yml
    dest: "{{ bezaforge_root }}/prometheus/docker-compose.yml"
    owner: joseph
    group: joseph
    mode: '0644'
  notify: restart prometheus

- name: Start Prometheus stack
  community.docker.docker_compose_v2:
    project_src: "{{ bezaforge_root }}/prometheus"
    state: present

# ============================================================
# GRAFANA
# ============================================================

# ------------------------------------------------------------
# Grafana compose
# ------------------------------------------------------------
# Grafana is the visualization layer — it queries Prometheus
# (for metrics) and Loki (for logs) and renders dashboards.
#
# The compose file is a template because it contains the admin
# password from ansible-vault. GF_SECURITY_ADMIN_PASSWORD sets
# the initial admin password — after first login, Grafana stores
# it in its SQLite database, so changing this env var alone
# won't change an existing password. You'd need to use the
# Grafana UI or CLI to reset it.
#
# mode 0600 because the rendered file contains the password.

- name: Deploy Grafana docker-compose.yml
  ansible.builtin.template:
    src: grafana-compose.yml.j2
    dest: "{{ bezaforge_root }}/grafana/docker-compose.yml"
    owner: joseph
    group: joseph
    mode: '0600'
  notify: restart grafana

# ------------------------------------------------------------
# Grafana filesystem provisioning — datasources + dashboards
# ------------------------------------------------------------
# Dashboards live in repo under files/grafana/dashboards/ and
# are bind-mounted read-only into the container. The provider
# config at files/grafana/provisioning/dashboards/bezaforge.yaml
# tells Grafana to auto-import them. See
# docs/runbooks/grafana-dashboards-export.md for how to capture
# new dashboards from the live UI back into version control.
#
# Datasources are also provisionable (drop a YAML in
# files/grafana/provisioning/datasources/). Left empty by
# default because the existing Grafana SQLite DB already
# has Prometheus + Loki datasources defined manually; this
# scaffolding is ready when you decide to migrate them.

- name: Ensure Grafana provisioning + dashboards directories exist
  ansible.builtin.file:
    path: "{{ bezaforge_root }}/grafana/{{ item }}"
    state: directory
    owner: "472"   # Grafana container UID
    group: "472"
    mode: '0755'
  loop:
    - provisioning
    - provisioning/dashboards
    - provisioning/datasources
    - provisioning/alerting
    - dashboards

- name: Sync Grafana provisioning + dashboards from repo
  ansible.builtin.copy:
    src: "grafana/{{ item }}/"
    dest: "{{ bezaforge_root }}/grafana/{{ item }}/"
    owner: "472"
    group: "472"
    mode: '0644'
    directory_mode: '0755'
  loop:
    - provisioning
    - dashboards
  notify: restart grafana

# Contact points carry the Discord webhook secret, so they're templated
# from ansible-vault rather than copied as a static file (FORGE-58). The
# alert rules themselves (provisioning/alerting/alert-rules.yaml) are
# synced as static files above — they must NOT be templated, as their
# annotations contain Go-template {{ $labels.* }} expressions Jinja would
# mangle.
- name: Provision Grafana Discord contact point (webhook from vault)
  ansible.builtin.template:
    src: grafana-alerting-contact-points.yaml.j2
    dest: "{{ bezaforge_root }}/grafana/provisioning/alerting/contact-points.yaml"
    owner: "472"
    group: "472"
    mode: '0644'
  notify: restart grafana

- name: Start Grafana
  community.docker.docker_compose_v2:
    project_src: "{{ bezaforge_root }}/grafana"
    state: present

# ============================================================
# LOKI + PROMTAIL
# ============================================================

# ------------------------------------------------------------
# Loki config
# ------------------------------------------------------------
# Loki is configured for single-node filesystem storage —
# chunks (compressed log data) and indexes (TSDB) are stored
# on disk under /loki/. The v13 schema with TSDB store is
# required by Loki 3.x (older boltdb-shipper schemas are
# no longer supported).
#
# reject_old_samples_max_age: 168h — Loki rejects log entries
# older than 7 days. This prevents backfilling issues when
# Promtail catches up after being offline.

- name: Deploy Loki config
  ansible.builtin.copy:
    src: loki-config.yml
    dest: "{{ bezaforge_root }}/loki/config.yml"
    owner: joseph
    group: joseph
    mode: '0644'
  notify: restart loki

# ------------------------------------------------------------
# Promtail config
# ------------------------------------------------------------
# Promtail is the log shipper — it tails log files and
# container stdout/stderr, then pushes them to Loki.
#
# Two scrape jobs:
# 1. system — tails /var/log/*.log for host-level logs
#    (syslog, auth, kernel). The __path__ label tells Promtail
#    which files to watch.
# 2. docker — auto-discovers all containers via the Docker
#    socket. relabel_configs extract container name, log stream,
#    and compose service/project labels for filtering in Grafana.

- name: Deploy Promtail config
  ansible.builtin.copy:
    src: promtail-config.yml
    dest: "{{ bezaforge_root }}/loki/promtail-config.yml"
    owner: joseph
    group: joseph
    mode: '0644'
  notify: restart loki

# ------------------------------------------------------------
# Loki + Promtail compose stack
# ------------------------------------------------------------
# Loki binds to 10.10.20.20:3100 — this is the push endpoint
# that Promtail sends logs to, and the query endpoint that
# Grafana reads from.
#
# Promtail runs as root (user: root) because it needs to:
# 1. Read the Docker socket (owned by root:docker)
# 2. Read system log files in /var/log/ (various owners)
# This is the standard Promtail deployment approach.
#
# Its positions file (read offsets, one per log file) is bind-mounted from
# promtail-positions/ rather than left in the container. On the container
# filesystem it was destroyed by every recreate, so each deploy made Promtail
# re-tail every file from byte 0 and replay weeks of already-shipped logs —
# rejected by Loki as older than reject_old_samples_max_age (168h) while the
# replay burned the ingestion rate limit that current logs needed.
# root-owned because Promtail writes it as uid 0.

- name: Ensure Promtail positions directory exists
  ansible.builtin.file:
    path: "{{ bezaforge_root }}/loki/promtail-positions"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy Loki docker-compose.yml
  ansible.builtin.copy:
    src: loki-compose.yml
    dest: "{{ bezaforge_root }}/loki/docker-compose.yml"
    owner: joseph
    group: joseph
    mode: '0644'
  notify: restart loki

- name: Start Loki stack
  community.docker.docker_compose_v2:
    project_src: "{{ bezaforge_root }}/loki"
    state: present

# ------------------------------------------------------------
# Deploy-drift watcher (#671)
# ------------------------------------------------------------
# roles/deploy-stamp records, on every host, which commit each role was
# last deployed from. This is the half that reads those stamps back out of
# Prometheus, compares them against main via the Gitea API, and publishes
# a number the "Deploy Drift" Grafana rule alerts on.
#
# Four times a merged PR has sat undeployed with nothing reporting it
# (#649, #164, #552, and the 2026-05 homepage icon). Both 2026-08-11
# instances were found only because a full --check sweep was demanded by
# hand. See defaults/main.yml for why this runs here on forge-ops.
- name: Configure the deploy-drift watcher
  when:
    - monitoring_deploy_drift_monitor | bool
    - not ansible_check_mode
  block:

    # python3 is present on forge-ops today, but the check is worthless
    # without it and would fail in the confusing direction — no summary
    # line, which the wrapper reports as INVALID. Declare the dependency
    # rather than inherit it. Stdlib only; no pip, no venv.
    - name: Ensure python3 is installed (the drift check is built on it)
      ansible.builtin.apt:
        name: python3
        state: present

    - name: Ensure the node_exporter textfile directory exists
      ansible.builtin.file:
        path: "{{ monitoring_deploy_drift_metric_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    # Copied from the repo's scripts/ rather than duplicated into files/.
    # Two copies of a drift checker is the same bug it exists to catch.
    - name: Deploy the drift check script (verbatim from scripts/)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/deploy-drift-check.py"
        dest: "{{ monitoring_deploy_drift_check_script }}"
        owner: root
        group: root
        mode: '0755'

    - name: Deploy the drift metric wrapper
      ansible.builtin.template:
        src: deploy-drift-metric.sh.j2
        dest: "{{ monitoring_deploy_drift_metric_script }}"
        owner: root
        group: root
        mode: '0755'

    - name: Deploy the drift check service and timer
      ansible.builtin.template:
        src: "deploy-drift-check.{{ item }}.j2"
        dest: "/etc/systemd/system/bezaforge-deploy-drift-check.{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - service
        - timer
      notify: monitoring reload systemd

    - name: Flush handlers so the unit exists before the timer is enabled
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the drift check timer
      ansible.builtin.systemd:
        name: bezaforge-deploy-drift-check.timer
        enabled: true
        state: started
        daemon_reload: true

    # Without this the metric is absent until the first timer fire, and an
    # absent series is indistinguishable from a healthy one in Grafana —
    # the alert would be silently unarmed on a freshly-deployed host. Same
    # reasoning as roles/dns-client's and roles/dnsmasq's equivalent steps.
    - name: Run the drift check once now so the metric exists immediately
      ansible.builtin.command: "{{ monitoring_deploy_drift_metric_script }}"
      changed_when: false
