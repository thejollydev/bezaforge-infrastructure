apiVersion: 1
groups:
    - orgId: 1
      name: BezaForge-Alerts
      folder: BezaForge Alerts
      interval: 1m
      rules:
        # ⚠️ SCOPED, AND IT MUST STAY SCOPED (#676, 2026-08-22). This rule was
        # a bare `up`, which was correct while every target was a host. The
        # blackbox job added fourteen more `up` series whose instance label is
        # a URL, not a host — so an unscoped `up` would fire fourteen times
        # saying "https://pm.bezaforge.dev is down" the moment the PROBER
        # died, which is neither true nor actionable.
        #
        # The exclusion is deliberately narrow: it drops `blackbox-http` only.
        # The prober's own health is scraped as the separate `blackbox-exporter`
        # job with instance="blackbox", so it stays covered here and reads
        # correctly — the thing that cannot measure is still watched.
        - uid: afg8q41305tdsd
          title: Host Down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: builder
                expr: up{job!="blackbox-http"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: OK
          for: 1m
          keepFiringFor: 5m
          annotations:
            summary: '{{ $labels.instance }} is down'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: efg8qceg7nbb4e
          title: High CPU
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: builder
                exemplar: false
                expr: avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
                instant: true
                interval: "5"
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: OK
          for: 1m
          keepFiringFor: 5m
          annotations:
            summary: '{{ $labels.instance }} CPU above 90%'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: afg8qhi5sb5dsa
          title: Disk Space Low
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: code
                expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.2
                        type: lt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: NoData
          execErrState: OK
          for: 5m
          keepFiringFor: 10m
          annotations:
            summary: '{{ $labels.instance }} disk above 80%'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: ffg8qmo7d222oc
          title: Container Restarting
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: builder
                expr: changes(container_start_time_seconds{name!=""}[10m])
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: OK
          for: 1m
          annotations:
            summary: Container {{ $labels.name }} is restarting
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: efg8qt5s28xz4e
          title: Ollama Down
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: builder
                expr: node_systemd_unit_state{instance="forge-ai", name="ollama.service", state="active"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: NoData
          execErrState: OK
          for: 1m
          keepFiringFor: 5m
          annotations:
            summary: forge-ai Ollama inference unavailable
          isPaused: false
          notification_settings:
            receiver: Discord
        # Added 2026-07-26 after the sharepool incident: forge-hypervisor was
        # rebooted, the sharepool ZFS pool failed to import, and sanoid threw
        # CRITICAL every 15 minutes for ~24 h with nobody alerted. A failed
        # systemd unit is the earliest generic signal that a host is degraded.
        # Covers forge-hypervisor / forge-ai / forge-erp, which
        # run the NATIVE prometheus-node-exporter (systemd collector enabled),
        # AND forge-ops — corrected 2026-08-09. This comment used to say
        # forge-ops was "NOT covered yet", which stopped being true the moment
        # the same 2026-07-26 change added `user: root` + the private D-Bus
        # socket + --collector.systemd to the containerised exporter. It is
        # demonstrably covered: this rule fired for forge-ops on 2026-08-09
        # (bezaforge-backup-rsync.service).
        - uid: bfg9sysunitfail01
          title: Systemd Unit Failed
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: code
                expr: node_systemd_unit_state{state="failed"} == 1
                instant: true
                intervalMs: 1000
                legendFormat: '{{ $labels.instance }} / {{ $labels.name }}'
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 15m
          annotations:
            summary: 'systemd unit {{ $labels.name }} has FAILED on {{ $labels.instance }}'
            description: 'Check with: systemctl status {{ $labels.name }} --no-pager'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: bfg9dnsprimary01
          title: DNS Not Using Primary
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: code
                expr: bezaforge_dns_primary_in_use == 0
                instant: true
                intervalMs: 1000
                legendFormat: '{{ $labels.instance }}'
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 30m
          annotations:
            summary: '{{ $labels.instance }} is resolving via the SECONDARY DNS server, not AdGuard'
            description: 'systemd-resolved failed over and does not fail back on its own, so this persists silently: the host loses ad-filtering and vanishes from AdGuard query logs while everything looks healthy. Any adguard container restart can cause it. Fix (about 1s of DNS interruption): ansible forge-ops,forge-ai,forge-erp -i inventory/hosts.yml -m systemd -a "name=systemd-resolved state=restarted" --become --ask-become-pass --ask-vault-pass — ALSO run "sudo systemctl restart systemd-resolved" on the workstation, which parks identically but is not in the inventory and runs no dns-client role, so it emits no metric and THIS ALERT CANNOT SEE IT. On 2026-08-09 the workstation was parked three separate times in one session and a human caught it every time.'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: bfg9dnsparity01
          title: DNS Resolvers Disagree
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: code
                expr: bezaforge_dns_parity_exit_code > 0
                instant: true
                intervalMs: 1000
                legendFormat: '{{ $labels.instance }}'
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 30m
          annotations:
            summary: 'AdGuard and dnsmasq are answering internal names differently (exit code {{ $values.A }})'
            description: 'The primary (AdGuard 10.10.20.20) and secondary (dnsmasq 10.10.10.10) resolvers no longer agree. This is invisible in normal operation because AdGuard answers everything — it only bites during an AdGuard outage, when nobody is placed to debug DNS. Exit code 1 = the resolvers DISAGREE; check bezaforge_dns_parity_mismatches. Exit code 2 = a resolver went SILENT so the comparison is INVALID (not a pass, not a parity failure — fix the resolver first); check bezaforge_dns_parity_unanswered. Diagnose with: scripts/dns-parity-check.sh -v. Both sides derive from bezaforge_dns_rewrites in group_vars/all (#649), so a real disagreement usually means a rewrite was added in the AdGuard web UI instead of in code — put it in the list and run site.yml --tags adguard,dnsmasq.'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: bfg9deploydrift01
          title: Deploy Drift
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: code
                expr: bezaforge_deploy_drift_exit_code > 0
                instant: true
                intervalMs: 1000
                legendFormat: '{{ $labels.instance }}'
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 6h
          annotations:
            summary: 'A change merged to main has never been deployed to at least one host (exit code {{ $values.A }})'
            description: 'A merged PR changes a file in git and changes nothing on any host until ansible-playbook runs. Nothing used to detect the gap — CI went green, the repo read as correct, no alert fired. This has bitten four times (#649 alert inert for a day, #164 digest undeployed for two, #552 an entire safety-net remediation undeployed, and the 2026-05 homepage icon) and every instance was found by hand or not at all. Exit code 1 = at least one host is BEHIND main on at least one role; bezaforge_deploy_drift_roles carries how many pairs. Exit code 2 = the check is INVALID and NOT a pass — either Gitea/Prometheus was unreachable, or a host was deployed from a DIRTY working tree so its stamp names a commit that does not describe what is running (see bezaforge_deploy_drift_dirty), or no host has ever run roles/deploy-stamp so there is nothing to compare, or a stamp names a role that is not in git (bezaforge_deploy_drift_unknown) which means those hosts are NOT being checked and a pass would be a false green — check for an exported_ label prefix, which means a scrape-config label of the same name overwrote the one this metric set. Diagnose with: scripts/deploy-drift-check.py -v (add --hosts to see which hosts report stamps at all). The fix is to deploy the roles it names and then verify the LIVE artifact rather than the PLAY RECAP — a tag-scoped run only touches the tags you name, which is exactly how #649 and #164 were missed. The 6h window means merging and deploying in one session never nags. Only ansible/roles/** is compared, so docs-only and CI-only commits are structurally incapable of firing this.'
          isPaused: false
          notification_settings:
            receiver: Discord
        # ============================================================
        # Service Not Answering (#676)
        # ============================================================
        # THE RULE THIS FLEET DID NOT HAVE. On 2026-08-15 pm.bezaforge.dev
        # returned 502 for hours and every rule above this one stayed green,
        # because they all measure hosts and containers. The host was fine.
        # The container was running. The application inside it was dead.
        #
        # probe_success is 0 when the endpoint returns a 5xx, when the TLS
        # handshake fails, when the connection is refused — and, the case
        # #676 specifically demanded, when the request simply TIMES OUT. A
        # hung service that accepts a connection and never replies is invisible
        # to a status-code check and caught by this one.
        #
        # noDataState: NoData is load-bearing rather than boilerplate here. If
        # blackbox stops running, these series vanish, and an absent series is
        # indistinguishable from a healthy one — the same trap the DNS and
        # drift metrics each hit. NoData fires; OK would mean a dead prober
        # reads as a healthy fleet.
        #
        # for: 2m = four consecutive failed scrapes at 30s. Long enough that a
        # container restart during a deploy does not page, far shorter than
        # the multi-hour outage that prompted this.
        - uid: bfg9httpprobe001
          title: Service Not Answering
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: code
                expr: probe_success
                instant: true
                intervalMs: 1000
                legendFormat: '{{ $labels.instance }}'
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: OK
          for: 2m
          keepFiringFor: 5m
          annotations:
            summary: '{{ $labels.instance }} is not answering'
            description: 'The endpoint failed an HTTP probe from forge-ops. This means the SERVICE is unhealthy, not necessarily the host — the 2026-08-15 case (#676) had a healthy host, a running container, and a segfaulting Rails app behind an Apache that answered 502 for hours with nothing alerting. Probes go through AdGuard and Traefik on purpose, so this also fires for a DNS or router failure; if every target alerts at once, suspect Traefik or DNS before suspecting fourteen services. Diagnose with: curl -sSi https://<host> from the workstation, then docker logs <container> on the host that runs it. A probe counts as failed on 5xx, on connection refused, on TLS failure, and on timeout (5s) — the timeout case is the one a status-code check misses. Valid codes are listed in roles/monitoring/files/blackbox-config.yml and deliberately include 302 and 401, because six of these services redirect to a login page and Traefik answers 401. Coverage is the target list in roles/monitoring/files/prometheus.yml and nowhere else; verify it with count(probe_success), which must equal the number of targets there.'
          isPaused: false
          notification_settings:
            receiver: Discord
