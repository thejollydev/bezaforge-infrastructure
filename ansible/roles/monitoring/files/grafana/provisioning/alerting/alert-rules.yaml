apiVersion: 1
groups:
    - orgId: 1
      name: BezaForge-Alerts
      folder: BezaForge Alerts
      interval: 1m
      rules:
        - uid: afg8q41305tdsd
          title: Host Down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: builder
                expr: up
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: OK
          for: 1m
          keepFiringFor: 5m
          annotations:
            summary: '{{ $labels.instance }} is down'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: efg8qceg7nbb4e
          title: High CPU
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: builder
                exemplar: false
                expr: avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
                instant: true
                interval: "5"
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: OK
          for: 1m
          keepFiringFor: 5m
          annotations:
            summary: '{{ $labels.instance }} CPU above 90%'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: afg8qhi5sb5dsa
          title: Disk Space Low
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: code
                expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.2
                        type: lt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: NoData
          execErrState: OK
          for: 5m
          keepFiringFor: 10m
          annotations:
            summary: '{{ $labels.instance }} disk above 80%'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: ffg8qmo7d222oc
          title: Container Restarting
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: builder
                expr: changes(container_start_time_seconds{name!=""}[10m])
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: OK
          for: 1m
          annotations:
            summary: Container {{ $labels.name }} is restarting
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: efg8qt5s28xz4e
          title: Ollama Down
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: builder
                expr: node_systemd_unit_state{instance="forge-ai", name="ollama.service", state="active"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: NoData
          execErrState: OK
          for: 1m
          keepFiringFor: 5m
          annotations:
            summary: forge-ai Ollama inference unavailable
          isPaused: false
          notification_settings:
            receiver: Discord
        # Added 2026-07-26 after the sharepool incident: forge-hypervisor was
        # rebooted, the sharepool ZFS pool failed to import, and sanoid threw
        # CRITICAL every 15 minutes for ~24 h with nobody alerted. A failed
        # systemd unit is the earliest generic signal that a host is degraded.
        # Covers forge-hypervisor / forge-ai / forge-erp / forge-brizza, which
        # run the NATIVE prometheus-node-exporter (systemd collector enabled),
        # AND forge-ops — corrected 2026-08-09. This comment used to say
        # forge-ops was "NOT covered yet", which stopped being true the moment
        # the same 2026-07-26 change added `user: root` + the private D-Bus
        # socket + --collector.systemd to the containerised exporter. It is
        # demonstrably covered: this rule fired for forge-ops on 2026-08-09
        # (bezaforge-backup-rsync.service).
        - uid: bfg9sysunitfail01
          title: Systemd Unit Failed
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: code
                expr: node_systemd_unit_state{state="failed"} == 1
                instant: true
                intervalMs: 1000
                legendFormat: '{{ $labels.instance }} / {{ $labels.name }}'
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 15m
          annotations:
            summary: 'systemd unit {{ $labels.name }} has FAILED on {{ $labels.instance }}'
            description: 'Check with: systemctl status {{ $labels.name }} --no-pager'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: bfg9dnsprimary01
          title: DNS Not Using Primary
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: code
                expr: bezaforge_dns_primary_in_use == 0
                instant: true
                intervalMs: 1000
                legendFormat: '{{ $labels.instance }}'
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 30m
          annotations:
            summary: '{{ $labels.instance }} is resolving via the SECONDARY DNS server, not AdGuard'
            description: 'systemd-resolved failed over and does not fail back on its own, so this persists silently: the host loses ad-filtering and vanishes from AdGuard query logs while everything looks healthy. Any adguard container restart can cause it. Fix (about 1s of DNS interruption): ansible forge-ops,forge-ai,forge-brizza,forge-erp -i inventory/hosts.yml -m systemd -a "name=systemd-resolved state=restarted" --become --ask-become-pass --ask-vault-pass — ALSO run "sudo systemctl restart systemd-resolved" on the workstation, which parks identically but is not in the inventory and runs no dns-client role, so it emits no metric and THIS ALERT CANNOT SEE IT. On 2026-08-09 the workstation was parked three separate times in one session and a human caught it every time.'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: bfg9dnsparity01
          title: DNS Resolvers Disagree
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: dfdseqn41ybk0e
              model:
                editorMode: code
                expr: bezaforge_dns_parity_exit_code > 0
                instant: true
                intervalMs: 1000
                legendFormat: '{{ $labels.instance }}'
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 30m
          annotations:
            summary: 'AdGuard and dnsmasq are answering internal names differently (exit code {{ $values.A }})'
            description: 'The primary (AdGuard 10.10.20.20) and secondary (dnsmasq 10.10.10.10) resolvers no longer agree. This is invisible in normal operation because AdGuard answers everything — it only bites during an AdGuard outage, when nobody is placed to debug DNS. Exit code 1 = the resolvers DISAGREE; check bezaforge_dns_parity_mismatches. Exit code 2 = a resolver went SILENT so the comparison is INVALID (not a pass, not a parity failure — fix the resolver first); check bezaforge_dns_parity_unanswered. Diagnose with: scripts/dns-parity-check.sh -v. Both sides derive from bezaforge_dns_rewrites in group_vars/all (#649), so a real disagreement usually means a rewrite was added in the AdGuard web UI instead of in code — put it in the list and run site.yml --tags adguard,dnsmasq.'
          isPaused: false
          notification_settings:
            receiver: Discord
