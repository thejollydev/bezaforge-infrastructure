networks:
  bezaforge-net:
    external: true

services:
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - /opt/bezaforge/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/bezaforge/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - bezaforge-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.bezaforge.dev`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    # Root + the systemd private socket are required for --collector.systemd:
    # the collector talks to systemd over its private D-Bus socket, which is
    # root-only. Without this, forge-ops was the ONE host with no
    # node_systemd_unit_state metrics, so the "Systemd Unit Failed" alert
    # could not see the fleet's most important box (DNS, Traefik, every
    # service). The other four hosts run the native node-exporter package,
    # which gets this for free. Added 2026-07-26 after the sharepool
    # incident went unalerted for ~24 h.
    user: root
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/systemd/private:/run/systemd/private:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.systemd'
      # Textfile collector (#638, 2026-08-09). SAME GAP AS --collector.systemd
      # above, one collector later: the other four hosts run the native
      # prometheus-node-exporter package, which enables textfile by default at
      # /var/lib/prometheus/node-exporter. This container had it off entirely,
      # so roles/dns-client's bezaforge_dns_primary_in_use metric was written
      # to disk on forge-ops and scraped from nowhere — leaving the "DNS Not
      # Using Primary" alert blind on the one host that RUNS AdGuard.
      # The path is under /rootfs because / is bind-mounted there read-only;
      # the collector only ever reads, so ro is sufficient.
      - '--collector.textfile.directory=/rootfs/var/lib/prometheus/node-exporter'
    networks:
      - bezaforge-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - bezaforge-net
