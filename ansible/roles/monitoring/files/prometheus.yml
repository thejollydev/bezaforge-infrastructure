global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter-forge-ops'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'forge-ops'
          role: 'docker-host'

  - job_name: 'cadvisor-forge-ops'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'forge-ops'

  - job_name: 'netbox'
    static_configs:
      - targets: ['netbox:8080']
        labels:
          instance: 'netbox'
    metrics_path: /metrics

  - job_name: 'node-exporter-forge-ai'
    static_configs:
      - targets: ['10.10.50.10:9100']
        labels:
          instance: 'forge-ai'

  - job_name: 'node-exporter-forge-hypervisor'
    static_configs:
      - targets: ['10.10.10.10:9100']
        labels:
          instance: 'forge-hypervisor'
          role: 'hypervisor'

  - job_name: 'node-exporter-forge-erp'
    static_configs:
      - targets: ['10.10.20.50:9100']
        labels:
          instance: 'forge-erp'

  # ============================================================
  # Workstation (#663)
  # ============================================================
  # The workstation parks on the secondary resolver after any AdGuard
  # bounce exactly as the fleet does, but nothing could REPORT it: it is
  # not in this repo's inventory (it is managed by ansible-arch), so it
  # runs no roles/dns-client, emits no bezaforge_dns_primary_in_use, and
  # the "DNS Not Using Primary" alert built for precisely this failure is
  # blind to the machine it happens to most. It parked three separate
  # times during the 2026-08-09/10 session and a human noticed every time
  # by running resolvectl by hand. This job is the missing half; the
  # metric itself is emitted by the ansible-arch side.
  #
  # ⚠️ ADDRESSED ON HOME WIFI, WHICH IS WHY THE JOB IS `up`-EXCLUDED BELOW.
  # 10.10.40.99 is the laptop's Home-WiFi address (the same one
  # common_admin_ssh_sources carries). A laptop is off, asleep, or on
  # another network most of the day, so this target is DOWN as a matter
  # of routine rather than as a fault.
  - job_name: 'node-exporter-workstation'
    static_configs:
      - targets: ['10.10.40.99:9100']
        labels:
          instance: 'workstation'
          role: 'workstation'

  # ============================================================
  # HTTP service probing (#676)
  # ============================================================
  #
  # Everything above this line measures HOSTS. Nothing above it notices when
  # a service dies while its host stays green — which is exactly what
  # happened on 2026-08-15, when pm.bezaforge.dev served 502 for hours with
  # all nine alert rules green. These two jobs are the other question.

  # The prober's own health. Kept as a SEPARATE job from the probes below so
  # it produces exactly one `up` series with a sane instance label, which
  # means the existing "Host Down" rule covers the prober for free and says
  # "blackbox is down" rather than naming a URL. A watcher that cannot
  # measure must never look healthy — the same rule the deploy-drift check
  # follows when it exits INVALID rather than passing.
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox:9115']
        labels:
          instance: 'blackbox'

  # The probes themselves.
  #
  # ⚠️ THE TARGET LIST IS THE COVERAGE. There is no other copy — adding a
  # service to the fleet without adding it here means it is unmonitored, and
  # nothing will tell you. It was seeded from the fourteen `siteMonitor`
  # entries in docker/homepage/config/services.yaml, which were already the
  # curated public surface but only ever drove a browser-side status dot.
  # Keep the two lists in step.
  #
  # ⚠️ COUNT, DON'T EYEBALL (#671's lesson, restated in #676). After any
  # change here, verify the number of series, not just that the query
  # returns something:
  #     count(probe_success{job="blackbox-http"})  -> must equal the target count below
  #     count(probe_success == 1)       -> healthy subset
  # A target that silently stops being scraped produces no series at all,
  # and an absent series is indistinguishable from a healthy one in Grafana.
  #
  # ⚠️ These probe THROUGH Traefik and AdGuard, deliberately: that is the
  # path a human uses, so a broken router or DNS record is a real outage and
  # should alert. The cost is that a Traefik failure lights up every target
  # at once. That is honest rather than noisy — they are all genuinely
  # unreachable — and traefik.bezaforge.dev is itself one of the targets.
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_service]
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - https://bezaforge.dev              # homepage (apex)
          - https://git.bezaforge.dev          # Gitea
          - https://pm.bezaforge.dev           # OpenProject — the #676 outage
          - https://grafana.bezaforge.dev      # Grafana
          - https://prometheus.bezaforge.dev   # Prometheus
          - https://netbox.bezaforge.dev       # NetBox
          - https://uptime.bezaforge.dev       # Uptime Kuma
          - https://traefik.bezaforge.dev      # Traefik dashboard
          - https://erp.bezaforge.dev          # ERPNext
          - https://books.bezaforge.dev        # Calibre-Web
          - https://chat.bezaforge.dev         # Open WebUI
          - https://langfuse.bezaforge.dev     # LangFuse
          # learncast: the root is a 403 by design (listing off), and so is an
          # empty site directory, so probe the feed itself. 200 means podcast
          # apps can still fetch it.
          - https://learn.bezaforge.dev/feed.xml  # learncast
          # Umami's own health address, which answers only when the app is
          # up; `/` would be a redirect to the sign-in page. This is the
          # internal name. The public tracker is watched from outside, by
          # the website's own uptime checks, since a probe from here could
          # not tell a working tunnel from a broken one.
          - https://stats.bezaforge.dev/api/heartbeat  # Umami
    # The standard blackbox dance: the scrape goes to the exporter, but the
    # series must be labelled with the URL being probed, not with the
    # exporter's address. Without the last step every series would collapse
    # onto instance="blackbox:9115" and every target would look like one.
    #
    # ⚠️ `instance` is set here as a TARGET label on purpose. Target labels
    # beat metric labels on this fleet (see the standing caveat) — anything
    # the exporter emitted under the same name would be renamed to
    # `exported_instance` and the alert would lose the service's identity.
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Probes of addresses OUTSIDE the fleet: sites this homelab does not host
  # but whose owner wants on the same board and the same alert.
  #
  # ⚠️ THE TARGETS ARE NOT IN THIS FILE, AND MUST NOT BE. This repository is
  # public and these are names on the internet. They come from the encrypted
  # `monitoring_external_probe_targets` list, which the role renders into
  # file_sd/external-probes.yml on the host. An empty list is a valid state:
  # the job then has no targets and produces no series.
  #
  # ⚠️ THE COUNT RULE ABOVE STILL HOLDS, with a second term:
  #     count(probe_success{job="blackbox-http"})           -> the list above
  #     count(probe_success{job="blackbox-http-external"})  -> the vault list
  #
  # A DIRECTORY is mounted, not the file. The role replaces the file by
  # rename, and a bind mount of a single file keeps showing the old inode
  # until the container is recreated. Through the directory Prometheus sees
  # the new file and re-reads it itself, so a changed list needs no restart.
  #
  # Same module and same alert as the fleet's own probes ("Service Not
  # Answering" reads probe_success with no job filter). What differs is the
  # path: these leave through the WAN, so with the internet connection down
  # every one of them fails at once, and Discord is unreachable too.
  - job_name: 'blackbox-http-external'
    metrics_path: /probe
    params:
      module: [http_service]
    scrape_interval: 60s
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/external-probes.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
