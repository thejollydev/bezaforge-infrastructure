---
# ============================================================
# forge-agents-backup-pull — RETIRED 2026-10-21
# ============================================================
# The Brizza agent team and forge-agents were torn down on Joseph's ruling
# of 2026-10-21. This role used to pull the agent host's nightly backup into
# bezapool/forge-agents-backup. It now only takes its own pieces back off
# forge-hypervisor: the timer, the service, the script, the pull key and the
# pinned host key. Once that has been deployed, delete the role and its line
# in site.yml.
#
# The dataset itself is not touched here: destroying it is permanent, so it
# is Joseph's to run by hand, after this has been deployed (sanoid and restic
# stop naming it in the same change).
forge_agents_backup_units:
  - bezaforge-forge-agents-backup-pull.timer
  - bezaforge-forge-agents-backup-pull.service
forge_agents_backup_retired_files:
  - /etc/systemd/system/bezaforge-forge-agents-backup-pull.timer
  - /etc/systemd/system/bezaforge-forge-agents-backup-pull.service
  - /usr/local/bin/bezaforge-forge-agents-backup-pull.sh
  - /root/.ssh/id_ed25519_forge_agents_backup
  - /root/.ssh/id_ed25519_forge_agents_backup.pub
  - /root/.ssh/known_hosts_forge_agents_backup
