---
# Retires the forge-agents backup pull (see defaults/main.yml). Each step
# is a no-op once the piece is gone, so a second run reports changed=0.

- name: Read which of the pull's units are installed  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "systemctl list-unit-files --no-legend {{ forge_agents_backup_units | join(' ') }}"
  register: forge_agents_backup_unit_files
  changed_when: false
  failed_when: false

- name: Stop and disable the pull
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ forge_agents_backup_units }}"
  when: item in forge_agents_backup_unit_files.stdout

- name: Remove the pull's units, script and keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ forge_agents_backup_retired_files }}"
  notify: reload systemd
