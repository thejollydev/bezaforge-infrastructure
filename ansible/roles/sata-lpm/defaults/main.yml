---
# ============================================================
# sata-lpm — pin the kernel's SATA link power management policy
# ============================================================
# Off by default, so the role is a no-op everywhere until a host opts in
# via host_vars. Exists because the 7.0 kernel defaults every OCCUPIED
# AHCI port to `med_power_with_dipm` (nothing on the host configures it —
# no TLP, no udev rule; empty ports read `keep_firmware_settings`), and
# the bezapool WD Reds (WD40EFPX) do not come back cleanly from
# DIPM-initiated link power states: PHYRdyChg/CommWake/10B8B exceptions,
# hard link resets every ~1-3 minutes, the link punished down to
# 1.5 Gbps / UDMA-33, and 45-minute stalls in the nightly forge-ops
# rsync window (#1101; 2 302 resets on one port in a single boot).
#
# Three incidents (#92, #955, #1101) were chased as cable/port/drive
# faults before the shared trigger was found — the failing serial
# followed the drive across two cables, two ports and both FCH
# controllers, and its mirror twin then showed the identical signature
# on a third path. Pinning `max_performance` on 2026-09-08 22:28 stopped
# the resets instantly (longest quiet gap that day: ~18 min; after the
# pin: zero overnight) and the next 02:45 backup ran clean in 3.5 min.
sata_lpm_manage: false

# The policy to pin on every /sys/class/scsi_host/*. max_performance
# disables ALPM outright — the right trade on a mains-powered server
# whose disks are woken every few minutes by vault-sync and NFS writes
# anyway. The udev rule re-asserts it for hotplugged/rescanned hosts;
# the runtime task below covers the hosts that already exist.
sata_lpm_policy: max_performance
