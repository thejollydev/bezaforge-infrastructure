---
# ============================================================
# comfyui role defaults
#
# ComfyUI on forge-ai (AMD RX 7900 XT, gfx1100) for BezaCore brand
# image generation (#1188). It shares the 20 GiB card with Ollama:
# the BezaCore imagegen script unloads Ollama's models before a set
# and calls ComfyUI's POST /free after, so neither service has to know
# about the other.
#
# Versions were checked against their sources on 2026-09-13.
# ============================================================

comfyui_user: comfyui
comfyui_root: /opt/comfyui
comfyui_app_dir: "{{ comfyui_root }}/ComfyUI"
comfyui_venv: "{{ comfyui_root }}/venv"
comfyui_python_dir: "{{ comfyui_root }}/python"

# ComfyUI moved to github.com/Comfy-Org. v0.35.0 is the latest PUBLISHED
# release (2026-09-09); v0.35.1 exists only as a tag.
comfyui_repo: https://github.com/Comfy-Org/ComfyUI.git
comfyui_version: v0.35.0

# uv supplies the interpreter and the venv. Python 3.13, not the host's 3.14:
# ComfyUI's README says "Python 3.13 is very well supported" and "Python 3.14
# works but some custom nodes may have issues".
comfyui_uv_version: "0.12.13"
comfyui_python_version: "3.13"

# PyTorch's ROCm 7.2 wheels, the index ComfyUI's README gives for Linux AMD.
# They bundle the ROCm runtime in torch/lib (gfx1100 kernels and aotriton
# included), so this host still needs no /opt/rocm — the same reason
# roles/rocm installs none for Ollama. gfx1100 is a native target: no
# HSA_OVERRIDE_GFX_VERSION.
#
# Pinned, and passed as constraints when ComfyUI's own requirements install,
# so nothing can swap in PyPI's CUDA build (ComfyUI #14902 is that failure
# through the Manager's updater).
comfyui_torch_index: https://download.pytorch.org/whl/rocm7.2
comfyui_torch_packages:
  - torch==2.14.0+rocm7.2
  - torchvision==0.29.0+rocm7.2
  - torchaudio==2.11.0+rocm7.2

# Core ComfyUI does not load GGUF. The Qwen-Image quant below needs this node.
#
# ComfyUI-ToSVG traces a raster logo into colour SVG with vtracer, for
# BezaCore's vector masters (#1193). Chosen 2026-09-13 as the free route: the
# only free text-to-SVG model that fits this card, OmniSVG 1.1 4B, is built on
# Qwen2.5-VL-3B-Instruct, whose licence is non-commercial. The node and vtracer
# are MIT. Its requirements also pull PyMuPDF (AGPL-3.0 or Artifex commercial)
# and potracer (GPL-2.0+); those licences cover the software, not the SVGs it
# writes. Its unpinned `torch` requirement cannot replace the ROCm build: the
# requirements install runs with the PyTorch constraints below.
# ⚠️ Upgrade hazard: svgnode.py imports `SVG` from comfy_extras.nodes_images,
# which v0.35.0 keeps only as "temporary solution for backward compatibility,
# will be removed later". Check the node still loads after any ComfyUI bump.
comfyui_custom_nodes:
  - name: ComfyUI-GGUF
    repo: https://github.com/city96/ComfyUI-GGUF.git
    version: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a  # main, 2026-01-12
  - name: ComfyUI-ToSVG
    repo: https://github.com/Yanick112/ComfyUI-ToSVG.git
    version: 1022ba05318dccb4fe586ce5bbd09f1f0b3c7909  # main, 2025-06-20

# --listen on all interfaces so the laptop can reach it; UFW below is the only
# gate, because ComfyUI has no authentication.
comfyui_listen: 0.0.0.0
comfyui_port: 8188
comfyui_ufw_allow_from:
  - 10.10.40.99  # jolly-LOQ-arch over WiFi, where imagegen runs (matches roles/ollama)

# No --disable-smart-memory. It was here to give the card back to Ollama after
# every job, and it crashed the first Qwen-Image run (2026-09-13): it offloads
# each finished model to system RAM, and Qwen-Image's 14.4 GB diffusion model
# plus its 7.9 GB text encoder filled forge-ai's 22 GB RAM and 4 GB swap
# (systemd: "21.9G memory peak, 3.9G memory swap peak"). The VAE decode then
# failed ("amdgpu: SVM mapping failed, exceeds resident system memory limit")
# and ComfyUI segfaulted. With smart memory on, the diffusion model stays in
# VRAM through the decode and only the text encoder spills to RAM. The card
# still goes back to Ollama: the imagegen script calls POST /free after a set.
#
# Not --disable-dynamic-vram: on the ROCm 7.2 wheels ComfyUI leaves dynamic
# VRAM off already (it enables it for AMD only at ROCm >= 7.14), which is what
# avoids the black-output and slowdown bugs (#15452, #15661).
comfyui_extra_args: []
comfyui_extra_env: {}

# Memory cap for the service (systemd MemoryMax, MemorySwapMax). On 2026-09-13
# a Qwen-Image set's /free moved its 14.4 GB diffusion model into RAM beside the
# 7.9 GB text encoder; ComfyUI reached 23.6 GB RAM plus 4.2 GB swap, forge-ai was
# left with 38 MB available and stopped answering until ComfyUI was restarted by
# hand. With a cap and no swap, ComfyUI is OOM-killed and restarted instead,
# and the rest of forge-ai (Ollama, sshd, the file-share mount) keeps its memory.
# 27G is sized for 32 GB of guest RAM (terraform/vms.tf), leaving about 4 GB for
# everything else; it is an estimate until a Qwen-Image set has run under it.
comfyui_memory_max: 27G
comfyui_memory_swap_max: "0"

# Apache-2.0 models only; the FLUX dev / klein 9B and Ideogram 4 licences are
# non-commercial and these images are for a company. Checksums are the
# Hugging Face LFS sha256 values, so get_url verifies every download and skips
# a file already in place.
#   Qwen-Image-2512 (lettering): GGUF Q5_K_M, because the fp8 file (20.4 GB)
#   is the whole card. Z-Image Turbo: fast variations.
# About 45 GB on disk in total.
comfyui_models:
  - folder: unet
    url: https://huggingface.co/unsloth/Qwen-Image-2512-GGUF/resolve/main/qwen-image-2512-Q5_K_M.gguf
    sha256: e9ea2c513cf25645829fcccbd0882e821b858f4fabfb48ae1b5f103da68ecd0f
  - folder: text_encoders
    url: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
    sha256: cb5636d852a0ea6a9075ab1bef496c0db7aef13c02350571e388aea959c5c0b4
  - folder: vae
    url: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/vae/qwen_image_vae.safetensors
    sha256: a70580f0213e67967ee9c95f05bb400e8fb08307e017a924bf3441223e023d1f
  - folder: diffusion_models
    url: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/diffusion_models/z_image_turbo_bf16.safetensors
    sha256: 2407613050b809ffdff18a4ac99af83ea6b95443ecebdf80e064a79c825574a6
  - folder: text_encoders
    url: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/text_encoders/qwen_3_4b.safetensors
    sha256: 6c671498573ac2f7a5501502ccce8d2b08ea6ca2f661c458e708f36b36edfc5a
  - folder: vae
    url: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/vae/ae.safetensors
    sha256: afc8e28272cd15db3919bacdb6918ce9c1ed22e96cb12c4d5ed0fba823529e38
