---
# ============================================================
# vault-sync role defaults — knowledge vault git clone on
# forge-hypervisor (ADR 0002 v1.2, 2026-06-06; runs on the
# bezapool/vault dataset owner — git-over-NFS wedged brizza's kernel)
#
# ⚠️ REPOINTED 2026-08-30 (#791): the vault this DEFAULT serves is
# `never-knowledge`, NOT the retired Master-Mind vault. Master-Mind was
# archived (#195) and its Gitea repo has been frozen at 2026-08-15 ever
# since, so both deployments were syncing a dead corpus perfectly and
# silently — every run fetched cleanly, found nothing and exited 0.
#
# The half fixed here is the hypervisor's: bezapool/vault is what sanoid
# snapshots hourly and restic-gcs ships offsite nightly, so that
# protection was being spent on a vault nobody writes to while the live
# one had no server-side clone or snapshots at all. No decision gates
# that; it is a data-protection fix.
#
# ⚠️ This is now a SINGLE-HOST role. forge-brizza was retired 2026-08-30
# with Brizza v1, taking the second deployment with it — and with it the
# only writer this sync ever had. The parametrization below (the
# deployment-shape flags, the create_user / webhook / mirror / lease
# switches) exists because there were two very different deployments.
# It is kept rather than collapsed into the hypervisor's shape because
# Brizza v2 is being built and may want a clone again, but be aware that
# only one path is exercised today.
#
# The vault left Google Drive (ADR 0002): Gitea is the single
# hub; this role maintains the server-side clone on the
# bezapool/vault ZFS dataset (NFS RW mount) and keeps it
# current both ways:
#   pull:  Gitea webhook (seconds) + 1-min fallback timer
#   push:  local changes (Hermes/Brizza writes) are committed
#          and pushed; true conflicts park on a
#          brizza/conflict-<ts> branch — never force-pushed,
#          never silently dropped.
#
# Deployments (FORGE-49, 2026-06-09 — the role runs on two hosts):
#   - forge-hypervisor: canonical server clone on the bezapool/vault
#     ZFS dataset (sanoid + restic scope), GitHub/GitLab mirror
#     fan-out, Gitea webhook receiver. Defaults below = this host.
#   - forge-brizza: RETIRED 2026-08-30. Was a local clone for Hermes
#     vault grounding (timer-only — no webhook/mirrors/leases), itself
#     replacing an NFS-RW mount whose recursive traversal EINVALed when
#     a checkout here raced the NFS client (FORGE-49). Both the host and
#     the agent that read the clone are gone.
#
# Prereqs done out-of-band 2026-06-06 (one-time):
#   - deploy key ~/.ssh/id_ed25519_vault_sync registered in
#     Gitea (read_only=false)
#   - Gitea webhook → http://10.10.10.10:{{ port }}/ created
#     via API with the Authorization header token below
#
# Re-done out-of-band for the #791 repoint (one-time, per host):
#   - the SAME deploy key registered WRITE on the never-knowledge
#     repo in Gitea, and on its GitHub/GitLab mirrors. A key is
#     authorized per-repository, so a key that worked against
#     Master-Mind does not carry over; the clone task fails until
#     it is registered (expected).
#   - forge-hypervisor's pre-existing Master-Mind clone at
#     /bezapool/vault moved aside before the first run — see the guard
#     in tasks/main.yml for why this is a deliberate manual step rather
#     than something the play does.
# ============================================================

# Where the clone lives — the bezapool/vault dataset, LOCAL on
# forge-hypervisor (v1.2 restructure, 2026-06-06): git wedged twice in
# D-state doing write IO over NFS from forge-brizza's 7.0.0 kernel
# (folio_wait_bit_common / rpc_wait_bit_killable). Git only ever does
# local IO on its own clone. (FORGE-49 update 2026-06-09: brizza no
# longer writes plain files over NFS — it has its own local clone and
# pushes its own commits; this host's auto-commit step is now dormant
# but harmless, kept for robustness.)
vault_sync_clone_path: /bezapool/vault

# ------------------------------------------------------------
# Deployment-shape flags (FORGE-49 — defaults describe the
# forge-hypervisor deployment; forge-brizza overrides ALL of
# these in host_vars).
# ------------------------------------------------------------
# fs.leases-enable=0 is an NFS-SERVER concern (delegation recall vs
# local git writes) — only the host that exports a dataset needs it.
vault_sync_manage_leases: true
# /etc/hosts pins exist because the hypervisor can't use AdGuard
# (boot-order circular dep). Normal VMs resolve via AdGuard — skip.
vault_sync_manage_etc_hosts: true
# The hypervisor uses a dedicated service user; on forge-brizza the
# actor is the existing `joseph` (Hermes writes files as uid 1000 —
# the git actor must be the same owner), so creation is skipped.
vault_sync_create_user: true
# Webhook receiver (seconds-latency pulls). Timer-only deployments
# (brizza) skip it: end-to-end staleness is dominated by the laptop's
# <=5-min Obsidian Git commit interval, so the 1-min timer is enough.
vault_sync_webhook_enabled: true

# Gitea origin. SSH on the Gitea container's mapped port 2222.
# never-knowledge since #791 (2026-08-30) — see the repoint note above.
vault_sync_repo: "ssh://git@git.bezaforge.dev:2222/joseph/never-knowledge.git"
vault_sync_branch: main

# Deploy key (generated on-host if missing; pubkey must be a
# Gitea deploy key with write access — registered via API post-deploy).
vault_sync_ssh_key: /home/vaultsync/.ssh/id_ed25519_vault_sync

# Dedicated service user, uid 1000 BY DESIGN: matches the dataset
# chown and the NFS anonuid squash for forge-brizza, so Hermes's
# squashed writes and this user's git operations are the same owner.
vault_sync_user: vaultsync
vault_sync_user_uid: 1000

# Internal *.bezaforge.dev names the hypervisor must resolve WITHOUT
# AdGuard.
#
# ⚠️ CORRECTED 2026-08-08 (#638). This comment used to say "AdGuard runs in
# a VM this host supervises, so pointing the hypervisor's resolver at it is
# a boot-order circular dependency." That is FALSE: forge-ops is a separate
# BARE-METAL box (a BOSGAME i9), not a guest — `qm list` on forge-hypervisor
# returns only 101/103/104/105/9002. There is no boot-order cycle.
#
# The pins are still right, for a different and better reason: forge-ops is
# what this host BACKS UP, and a backup host that cannot resolve its own
# git origin while its backup target is down is no backup host at all.
# Independence from forge-ops is the requirement — supervision was never
# the issue.
#
# As of #638 the hypervisor also runs its own dnsmasq (roles/dnsmasq) and
# can resolve the whole internal zone unaided, so these pins are now
# belt-and-braces rather than the only mechanism. Keep them: they cost
# nothing and they still answer if dnsmasq is down, because nsswitch reads
# files before dns.
#   git    — Gitea origin (always needed)
#   uptime — Kuma heartbeat target (needed when vault_sync_heartbeat_url set)
vault_sync_etc_hosts_ip: 10.10.20.20
vault_sync_etc_hosts_pins:
  - git.bezaforge.dev
  - uptime.bezaforge.dev

# Identity for commits made by the sync. Renamed off "Brizza
# (vault-sync)" / brizza@bezaforge.dev on 2026-08-30: Brizza was the only
# writer this clone ever had, and attributing future commits to a retired
# agent would misname whatever actually made them. The auto-commit step
# is dormant now — there is no local writer at all — but it stays for
# robustness, and if it ever fires the author should be the service.
vault_sync_git_name: "vault-sync"
vault_sync_git_email: "vault-sync@bezaforge.dev"

# Webhook receiver — Gitea POSTs here on every push so pulls
# happen within seconds. UFW restricts sources to forge-ops
# (where Gitea runs). The token is a trigger gate, not a
# secret guarding data: the only thing a valid request can do
# is start the same idempotent sync the 1-min timer runs
# anyway — hence plaintext here rather than ansible-vault.
vault_sync_webhook_port: 9876
# UFW management is gated: forge-hypervisor runs pve-firewall
# (currently disabled), not UFW — flip on only for UFW hosts.
vault_sync_manage_ufw: false
vault_sync_webhook_allowed_sources:
  - 10.10.20.20
  - 10.10.10.20

# ------------------------------------------------------------
# Container-written mode normalization (BRIZZA-62, 2026-06-11)
#
# Hermes's file tool creates NEW files 0600 (mkstemp tempfile-then-
# rename; it only copies the original mode when OVERWRITING). On
# forge-brizza those files WERE owned by container uid 10000, so the
# sync user (joseph/1000, group-only access) couldn't read them and
# `git add -A` hard-failed — wedging the ENTIRE sync, pulls included.
#
# ⚠️ No host enables this any more (#791, 2026-08-30). Hermes moved
# Docker→bare-metal on 2026-06-16 and now runs AS joseph, so there is
# no foreign-uid writer left to normalize; forge-brizza's override was
# firing a root `chmod -R` every 60 seconds against files it already
# owned. The mechanism stays because it is generic and the sudoers
# rule self-removes when the path is empty (see tasks/main.yml) — but
# turning it back on needs a real foreign-uid writer to justify it.
# When set to a directory path, the sync script runs
#   sudo /usr/bin/chmod -R g+rwX <path>
# before staging, and the role installs a sudoers rule scoped to
# exactly that command. Empty = disabled (forge-hypervisor: no
# foreign-uid writers, no sudoers rule, no script step).
# ------------------------------------------------------------
vault_sync_normalize_perms_path: ""

# ------------------------------------------------------------
# Offsite mirror fan-out over SSH (ADR 0002 / FORGE-39, 2026-06-07)
#
# Gitea has NO SSH push-mirror support — HTTPS-token only (confirmed in
# Gitea docs). gitlab.com forces a <=1y expiry on those tokens, so the
# Gitea→GitLab push-mirror kept silently dying on auth. Fix: this host
# (the vault's authoritative downstream clone) fans out to GitHub +
# GitLab ITSELF, over SSH, after every successful pull from Gitea —
# reusing the SAME vault-sync deploy key (already set as core.sshCommand
# on the clone). Deploy keys don't expire. This REPLACES the Gitea
# push-mirrors (both deleted once verified). A mirror push failure is
# logged, never fatal — a dead mirror must not break the primary sync.
#
# One-time setup (post-deploy): add the PUBLIC half of vault_sync_ssh_key
# as a WRITE-enabled deploy key on each remote repo below.
# ------------------------------------------------------------
vault_sync_mirror_push: true
vault_sync_mirror_remotes:
  - name: github
    host: github.com
    url: "git@github.com:thejollydev/never-knowledge.git"
  - name: gitlab
    host: gitlab.com
    url: "git@gitlab.com:thejollydev/never-knowledge.git"

# ------------------------------------------------------------
# Freshness heartbeat (FORGE-40 detection layer)
#
# Set to an Uptime Kuma PUSH monitor URL to enable a "is the sync still
# happening?" alarm: the sync pings it after every successful primary run,
# and Kuma alerts (Discord) if it misses the configured interval. Empty =
# disabled (no-op). Put the real value in host_vars (vaulted) — the URL
# carries a per-monitor token. Example:
#   https://uptime.bezaforge.dev/api/push/<token>?status=up
# The 2026-06-06 wedge ran 26h undetected; this is the alarm that would
# have caught it in minutes.
# ------------------------------------------------------------
vault_sync_heartbeat_url: ""
