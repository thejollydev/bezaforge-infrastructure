---
# ============================================================
# erpnext role — codifies the live frappe_docker ERPNext deploy on
# forge-erp (FORGE-30). Two compose projects: the shared MariaDB
# (owns the external mariadb-network + mariadb_db-data volume) is
# brought up FIRST, then the erpnext-one app project.
#
# Named volumes (mariadb_db-data, erpnext-one_sites,
# erpnext-one_redis-queue-data) are global, so they PERSIST across the
# one-time container recreate that happens when the compose moves under
# {{ erpnext_deploy_dir }} (the config_files label changes). Data is kept.
#
# UPGRADES (#1378). When the image in erpnext-one.yaml is not the one the
# running backend was created from, this role upgrades rather than merely
# recreating: it records the ledger totals, takes a backup, brings the stack
# up on the new image, runs `bench migrate`, and stops if the ledger totals
# moved. A recreate without the migrate is the version-skew trap (FORGE-77):
# new code against an unmigrated database. It refuses an OLDER image outright
# — that is a stale checkout, and migrations do not run backwards.
# See docs/runbooks/erpnext-upgrade.md.
#
# NOT codified (deliberate scope):
#   - The one-time site bootstrap (`bench new-site erp.bezaforge.dev
#     --install-app erpnext`). The site lives in erpnext-one_sites; for a
#     from-zero rebuild, run it once by hand after the stack is up.
#   - Traefik routing for erp.bezaforge.dev (lives on forge-ops).
# ============================================================

# --- Docker engine (idempotent — already present on forge-erp) ---
- name: Ensure the Docker apt keyring dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: erpnext_install_docker | bool

- name: Add Docker GPG key  # noqa: command-instead-of-module
  # curl | gpg --dearmor is Docker's documented key-install method; get_url
  # can't dearmor inline. pipefail makes a failed curl fail the task too.
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      curl -fsSL https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg
      | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    executable: /bin/bash
    creates: /etc/apt/keyrings/docker.gpg
  when: erpnext_install_docker | bool

- name: Set Docker GPG key permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    mode: "0644"
  when: erpnext_install_docker | bool

# deb822_repository writes /etc/apt/sources.list.d/docker.sources in the
# modern format. ansible.builtin.apt_repository is deprecated as of
# ansible-core 2.21 and removed in 2.25 — migrated 2026-06-17 (FORGE-65).
# Behaviour-preserving (same uris/suites/components); mirrors roles/docker
# but uses the host distro/release facts so it resolves on this Ubuntu host.
- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.gpg
    state: present
    enabled: true
  when: erpnext_install_docker | bool

# Remove the legacy .list the old apt_repository task created, so apt
# doesn't see the Docker repo configured twice. No-op if already gone.
- name: Remove legacy docker.list (replaced by docker.sources above)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  when: erpnext_install_docker | bool

- name: Install Docker engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
  when: erpnext_install_docker | bool

- name: Ensure the docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when: erpnext_install_docker | bool

- name: Add docker-group membership for {{ erpnext_docker_user }}
  ansible.builtin.user:
    name: "{{ erpnext_docker_user }}"
    groups: docker
    append: true
  when: erpnext_install_docker | bool

# --- ERPNext deploy ---
- name: Ensure the ERPNext deploy dir exists
  ansible.builtin.file:
    path: "{{ erpnext_deploy_dir }}"
    state: directory
    owner: "{{ erpnext_docker_user }}"
    group: "{{ erpnext_docker_user }}"
    mode: "0755"

- name: Deploy the compose files (mariadb override + resolved erpnext-one)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ erpnext_deploy_dir }}/{{ item }}"
    owner: "{{ erpnext_docker_user }}"
    group: "{{ erpnext_docker_user }}"
    mode: "0644"
  loop:
    - compose.mariadb-shared.yaml
    - erpnext-one.yaml

- name: Deploy the mariadb env (DB_PASSWORD from vault)
  ansible.builtin.template:
    src: mariadb.env.j2
    dest: "{{ erpnext_deploy_dir }}/mariadb.env"
    owner: "{{ erpnext_docker_user }}"
    group: "{{ erpnext_docker_user }}"
    mode: "0600"

# --- Is this run an upgrade? ---
- name: Read the ERPNext image the compose file asks for
  ansible.builtin.set_fact:
    erpnext_wanted_image: >-
      {{ (lookup('ansible.builtin.file', 'erpnext-one.yaml') | from_yaml).services.backend.image }}

# failed_when: false — no such container is the from-zero rebuild, where
# there is nothing to upgrade and the bring-up below creates it.
- name: Read the image the running backend was created from
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.Config.Image{{ '}}' }}"
      - "{{ erpnext_backend_container }}"
  register: erpnext_running
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether this run upgrades ERPNext
  ansible.builtin.set_fact:
    erpnext_running_image: "{{ erpnext_running.stdout | trim }}"
    erpnext_upgrading: >-
      {{ erpnext_running.rc == 0
         and (erpnext_running.stdout | trim) != erpnext_wanted_image }}

- name: Record the ledger totals, back up, and check the direction
  when: erpnext_upgrading | bool
  block:

    # Both refs must carry a version, or the direction cannot be known. A
    # ref that does not parse stops the run here, before anything changes.
    - name: Refuse to move ERPNext to an older or unreadable version
      ansible.builtin.assert:
        that:
          - erpnext_running_tag | length > 0
          - erpnext_wanted_tag | length > 0
          - erpnext_wanted_tag is version(erpnext_running_tag, '>=')
        fail_msg: >-
          forge-erp runs {{ erpnext_running_image }} and this checkout asks
          for {{ erpnext_wanted_image }}. That is not a move forward (or one
          of the two carries no vX.Y.Z tag), so nothing was touched. An older
          image against a migrated database is the version-skew trap — pull
          main and run again.
      vars:
        erpnext_running_tag: "{{ erpnext_running_image | regex_search(':v(\\d+\\.\\d+\\.\\d+)', '\\1') | default([''], true) | first }}"
        erpnext_wanted_tag: "{{ erpnext_wanted_image | regex_search(':v(\\d+\\.\\d+\\.\\d+)', '\\1') | default([''], true) | first }}"

    - name: Record the ledger totals before the upgrade
      ansible.builtin.command:
        argv: "{{ erpnext_ledger_totals_argv }}"
      register: erpnext_ledger_before
      changed_when: false

    - name: Check for the forge-erp backup script
      ansible.builtin.stat:
        path: "{{ erpnext_backup_script }}"
      register: erpnext_backup_script_stat

    # The script is roles/forge-erp's nightly job: `bench backup --with-files`
    # and then the copy to bezapool, so the dump is off this VM before the
    # database is migrated.
    - name: Back up ERPNext and push the backup off the VM
      ansible.builtin.command:
        cmd: "{{ erpnext_backup_script }}"
      changed_when: true
      when: erpnext_backup_script_stat.stat.exists

    # A host that has never run roles/forge-erp has no script. The dump is
    # still taken; it stays on this VM until that role is deployed.
    - name: Back up ERPNext on the VM (no off-VM push configured)
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ erpnext_backend_container }}"
          - bench
          - --site
          - "{{ erpnext_site }}"
          - backup
          - --with-files
      changed_when: true
      when: not erpnext_backup_script_stat.stat.exists

# Shared MariaDB FIRST — creates the external mariadb-network + the
# mariadb_db-data volume the app project attaches to.
- name: Bring up the shared MariaDB project
  community.docker.docker_compose_v2:
    project_src: "{{ erpnext_deploy_dir }}"
    project_name: "{{ erpnext_mariadb_project }}"
    files:
      - compose.mariadb-shared.yaml
    env_files:
      - mariadb.env
    state: present

# NOTE: this task always reports `changed` — expected, benign, do
# not chase it. erpnext-one.yaml includes a one-shot `configurator`
# service (runs `bench set-config …`, exits 0, restart: on-failure).
# `docker compose up` starts every defined service, so it re-runs the
# exited configurator each run → docker_compose_v2 reports changed.
# This is frappe_docker's design; the long-running services are
# untouched and the config re-apply is idempotent. Confirmed the sole
# residual non-idempotency in the #493 audit (2026-07-19); left as-is
# rather than restructuring the bootstrap flow behind a compose
# profile (which would risk the ERPNext update runbook for a purely
# cosmetic gain).
- name: Bring up the ERPNext app project
  community.docker.docker_compose_v2:
    project_src: "{{ erpnext_deploy_dir }}"
    project_name: "{{ erpnext_app_project }}"
    files:
      - erpnext-one.yaml
    state: present

# --- The rest of an upgrade: migrate, then prove the books did not move ---
# Not under --check: the commands above are skipped there, so there would be
# no "before" to compare against.
- name: Migrate ERPNext and compare the ledger totals
  when:
    - erpnext_upgrading | bool
    - not ansible_check_mode
  block:

    # The backend container is up before gunicorn and the database connection
    # are, hence the retries. Migrate is safe to repeat.
    - name: Run bench migrate on the new image
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ erpnext_backend_container }}"
          - bench
          - --site
          - "{{ erpnext_site }}"
          - migrate
      register: erpnext_migrate
      changed_when: true
      retries: 5
      delay: 15
      until: erpnext_migrate.rc == 0

    - name: Record the ledger totals after the upgrade
      ansible.builtin.command:
        argv: "{{ erpnext_ledger_totals_argv }}"
      register: erpnext_ledger_after
      changed_when: false

    - name: Read the versions now running
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ erpnext_backend_container }}"
          - bench
          - version
      register: erpnext_bench_version
      changed_when: false

    - name: Report the upgrade
      ansible.builtin.debug:
        msg:
          - "was            : {{ erpnext_running_image }}"
          - "now            : {{ erpnext_wanted_image }}"
          - "bench version  : {{ erpnext_bench_version.stdout_lines | join(' / ') }}"
          - "ledger before  : {{ erpnext_ledger_before.stdout_lines | last | default('') }}"
          - "ledger after   : {{ erpnext_ledger_after.stdout_lines | last | default('') }}"

    - name: FAIL if the ledger totals moved across the upgrade
      ansible.builtin.assert:
        that:
          - (erpnext_ledger_before.stdout_lines | last | default('before'))
            == (erpnext_ledger_after.stdout_lines | last | default('after'))
        fail_msg: >-
          The count and the debit and credit sums of the posted ledger entries
          are not what they were before the upgrade. The backup taken at the
          start of this run is the way back: docs/runbooks/erpnext-upgrade.md.
        success_msg: "Ledger totals are unchanged across the upgrade."
