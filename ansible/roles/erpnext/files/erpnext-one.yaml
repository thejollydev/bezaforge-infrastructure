# ⚠️ EVERY SERVICE BELOW CARRIES dns_search: ["."] AND IT IS LOAD-BEARING.
# It removes the host's `search bezaforge.dev` from the container resolver.
# Without it, ERPNext was DOWN for 25 hours (2026-08-31 21:02 -> 2026-09-02).
#
# The mechanism, because it fails silently and points at the wrong host:
# nginx resolves an `upstream` hostname ONCE, at config load, and caches the
# address. On a boot the frontend can start before Docker's embedded DNS
# answers for `backend`; resolution then falls through to the search domain,
# asking for `backend.bezaforge.dev` -- and the internal zone has a WILDCARD,
# *.bezaforge.dev -> 10.10.20.20, which answers. So nginx cached forge-ops as
# its application backend and proxied there for 25 hours, timing out on every
# request while every container reported healthy and the host answered ping
# in 1ms. Kuma and blackbox both read it as down; nothing said why.
#
# With no search domain, `backend` can only be answered by Docker DNS
# (127.0.0.11). If that is not ready, nginx fails to start and restart:
# unless-stopped retries until it is -- a loud, self-healing failure instead
# of a quiet, wrong one. None of these services needs the search domain:
# they resolve each other by container name and everything external by FQDN.
#
# This became possible on 2026-08-09, when roles/dns-client (#638) first gave
# this host a managed search domain; the wildcard predates it. The stack ran
# continuously until the 08-31 reboot, which is why it worked all August and
# then did not.
#
name: erpnext-one
services:
  backend:
    dns_search:
      - "."
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: frappe/erpnext:v16.26.2@sha256:549a6681171b99aece2502ef5af1d13d8eb4cc900bd1426f9c0a3cc8c9f2378a
    networks:
      default: null
      mariadb-network: null
    platform: linux/amd64
    pull_policy: missing
    restart: unless-stopped
    volumes:
      - type: volume
        source: sites
        target: /home/frappe/frappe-bench/sites
        volume: {}
  configurator:
    dns_search:
      - "."
    command:
      - |
        ls -1 apps > sites/apps.txt; bench set-config -g db_host mariadb-database; bench set-config -gp db_port 3306; bench set-config -g redis_cache "redis://redis-cache:6379"; bench set-config -g redis_queue "redis://redis-queue:6379"; bench set-config -g redis_socketio "redis://redis-queue:6379"; bench set-config -gp socketio_port 9000; bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    depends_on:
      redis-cache:
        condition: service_started
        required: true
      redis-queue:
        condition: service_started
        required: true
    entrypoint:
      - bash
      - -c
    environment:
      DB_HOST: mariadb-database
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    image: frappe/erpnext:v16.26.2@sha256:549a6681171b99aece2502ef5af1d13d8eb4cc900bd1426f9c0a3cc8c9f2378a
    networks:
      default: null
      mariadb-network: null
    platform: linux/amd64
    pull_policy: missing
    restart: on-failure
    volumes:
      - type: volume
        source: sites
        target: /home/frappe/frappe-bench/sites
        volume: {}
  frontend:
    dns_search:
      - "."
    command:
      - nginx-entrypoint.sh
    depends_on:
      backend:
        condition: service_started
        required: true
      websocket:
        condition: service_started
        required: true
    environment:
      BACKEND: backend:8000
      CLIENT_MAX_BODY_SIZE: 50m
      FRAPPE_SITE_NAME_HEADER: erp.bezaforge.dev
      PROXY_READ_TIMEOUT: "120"
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 10.10.20.20
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
    image: frappe/erpnext:v16.26.2@sha256:549a6681171b99aece2502ef5af1d13d8eb4cc900bd1426f9c0a3cc8c9f2378a
    networks:
      default: null
    platform: linux/amd64
    ports:
      - "10.10.20.50:8080:8080"
    pull_policy: missing
    restart: unless-stopped
    volumes:
      - type: volume
        source: sites
        target: /home/frappe/frappe-bench/sites
        volume: {}
  queue-long:
    dns_search:
      - "."
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: frappe/erpnext:v16.26.2@sha256:549a6681171b99aece2502ef5af1d13d8eb4cc900bd1426f9c0a3cc8c9f2378a
    networks:
      default: null
      mariadb-network: null
    platform: linux/amd64
    pull_policy: missing
    restart: unless-stopped
    volumes:
      - type: volume
        source: sites
        target: /home/frappe/frappe-bench/sites
        volume: {}
  queue-short:
    dns_search:
      - "."
    command:
      - bench
      - worker
      - --queue
      - short,default
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: frappe/erpnext:v16.26.2@sha256:549a6681171b99aece2502ef5af1d13d8eb4cc900bd1426f9c0a3cc8c9f2378a
    networks:
      default: null
      mariadb-network: null
    platform: linux/amd64
    pull_policy: missing
    restart: unless-stopped
    volumes:
      - type: volume
        source: sites
        target: /home/frappe/frappe-bench/sites
        volume: {}
  redis-cache:
    dns_search:
      - "."
    image: redis:6.2-alpine@sha256:c9ab371a96b057d3642be9bd71cb1b3fe97920d345dc949860578bffb3d54460
    networks:
      default: null
    restart: unless-stopped
  redis-queue:
    dns_search:
      - "."
    image: redis:6.2-alpine@sha256:c9ab371a96b057d3642be9bd71cb1b3fe97920d345dc949860578bffb3d54460
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: redis-queue-data
        target: /data
        volume: {}
  scheduler:
    dns_search:
      - "."
    command:
      - bench
      - schedule
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: frappe/erpnext:v16.26.2@sha256:549a6681171b99aece2502ef5af1d13d8eb4cc900bd1426f9c0a3cc8c9f2378a
    networks:
      default: null
      mariadb-network: null
    platform: linux/amd64
    pull_policy: missing
    restart: unless-stopped
    volumes:
      - type: volume
        source: sites
        target: /home/frappe/frappe-bench/sites
        volume: {}
  websocket:
    dns_search:
      - "."
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: frappe/erpnext:v16.26.2@sha256:549a6681171b99aece2502ef5af1d13d8eb4cc900bd1426f9c0a3cc8c9f2378a
    networks:
      default: null
    platform: linux/amd64
    pull_policy: missing
    restart: unless-stopped
    volumes:
      - type: volume
        source: sites
        target: /home/frappe/frappe-bench/sites
        volume: {}
networks:
  default:
    name: erpnext-one_default
  mariadb-network:
    external: true
    name: mariadb-network
volumes:
  redis-queue-data:
    name: erpnext-one_redis-queue-data
  sites:
    name: erpnext-one_sites
x-backend-defaults:
  depends_on:
    configurator:
      condition: service_completed_successfully
  image: frappe/erpnext:v16.26.2@sha256:549a6681171b99aece2502ef5af1d13d8eb4cc900bd1426f9c0a3cc8c9f2378a
  pull_policy: missing
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
x-customizable-image:
  image: frappe/erpnext:v16.26.2@sha256:549a6681171b99aece2502ef5af1d13d8eb4cc900bd1426f9c0a3cc8c9f2378a
  pull_policy: missing
  restart: unless-stopped
x-depends-on-configurator:
  depends_on:
    configurator:
      condition: service_completed_successfully
