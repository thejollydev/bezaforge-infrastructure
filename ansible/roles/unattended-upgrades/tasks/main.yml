---
# ============================================================
# unattended-upgrades — automatic SECURITY patching only
# ============================================================
# Closes the window where a known CVE sits unpatched between the admin's manual
# passes. Deliberately does NOT auto-reboot: see defaults/main.yml.

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure which origins may auto-upgrade (security only)
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    # testparm-equivalent: refuse to install a config apt cannot parse,
    # otherwise EVERY later apt run on the host breaks.
    validate: apt-config -c %s dump

- name: Configure the periodic schedule (list update + upgrade + autoclean)
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump

- name: Enable + start the unattended-upgrades timer
  ansible.builtin.systemd:
    name: unattended-upgrades.service
    enabled: true
    state: started
    daemon_reload: true

# Retried because a freshly booted host races apt's own catch-up run (#1933).
# apt-daily-upgrade.timer is Persistent=true, so a VM that was off at 06:00
# runs the missed upgrade soon after it boots, and forge-ai is booted on
# demand for every pass (PR #517). unattended-upgrades does not wait for the
# lock: it logs "Lock file is already taken, exiting" to its own log, prints
# nothing, and exits 1, which stopped the pass on 2026-11-22. The catch-up run
# took 22 s then; two minutes covers it. A config that genuinely does not
# parse still fails, just after the retries instead of at once.
- name: Verify unattended-upgrades config parses and security origins resolve
  ansible.builtin.command: unattended-upgrades --dry-run
  register: uu_dryrun
  changed_when: false
  failed_when: uu_dryrun.rc != 0
  retries: 12
  delay: 10
  until: uu_dryrun.rc == 0
