---
# ============================================================
# brizza-sync — the sync between OpenProject and the agents' board
#
# See defaults/main.yml. After roles/agent-repos (the checkout it installs
# from), roles/never4ga (the tracker) and roles/hermes-team (the board).
# ============================================================

- name: Check the role's inputs
  ansible.builtin.assert:
    that:
      - brizza_sync_user | length > 0
      - brizza_sync_checkout | length > 0
      - brizza_sync_projects | length > 0
    fail_msg: >-
      brizza_sync_user, brizza_sync_checkout and at least one entry in
      brizza_sync_projects must be set in host_vars.
    quiet: true

- name: Read the sync's user
  ansible.builtin.getent:
    database: passwd
    key: "{{ brizza_sync_user }}"

- name: Keep the user's home and uid for the paths below
  ansible.builtin.set_fact:
    brizza_sync_home: "{{ ansible_facts.getent_passwd[brizza_sync_user][4] }}"
    brizza_sync_uid: "{{ ansible_facts.getent_passwd[brizza_sync_user][1] }}"

- name: Set the paths the sync uses
  ansible.builtin.set_fact:
    brizza_sync_venv: "{{ brizza_sync_home }}/{{ brizza_sync_venv_dir }}"
    brizza_sync_bin: "{{ brizza_sync_home }}/{{ brizza_sync_venv_dir }}/bin/brizza-sync"
    brizza_sync_config: "{{ brizza_sync_home }}/{{ brizza_sync_config_dir }}/sync.toml"

# The program is in the checkout, not in this repository. A checkout
# without it means the team's repository is on a commit from before the
# sync was added.
- name: Require the sync in the checkout
  ansible.builtin.stat:
    path: "{{ brizza_sync_checkout }}/sync/pyproject.toml"
  register: brizza_sync_source
  failed_when: not brizza_sync_source.stat.exists

# Every project needs a checkout Never4gA can map to its workspace: that
# path is how the sync says which tracker project it means.
- name: Require a checkout for each project
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ brizza_sync_projects }}"
  loop_control:
    label: "{{ item.name }}"
  register: brizza_sync_project_paths
  failed_when: not brizza_sync_project_paths.stat.exists

- name: Create the sync's directories
  ansible.builtin.file:
    path: "{{ brizza_sync_home }}/{{ item }}"
    state: directory
    owner: "{{ brizza_sync_user }}"
    group: "{{ brizza_sync_user }}"
    mode: '0700'
  loop:
    - "{{ brizza_sync_config_dir }}"
    - "{{ brizza_sync_state_dir }}"
    - .config/systemd/user

# Installed in place, once. The environment then runs the checkout's own
# files, so a later pull by roles/agent-repos is the update and this task
# has nothing more to do.
- name: Install the sync from the checkout
  ansible.builtin.command:
    cmd: >-
      sh -c '{{ brizza_sync_python }} -m venv {{ brizza_sync_venv }}
      && {{ brizza_sync_venv }}/bin/pip install --quiet --editable {{ brizza_sync_checkout }}/sync'
    creates: "{{ brizza_sync_bin }}"
  become: true
  become_user: "{{ brizza_sync_user }}"
  environment:
    HOME: "{{ brizza_sync_home }}"

- name: Write the sync's settings
  ansible.builtin.template:
    src: sync.toml.j2
    dest: "{{ brizza_sync_config }}"
    owner: "{{ brizza_sync_user }}"
    group: "{{ brizza_sync_user }}"
    mode: '0600'

# The test that fails without this: the installed command reads the
# settings it was just given and compares the tracker with the board. It
# changes nothing. Exit 1 means they disagree, which is a finding for
# Joseph and not a failed deploy; anything else is the sync not working.
- name: Run the sync's check
  ansible.builtin.command:
    cmd: "{{ brizza_sync_bin }} --config {{ brizza_sync_config }} check"
  become: true
  become_user: "{{ brizza_sync_user }}"
  environment:
    HOME: "{{ brizza_sync_home }}"
  register: brizza_sync_checked
  changed_when: false
  failed_when: brizza_sync_checked.rc not in [0, 1]
  when: not ansible_check_mode

- name: Say what the check found
  ansible.builtin.debug:
    msg: "{{ brizza_sync_checked.stdout_lines }}"
  when:
    - not ansible_check_mode
    - brizza_sync_checked.rc == 1

- name: Install the sync's services and timers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ brizza_sync_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ brizza_sync_user }}"
    group: "{{ brizza_sync_user }}"
    mode: '0644'
  loop:
    - brizza-sync.service
    - brizza-sync.timer
    - brizza-sync-check.service
    - brizza-sync-check.timer

# Two recurring jobs, which ADR 0014 principle 2 says run only once
# approved. Unapproved, they are installed and stopped.
- name: Schedule the sync and its check, once approved
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    daemon_reload: true
    enabled: "{{ brizza_sync_approved }}"
    state: "{{ 'started' if brizza_sync_approved else 'stopped' }}"
  loop:
    - brizza-sync.timer
    - brizza-sync-check.timer
  become: true
  become_user: "{{ brizza_sync_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ brizza_sync_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ brizza_sync_uid }}/bus"
  when: not ansible_check_mode

- name: Say the sync is waiting on approval
  ansible.builtin.debug:
    msg: >-
      The sync is installed and not scheduled. Run one pass by hand
      ({{ brizza_sync_bin }} run), read what it did, and set
      brizza_sync_approved in host_vars to schedule it.
  when: not brizza_sync_approved
