---
# Handlers only run when notified by a task that made a change.
# If SSH config is already hardened, restart sshd never fires.
# This is critical on a production host — unnecessary restarts
# of sshd briefly drop all SSH connections.

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

# The `restart systemd-resolved` handler moved to roles/dns-client with the
# resolver config it served (#638). Nothing in this role notifies it any
# more; leaving it would be a handler that can never fire.
