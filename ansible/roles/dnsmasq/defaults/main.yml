---
# ============================================================
# dnsmasq role — secondary internal resolver (#638)
# ============================================================
# OFF by default and opt-in per host, same posture as roles/network.
# This role binds :53 on a host; it must never fire somewhere it wasn't
# deliberately enabled, even if someone later adds the role to another play.
#
# Currently enabled on forge-hypervisor only (host_vars/forge-hypervisor).
#
# WHY THE HYPERVISOR: it is the only host that is not downstream of the
# thing being protected. AdGuard is a container on forge-ops, so any
# secondary living on forge-ops dies with it. forge-hypervisor also
# already refuses to depend on AdGuard for its own resolution (see
# roles/vault-sync's /etc/hosts pins), so it is the natural home.

dnsmasq_manage: false

# ------------------------------------------------------------
# Internal zone — the catch-all
# ------------------------------------------------------------
# Mirrors AdGuard's `*.bezaforge.dev -> 10.10.20.20` wildcard rewrite.
# Everything not named explicitly below resolves to Traefik on forge-ops,
# which is what AdGuard does.
#
# Derived from group_vars/all since #649 — see dnsmasq_host_records below
# for why this role no longer owns the zone data.
dnsmasq_internal_domain: "{{ bezaforge_dns_domain }}"
dnsmasq_internal_target: "{{ bezaforge_dns_default_target }}"

# ------------------------------------------------------------
# Per-host records — the exceptions to the wildcard
# ------------------------------------------------------------
# ⚠️ DERIVED FROM group_vars/all's `bezaforge_dns_rewrites` SINCE #649.
# Do not add records here — add them to that list and they reach BOTH
# resolvers. This used to be a hand-kept copy of AdGuard's table, which
# meant the two sides could drift with nothing detecting it.
#
# It is still NOT derived from the Ansible inventory, and that remains
# deliberate: the thing we must agree with is what the PRIMARY resolver
# answers. The inventory happens to match AdGuard for the managed hosts
# today, but generating from it would mean mirroring a different source —
# and any future disagreement between inventory and AdGuard would silently
# recreate the split-answer bug this role exists to remove. (It also holds
# records for things that are not Ansible hosts at all: `omada` is the
# OC220 controller, `forge-dev` does not currently exist.)
#
# THE FILTER: drop every record whose answer is already the wildcard's
# answer. Those are covered by the `address=/domain/target` catch-all at the
# bottom of the template, so listing them would add drift surface for no
# behaviour. This is semantic, not a coincidence — "answers with the default
# target" and "is covered by the catch-all" are the same statement. Today it
# removes 5 of 12 (the wildcard itself, the apex, forge-ops, netbox, docs),
# leaving exactly the 7 host records this file used to carry by hand.
#
# HOW THIS WAS FOUND (worth remembering): the first version of this role
# had only the wildcard above, because a probe of eleven service names,
# the apex, and a nonsense name all returned 10.10.20.20. That sample
# contained ZERO host names. A parity sweep after deploy caught four
# divergences, and AdGuard's actual config then revealed three more names
# no amount of guessing would have produced (forge-ops-mgmt, omada,
# forge-dev). Sample shape, not sample size, was the problem.
#
# Source: /opt/bezaforge/adguard/conf/AdGuardHome.yaml on forge-ops, read
# 2026-08-08. AdGuard's config is NOT Ansible-managed (see roles/adguard) —
# it is set through the web UI, so BOTH sides of this mirror are hand-kept.
#
# Entries whose answer equals dnsmasq_internal_target are omitted: the
# wildcard already covers them and listing them adds drift surface for no
# behaviour. Those were forge-ops, netbox, docs, and the apex.
#
# RE-VERIFY after changing the source list — this is a test that has
# already gone red once, so a green result means something:
#     scripts/dns-parity-check.sh
# (The inline dig loop that used to live here was superseded by that
# script, which retries, prints both answers, and distinguishes a silent
# resolver from a disagreeing one.)
# Records carry AdGuard's exact FQDN in `domain`, so the template emits
# `host-record={{ rec.domain }},{{ rec.answer }}` with nothing reassembled
# from a label plus a domain. One less transformation between the two
# resolvers is one less place for them to disagree.
#
# ⚠️ DO NOT PUT A JINJA COMMENT IN bezaforge.conf.j2. Two attempts on
# 2026-08-09 each produced a silently-broken config, and neither would have
# been caught by `dnsmasq --test`, because both were valid dnsmasq syntax:
#   1. `{#- ... -#}` — the leading dash strips the newline BEFORE the tag,
#      which glued the first host-record onto the end of the preceding
#      comment line. The record was commented out; forge-hypervisor would
#      have fallen through to the wildcard and answered 10.10.20.20.
#   2. Plain braces, but the comment TEXT quoted Jinja comment syntax —
#      and Jinja comments do not nest, so the inner closing brace ended the
#      comment early and dumped the rest into the rendered file.
# Both were caught only by the byte-identical `--check --diff`. Explanations
# belong here, in a file that is never rendered.
dnsmasq_host_records: >-
  {{ bezaforge_dns_rewrites
     | rejectattr('answer', 'equalto', bezaforge_dns_default_target)
     | list }}

# ------------------------------------------------------------
# Upstreams for everything that is NOT the internal zone
# ------------------------------------------------------------
# Plain DNS, not DoH — dnsmasq has no native DoH and this is a failover
# path only. Accepted degradation while AdGuard is down: no ad-blocking
# and unencrypted upstream queries. Both are strictly better than the
# current alternative, which is no resolution at all.
dnsmasq_upstreams:
  - 1.1.1.1
  - 1.0.0.1

# ------------------------------------------------------------
# Listeners
# ------------------------------------------------------------
# Addresses, NOT interface names. `interface=` plus a VLAN-aware bridge
# is ambiguous about which addresses actually get bound; listen-address
# is explicit. 127.0.0.1 is required for the host's OWN resolution
# (its resolv.conf points here), 10.10.10.10 serves the fleet.
#
# ⚠️ This binding is the ONLY thing scoping exposure. forge-hypervisor
# has no host firewall: ufw is not installed, /etc/pve/firewall/*.fw do
# not exist, and iptables INPUT is policy ACCEPT with an empty chain
# (verified 2026-08-08). Containment is this list plus gateway ACL rule 4
# (Deny The Bunker -> Management), nothing else.
dnsmasq_listen_addresses:
  - 127.0.0.1
  - 10.10.10.10

dnsmasq_cache_size: 1000

# Path of the drop-in this role owns. The main /etc/dnsmasq.conf is left
# as the distro shipped it (it is a dpkg conffile — owning it would mean
# a conffile prompt on every package upgrade).
dnsmasq_conf_file: /etc/dnsmasq.d/bezaforge.conf
