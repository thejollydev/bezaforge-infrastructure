networks:
  bezaforge-net:
    external: true

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.11@sha256:7554dba313c84e44fee921ef3b5626ba1c711e412e82815e8c957517026112a9
    container_name: uptime-kuma
    restart: unless-stopped
    dns:
      - 10.10.20.20
    volumes:
      - /opt/bezaforge/uptime-kuma/data:/app/data
    networks:
      - bezaforge-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`uptime.bezaforge.dev`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
