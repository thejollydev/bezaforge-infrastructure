# learncast — the one server block for learn.bezaforge.dev. Deployed by the
# services role to /opt/bezaforge/learncast/nginx.conf and bind-mounted over
# the image's default.conf. Traefik terminates TLS; this listens on plain 80
# on the Docker network only.
server {
    listen 80;
    server_name learn.bezaforge.dev;
    root /usr/share/nginx/html;
    index index.html;

    # Private feed on a private network, but keep crawlers off it anyway.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # No directory listing; a missing file is a plain 404.
    autoindex off;

    # The image's mime.types already maps .mp3 to audio/mpeg; .xml is
    # text/xml there, which podcast apps accept, but the feed is RSS and
    # says so.
    location = /feed.xml {
        types { application/rss+xml xml; }
        default_type application/rss+xml;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
