---
# ============================================================
# ollama role defaults
#
# Codifies the Ollama install on forge-ai (Ubuntu 24.04 +
# AMD RX 7900 XT + ROCm). Ollama itself has been running
# manually since Phase 1 — this role brings the install
# under config management without re-installing from
# scratch: the install below is gated on the version the
# host already reports.
# ============================================================

# Install method.
#   "bundles" → download the release bundles, verify them against the
#               release's own sha256sum.txt, extract them (tasks/main.yml)
#   "skip"    → assume ollama is installed by other means; only manage
#               the unit, environment and models
#
# "script" — piping https://ollama.com/install.sh into sh — was removed
# 2026-09-16 (#1225). It streams both bundles through curl | zstd | tar,
# which cannot resume a stalled transfer, cannot verify what it installed,
# carries no timeout, and runs a remote script as root. The 2026-09-15
# upgrade spent 30 minutes in that state looking hung.
ollama_install_method: bundles

# Where the bundles come from, and which ones. Upstream picks the rocm
# bundle by probing lspci for an amdgpu; forge-ai IS that case, so the
# list is explicit here rather than detected at run time.
ollama_release_base: https://github.com/ollama/ollama/releases/download
ollama_bundles:
  - ollama-linux-amd64.tar.zst
  - ollama-linux-amd64-rocm.tar.zst

# Both bundles unpack into /usr/local (bin/ollama + lib/ollama/...), the
# same layout upstream's script produces.
ollama_install_dir: /usr/local
ollama_cache_dir: /var/cache/bezaforge/ollama
# Keep the downloaded bundles (~2.4 GB) so a re-run or a rebuild does not
# pull them again. Set false to reclaim the space at the cost of the next
# install repeating the download. Bundles live in <cache>/<version>/, and a
# successful install removes every other version's directory, so at most
# one version is ever kept.
ollama_cache_keep: true
ollama_download_retries: 5
ollama_install_packages:
  - curl
  - zstd

# Pin to a specific version, or leave empty to install whatever
# the upstream script ships today. When set, the install task
# only re-runs the script if the local binary's version differs.
# Check current upstream releases at https://github.com/ollama/ollama/releases
#
# NOTE: an EMPTY value only (re)installs when the binary is MISSING — it
# does NOT update a stale-but-present install. So an explicit pin is also
# how we keep Ollama current: bump this when a newer stable lands and
# re-run `--tags ollama`. Bumped 0.20.5 → 0.30.7 on 2026-06-08 (FORGE-5):
# 0.20.5's llama.cpp was too old to load Unsloth UD Dynamic-2.0 GGUF quants.
#
# Bumped 0.30.7 → 0.33.3 on 2026-09-05. Same failure shape as the last bump,
# one layer up: 0.30.7 cannot pull newer models at all. `ollama pull
# laguna-xs-2.1` returns `412: The model you are attempting to pull requires
# a newer version of Ollama`, so the model is unevaluable rather than slow.
# Renovate now watches this pin (see .github/renovate.json) — it did not
# before, which is why three minor versions accumulated unnoticed.
ollama_version: "0.34.2"

# GPU device-node access groups for the `ollama` SERVICE user (created by
# the install script). System-level ROCm packages + admin-user membership
# live in roles/rocm; this is just the service account's membership, set
# here because the user only exists after Ollama installs (FORGE-29).
ollama_gpu_groups:
  - render
  - video

# ------------------------------------------------------------
# Runtime config (rendered into /etc/systemd/system/ollama.service.d/override.conf)
# ------------------------------------------------------------

# Bind address. 0.0.0.0 exposes the API to the VLAN — required so
# forge-ops + forge-brizza can hit http://10.10.50.10:11434.
# UFW + Omada SDN enforce the actual ACL; ollama itself has no auth.
ollama_host: "0.0.0.0:11434"

# Where models live. Matches the upstream-installed default so
# this role is a no-op on the live forge-ai install instead of
# silently moving the model dir on first run (which would make
# every existing model look gone).
#
# Moving models is a deliberate operation: stop ollama, rsync
# the dir, set this var, run the role, verify with `ollama list`.
# A single 70B model is ~40 GB, so if root fills up consider
# bind-mounting /usr/share/ollama → a larger LV instead of
# changing this path.
ollama_models_dir: "/usr/share/ollama/.ollama/models"

# How long an idle loaded model stays in VRAM before unload.
# "5m" is the upstream default; "24h" trades VRAM availability
# for cold-start latency. Joseph's pattern is interactive
# back-and-forth, so a long keep-alive is preferable.
ollama_keep_alive: "24h"

# How many models may be loaded concurrently on the GPU. 2 lets a model
# plus a small embedder co-reside without Ollama evicting/reloading on
# every switch (the 24 GB card fits e.g. a ~17 GB LLM + a <1 GB embedder).
# Tune to the actual consumer's working set.
ollama_max_loaded_models: 2

# Custom models built from a Modelfile (e.g. to pin a context length
# on a pulled GGUF). Each entry → `ollama create <name> -f <Modelfile>`.
#   - name: the local model name clients reference
#   - from: the base model (a pulled tag or hf.co GGUF ref)
#   - parameters: dict of Modelfile PARAMETER lines (e.g. num_ctx)
# The `from` base must be in ollama_models (pulled) for create to work.
# Re-created only when the rendered Modelfile changes (idempotent).
ollama_modelfiles: []

# ROCm GPU detection override. The 7900 XT (gfx1100) is supported
# natively in ROCm 6+; older boards may need HSA_OVERRIDE_GFX_VERSION.
# Leave empty unless ROCm fails to detect the card.
ollama_hsa_override_gfx_version: ""

# Extra arbitrary env vars merged into the systemd EnvironmentFile.
# Example: { OLLAMA_DEBUG: "1", OLLAMA_NUM_PARALLEL: "4" }
ollama_extra_env: {}

# ------------------------------------------------------------
# Model seeding
# ------------------------------------------------------------
# Models to pull on first run. Each entry is the upstream model
# name (https://ollama.com/library) — `ollama pull` is idempotent
# and a no-op when the model is already at the requested tag.
# Override per-host in inventory/host_vars/<host>.yml.
ollama_models: []

# Whether `ollama pull` failures should fail the play. False keeps
# the play green when a single model name is wrong or temporarily
# unavailable; the failure is still logged.
ollama_models_fail_on_error: false

# ------------------------------------------------------------
# Firewall
# ------------------------------------------------------------
# UFW rule allowing the API port from approved VLANs. The 'common'
# role already pins UFW defaults; this just adds the per-source
# allow rules. Empty list → no UFW changes.
ollama_ufw_allow_from:
  - 10.10.50.0/24   # AI VLAN (forge-brizza)
  - 10.10.20.0/24   # Production VLAN (forge-ops services)
  - 10.10.30.0/24   # Dev VLAN — currently has no hosts; forge-dev (10.10.30.10)
                    # is planned, so this is kept rather than pruned.
  # jolly-LOQ-arch on WIFI, which is where it actually lives (wlan0,
  # 10.10.40.99). The Dev-VLAN entry above says "when on this VLAN" and that
  # condition has not been true — so the workstation had never once reached
  # this API, while forge-ops polled it happily the whole time. UFW's default
  # deny DROPS rather than rejects, so it presented as a 5s timeout, which
  # reads like a dead service rather than a closed door.
  #
  # Host, not /24, deliberately: 10.10.40.0/24 is a client WiFi VLAN carrying
  # phones and whatever else, unlike the three server VLANs above. This
  # matches the convention already applied to this machine on this host, where
  # 22/tcp is allow-listed to 10.10.40.99 rather than to the subnet. It does
  # depend on the DHCP reservation that the SSH rule already relies on.
  - 10.10.40.99     # jolly-LOQ-arch over WiFi (workstation; matches the 22/tcp host rule)
  # Same workstation over WireGuard. Rare but wanted (Joseph, 2026-08-09):
  # without it, Ollama is reachable from the laptop at home and silently not
  # reachable while away — and the failure mode is UFW's DROP, i.e. a ~5s
  # timeout that reads as "the AI host is down" rather than "you are on the
  # wrong address". Both laptop addresses are already paired this way in
  # group_vars/all's common_admin_ssh_sources; this brings Ollama in line
  # with SSH instead of covering only half the cases.
  - 10.10.99.99     # jolly-LOQ-arch over WireGuard (same host, remote)
