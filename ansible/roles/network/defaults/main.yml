---
# ============================================================
# network role — codify /etc/network/interfaces (Debian ifupdown)
# ============================================================
# OFF by default and opt-in per host. This role writes the file that
# defines a host's IP addresses and VLAN tagging; it must never fire on
# a host that hasn't deliberately opted in, even if someone later adds
# the role to another play.
#
# Currently enabled on forge-ops only (see host_vars/forge-ops/vars.yml).
# NOT applicable to:
#   * forge-hypervisor — Proxmox OWNS /etc/network/interfaces (the file
#     opens with its own "autogenerated ... do NOT modify" banner and PVE
#     stages changes via interfaces.new). Templating it would fight PVE,
#     and the thing at risk is vmbr0, which every VM hangs off. #628
#     resolved this as deliberately-not-codified, not as an open gap.
#   * forge-ai / forge-brizza / forge-erp — Ubuntu, netplan not ifupdown.

network_manage_interfaces: false
