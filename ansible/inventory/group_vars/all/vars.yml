---
# ============================================================
# group_vars/all — applies to every host in the inventory
#
# Restructured 2026-07-02 (FORGE-85): all.yml → all/vars.yml so a
# sibling encrypted all/vault.yml can hold fleet-shared secrets.
# Currently there: vault_fileshare_smb_password (the `files` SMB
# credential — read by roles/fileshare on the hypervisor AND
# roles/fileshare-client on forge-brizza/forge-ai).
# ============================================================

# Silences the "discovered Python interpreter" warning Ansible
# prints on every play. `auto_silent` keeps the auto-discovery
# behavior (so Python upgrades on the target host don't break
# the playbook) but suppresses the deprecation warning.
# Documented at:
# https://docs.ansible.com/ansible-core/devel/reference_appendices/interpreter_discovery.html
ansible_python_interpreter: auto_silent

# ------------------------------------------------------------
# Admin SSH sources
# ------------------------------------------------------------
# IPs allowed to SSH to EVERY host, in addition to the management
# VLAN (10.10.10.0/24, allowed separately in roles/common). This
# codifies hand-added UFW rules that existed only on forge-ops
# (drift discovered 2026-06-08, FORGE-36 session) — without them a
# fresh-UFW host (e.g. forge-ai) would lock Joseph out the moment
# the common role enables UFW.
#
# Joseph administers from his laptop:
#   - 10.10.40.99 — laptop on Home WiFi (VLAN 40)
#   - 10.10.99.99 — laptop over WireGuard (while away)
# /32 single hosts (strictest — not the whole VLAN, so other Home
# devices can't SSH). Keep both DHCP-reserved in Omada so they
# don't drift. Omada inter-VLAN ACLs already permit laptop→any-VLAN
# routing; this is the separate per-HOST (UFW) accept layer.
common_admin_ssh_sources:
  - 10.10.40.99
  - 10.10.99.99

# ------------------------------------------------------------
# Monitoring scrape sources
# ------------------------------------------------------------
# Hosts allowed to reach node_exporter (tcp/9100) on every
# common-managed host. Prometheus runs on forge-ops and scrapes from
# its VLAN-20 NIC (10.10.20.20) — NOT the mgmt VLAN — so the
# "full access from management VLAN" rule in roles/common does not
# cover it. This codifies a manual `ufw allow` that lived only on
# forge-ai and was lost 2026-06-14, which blocked the scrape and
# fired a false Grafana "forge-ai / ollama down" alert. Same drift
# class as common_admin_ssh_sources (FORGE-36).
#
# Fleet node_exporter UFW posture (FORGE-59) — this allow only matters
# on hosts running an ACTIVE default-deny UFW, which is exactly the
# `common`-managed set:
#   - forge-ops, forge-ai  → run `common` → get this allow. ✓
#   - forge-hypervisor     → pve-firewall (disabled), no UFW → reachable.
#   - forge-erp            → no `common` BY DESIGN (a first-touch UFW
#                            enable could lock it out, site.yml); no
#                            active UFW → reachable. If UFW is ever
#                            enabled here, add a 9100 allow from
#                            10.10.20.20 alongside it.
#   - forge-brizza         → own role, no active UFW → reachable. Same
#                            caveat as forge-erp if UFW is later enabled.
# So there is no live gap; all six scraped targets in
# roles/monitoring/files/prometheus.yml are reachable. Documented here
# (not added as dead gated tasks) so the next firewall change on a
# non-`common` host carries the rule forward.
common_monitoring_sources:
  - 10.10.20.20   # forge-ops (Prometheus) VLAN-20 scrape source

# ------------------------------------------------------------
# Internal DNS zone — THE single source of truth (#649)
# ------------------------------------------------------------
# BezaForge has TWO resolvers that must answer identically: AdGuard on
# forge-ops (primary, 10.10.20.20) and dnsmasq on forge-hypervisor
# (secondary, 10.10.10.10 — roles/dnsmasq, added by #638). Until #649
# this table existed TWICE, hand-kept on both sides: AdGuard's in its web
# UI, dnsmasq's in roles/dnsmasq/defaults. Nothing detected them drifting.
#
# Now both derive from this list:
#   - roles/adguard   reconciles it into AdGuard via the control API
#   - roles/dnsmasq   renders the subset the wildcard does not already cover
#
# A drift is invisible in normal operation because AdGuard answers
# everything; it surfaces only during an AdGuard outage — exactly when
# nobody is placed to debug DNS. That is the whole reason this is one list.
#
# ⚠️ THESE ARE ADGUARD'S EXACT STRINGS, read from its control API on
# 2026-08-09 and reproduced verbatim — full FQDNs, not bare labels.
# #649's own description tabulated them as bare labels ("forge-hypervisor"),
# which would have matched nothing: AdGuard rewrites match the queried name,
# so a label without the domain never fires. Mirror the thing you are
# mirroring, not a tidied-up rendering of it.
#
# ADDING A RECORD: add it here, run site.yml --tags adguard,dnsmasq. It
# reaches both resolvers. Do NOT add it in the AdGuard web UI — a UI-added
# record is invisible to dnsmasq and will be reported as unmanaged drift.
bezaforge_dns_domain: bezaforge.dev

# The catch-all answer: Traefik on forge-ops. Any record below whose answer
# equals this is ALREADY covered by the wildcard, and roles/dnsmasq omits it
# for that reason — not as an oversight. Keeping them here anyway is what
# makes this list a faithful mirror of AdGuard rather than a summary of it.
bezaforge_dns_default_target: "10.10.20.20"

bezaforge_dns_rewrites:
  # --- the catch-all + apex --------------------------------------------
  - {domain: "*.bezaforge.dev", answer: "10.10.20.20"}
  - {domain: "bezaforge.dev", answer: "10.10.20.20"}
  # --- names the wildcard already covers (explicit in AdGuard anyway) ---
  - {domain: "forge-ops.bezaforge.dev", answer: "10.10.20.20"}
  - {domain: "netbox.bezaforge.dev", answer: "10.10.20.20"}
  - {domain: "docs.bezaforge.dev", answer: "10.10.20.20"}
  # --- real exceptions: these MUST differ from the wildcard -------------
  - {domain: "forge-hypervisor.bezaforge.dev", answer: "10.10.10.10"}
  - {domain: "forge-ops-mgmt.bezaforge.dev", answer: "10.10.10.20"}
  - {domain: "omada.bezaforge.dev", answer: "10.10.10.5"}
  - {domain: "forge-ai.bezaforge.dev", answer: "10.10.50.10"}
  - {domain: "forge-erp.bezaforge.dev", answer: "10.10.20.50"}
  - {domain: "forge-brizza.bezaforge.dev", answer: "10.10.50.20"}
  # forge-dev (VMID 102) does not currently exist — removed from the fleet.
  # Mirrored deliberately on Joseph's call 2026-08-08: he intends to rebuild
  # it, so this is a placeholder rather than stale config, and the two
  # resolvers agreeing matters more than the record being live.
  - {domain: "forge-dev.bezaforge.dev", answer: "10.10.30.10"}
