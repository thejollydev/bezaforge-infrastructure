---
# Connection
ansible_host: 10.10.20.50
ansible_user: joseph

# ------------------------------------------------------------
# Resolver config (roles/dns-client, #638)
# ------------------------------------------------------------
# Until 2026-08-08 this host had NO managed DNS at all — it runs no
# `common` by design (a first-touch UFW enable could lock admin out, see
# site.yml), and `common` was the only place DNS was configured. Its
# resolved.conf is a bare `[Resolve]`; everything came from the link via
# 50-cloud-init.yaml. That is precisely the gap #638 exists to close.
#
# ⚠️ The netplan ID key is `enp6s18`, an ALTNAME — the interface presents
# as `ens18` everywhere you would look for it. See the identical note in
# host_vars/forge-ai.yml for why keying it `ens18` fails silently.
dns_client_method: netplan
dns_client_netplan_id: enp6s18

# ------------------------------------------------------------
# Retired listeners (#963)
# ------------------------------------------------------------
# Same reasoning as forge-ops: rpcbind on 0.0.0.0:111, reachable from
# the Home/guest VLAN through the gateway's default-permit gap, serving
# nothing — /etc/exports is empty and this host neither serves nor
# mounts NFS. Masked, not removed, so an nfs-common upgrade cannot
# resurrect it.
systemd_masked_units:
  - rpcbind.service
  - rpcbind.socket
