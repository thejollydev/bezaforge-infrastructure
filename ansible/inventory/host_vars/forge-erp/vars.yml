# Connection
ansible_host: 10.10.20.50
ansible_user: joseph

# ------------------------------------------------------------
# Resolver config (roles/dns-client, #638)
# ------------------------------------------------------------
# Until 2026-08-08 this host had NO managed DNS at all — it runs no
# `common` by design (a first-touch UFW enable could lock admin out, see
# site.yml), and `common` was the only place DNS was configured. Its
# resolved.conf is a bare `[Resolve]`; everything came from the link via
# 50-cloud-init.yaml. That is precisely the gap #638 exists to close.
#
# ⚠️ The netplan ID key is `enp6s18`, an ALTNAME — the interface presents
# as `ens18` everywhere you would look for it. See the identical note in
# host_vars/forge-ai.yml for why keying it `ens18` fails silently.
dns_client_method: netplan
dns_client_netplan_id: enp6s18

# ------------------------------------------------------------
# Retired listeners (#963) — NOT APPLICABLE HERE
# ------------------------------------------------------------
# forge-ops masks rpcbind because it genuinely runs it. This host does
# NOT: the rpcbind package is not installed, nothing listens on 111, and
# the only rpcbind unit present is the static rpcbind.target that ships
# with systemd itself. #963's prose says "rpcbind on both hosts", but the
# listening surface it actually documents for forge-erp is 22, 8080 and
# 9100 — no 111. The prose was wrong and the evidence was right.
#
# Masking it here was added on 2026-09-01 and reverted the same day: the
# systemd module cannot find a unit that does not exist, so the task
# failed and took the ENTIRE forge-erp play with it — including the
# ERPNext fix that play exists to deliver. Caught by --check before it
# reached a live run.
