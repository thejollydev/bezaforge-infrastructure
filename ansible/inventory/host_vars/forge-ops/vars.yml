---
# Connection
ansible_host: 10.10.20.20
ansible_user: joseph

# Machine identity
hostname: forge-ops
timezone: America/Detroit
locale: en_US.UTF-8

# Network
management_ip: 10.10.10.20
production_ip: 10.10.20.20
domain: bezaforge.dev

# /etc/network/interfaces (roles/network, #628)
# Codified 2026-08-08. Was hand-written and unmanaged — a rebuild returned
# forge-ops with no VLAN 20 interface, i.e. no production IP and no AdGuard,
# which is DNS for every VLAN.
#
# Live and correct (verified port-by-port 2026-08-07, #61): enp44s0 UNTAGGED
# is VLAN 10 management; enp44s0.20 TAGGED is VLAN 20 production and holds
# the default route. There is NO enp44s0.10 — six docs claimed the reverse
# until 2026-08-07. Router side: port 2, Native VLAN Management(10).
network_manage_interfaces: true
network_mgmt_interface: enp44s0
network_mgmt_vlan: 10
network_prod_interface: enp44s0.20
network_prod_vlan: 20
network_prod_gateway: 10.10.20.1
# network_mgmt_dns REMOVED 2026-08-09 (#638, Piece 4).
#
# This host used to carry `dns-nameservers 1.1.1.1` on enp44s0, applied via
# ifupdown's if-up.d/resolved hook. It was never codified deliberately — it
# came from the installer — and until #638 it was the only *plausibly*
# working AdGuard-down fallback anywhere on the fleet, so #628 kept it.
#
# It is removed now because the real fallback exists and is PROVEN: the
# failover test (docs/runbooks/dns-failover-test.md) took AdGuard away twice
# on this host and every internal name still resolved correctly via dnsmasq
# on 10.10.10.10. The link-scoped 1.1.1.1 never answered a single query in
# any test — it was latent, not protective.
#
# Removing it also fixes a real defect: it gave forge-ops a SECOND scope
# that claimed `bezaforge.dev` while holding a public resolver that returns
# NXDOMAIN for internal names. That scope winning a race would have broken
# internal resolution intermittently. One scope, two internal-aware servers,
# is the invariant roles/dns-client maintains.

# ------------------------------------------------------------
# Resolver config (roles/dns-client, #638)
# ------------------------------------------------------------
# `resolved`, not `netplan`: forge-ops is Debian bare metal running
# ifupdown — there is no netplan here, so systemd-resolved's global config
# is the native place for the server list.
#
# This host HAD two DNS scopes until 2026-08-09: the global one this sets,
# plus a link scope on enp44s0 carrying 1.1.1.1 from the installer-era
# `dns-nameservers` line. Both claimed `bezaforge.dev` while holding
# DIFFERENT servers, which is why forge-ops's behaviour could not be
# explained from its config — AdGuard won every measured trial, but that
# was unexplained safety, not established safety.
#
# That line is now removed (see the block above), so this host has ONE
# scope holding both internal-aware servers, matching the rest of the fleet.
#
# ⚠️ The removal is INERT until networking restarts or the host reboots —
# roles/network is deliberately handler-free. To retire the live link scope
# without a reboot (safe; the global scope keeps answering throughout):
#     sudo resolvectl revert enp44s0
# Confirm afterwards that `resolvectl domain` shows bezaforge.dev on Global
# ONLY, and that `resolvectl status` shows no servers on Link 3.
dns_client_method: resolved

# NFS mounts
# gdrive was previously mounted out-of-band during Cognee Phase A — added
# here 2026-05-17 so it's Ansible-managed (audit drift fix).
# forge-ops-backup is new 2026-05-17 per ADR 0001 — nightly backup target.
#
# ⚠️ THESE ARE HARD MOUNTS, AND FOR THE BACKUP TARGET THAT IS A DECISION,
# NOT AN ACCIDENT OF THE DEFAULT (#957, settled 2026-09-01). `defaults`
# means `hard`: when the server stalls, writes BLOCK indefinitely instead
# of erroring. On 2026-08-31 the hypervisor's failing SATA link did
# exactly that mid-rsync — the job hung silently until the service's 1h
# TimeoutStartSec killed it and alerted. That division of labour is the
# design: the mount guarantees rsync can never half-succeed against a
# stalled server and report a partial tree as a completed backup (which
# `soft`'s EIO-after-timeo semantics would permit), and the unit-level
# timeout owns turning a hang into a loud failure. Do not add `soft`
# here to make the hang "recover" — for a backup target, failing loudly
# IS the correct recovery.
# bezapool/media + bezapool/downloads mounts REMOVED 2026-07-18 (#485):
# their only consumers were Jellyfin + Seedbox (retired); the datasets were
# destroyed on the hypervisor and the exports retired with them.
nfs_mounts:
  - src: "10.10.10.10:/bezapool/gdrive"
    path: "/mnt/bezapool/gdrive"
  - src: "10.10.10.10:/bezapool/forge-ops-backup"
    path: "/mnt/bezapool/forge-ops-backup"
  # bezapool/vault RO mount REMOVED 2026-06-09 (FORGE-49): its only
  # consumer was Cognee (retired 2026-06-09); the hypervisor export
  # stanza was retired with it.

# Service directory
bezaforge_root: /opt/bezaforge

# Docker services deployed by the 'services' role
# (traefik, adguard, monitoring have their own roles)
# NOTE: harbor used its own offline installer (retired 2026-05-17)
# NOTE: wiki was retired 2026-05-17 (Wiki.js — ROADMAP carryover #21)
compose_services:
  - gitea
  - uptime-kuma
  - netbox
  - langfuse
  - homepage
  # Open WebUI — shared chat UI fronting Ollama (forge-ai) + Brizza/Hermes
  # (added later). Env-var service: secret in .env (open_webui_secret_key,
  # vault), non-secrets inline in the compose. FORGE-53.
  - open-webui
  # Calibre-Web-Automated — ebook library + reader. Simple service (no
  # secrets; admin is set in the UI, not env). Re-introduces ebooks to
  # BezaForge after the Kavita retirement (FORGE-16); web-upload workflow.
  - calibre-web
# taiga retired 2026-05-22 — see ROADMAP carryover #23 / guide 12.
# jellyfin + seedbox retired 2026-07-18 (#485) — media stack removed from
# BezaForge entirely; reverses FORGE-67/68. Compose files deleted, the
# bezapool/media + bezapool/downloads datasets destroyed on the hypervisor.

# Feature flags
nfs_client: true

# ------------------------------------------------------------
# Docker-published ports reachable from The Bunker (#963)
# ------------------------------------------------------------
# Measured 2026-09-01 by probing from another VLAN: 2222, 3053 and 3100
# all answered, while 22 and 111 were correctly refused by UFW. The
# difference is that the first three are Docker-published, and Docker's
# iptables rules bypass UFW's INPUT chain, so roles/common's
# default-deny never applied to them.
#
# 3100 (Loki) is absent from this list because it was fixed properly
# instead: nothing consumed its published binding — promtail and Grafana
# both reach it over the Docker network, and no other host runs a log
# shipper — so loki-compose.yml now binds 127.0.0.1 and the port is gone
# from the network entirely. Unpublishing beats filtering when there is
# no consumer.
#
# These two have real remote consumers and so are filtered rather than
# removed:
#   2222  Gitea SSH. vault-sync on forge-hypervisor (10.10.10.10) pushes
#         the knowledge vault through it — verified, its origin is
#         ssh://git@git.bezaforge.dev:2222 and that name resolves here —
#         plus Joseph's laptop from The Bunker WiFi and WireGuard.
#   3053  AdGuard admin UI. Browser access from the laptop. The adguard
#         role's own API reconciliation is unaffected either way: it
#         runs ON forge-ops against this host's own IP, and host-local
#         traffic never traverses FORWARD.
docker_firewall_ports:
  - name: "Gitea SSH"
    port: 2222
    proto: tcp
  - name: "AdGuard admin UI"
    port: 3053
    proto: tcp

# ------------------------------------------------------------
# Retired listeners (#963)
# ------------------------------------------------------------
# rpcbind listened on 0.0.0.0:111 — answering on the Production IP,
# which every device on VLAN 40 (The Bunker) can reach through the
# gateway's default-permit posture — while serving NOTHING:
# /etc/exports is empty, this host serves no NFS, and its own NFS
# *client* mounts are v4.2, which needs no rpcbind (v4 is single-port
# 2049, in-band locking). The picture-frame incident's blast-radius
# audit is what surfaced it. Masked rather than removed because
# nfs-common drags it back on upgrade; a stretch of systemd-hygiene's
# "impossible units" charter, deliberate — an exposed listener with no
# consumer is hygiene in the same sense.
systemd_masked_units:
  - rpcbind.service
  - rpcbind.socket

# --- health-check expectations (health.yml) ---
# The services that, if down, mean the fleet is degraded: DNS, ingress,
# the work tracker, and the monitoring pipeline.
health_expected_containers:
  - adguard
  - traefik
  - prometheus
  - grafana
  - loki
  - openproject
  - outline
  - gitea
  - uptime-kuma
  - homepage
