---
# Connection
ansible_host: 10.10.50.20
ansible_user: joseph

# Machine identity
hostname: forge-brizza
timezone: America/Detroit
locale: en_US.UTF-8

# ------------------------------------------------------------
# Resolver config (roles/dns-client, #638)
# ------------------------------------------------------------
# Declared explicitly even though these currently match the role defaults.
# forge-brizza's netplan key is `eth0` while its two siblings use the
# `enp6s18` altname — so the fleet has no single right answer, and a future
# edit to the role default would silently move this host onto the wrong
# key. Every netplan host states its own.
#
# `eth0` is a genuine rename here, not an altname: 50-cloud-init.yaml
# matches by MAC (bc:24:11:bd:4b:e4) and applies `set-name: eth0`.
dns_client_method: netplan
dns_client_netplan_id: eth0

# Feature flags
# nfs_client: keeps the bezapool/gdrive NFS mount (LAN access to the
# Drive replica). Insync retired 2026-06-06 (ADR 0002) + purged
# 2026-06-09 (FORGE-35) — the replica is pulled by roles/gdrive-replica
# on the hypervisor now.
nfs_client: true
# Docker engine enabled 2026-05-30 (FORGE-24) — runs Brizza's Hermes Agent
# container (nousresearch/hermes-agent) per Brizza ADR 0009. Unblocks BRIZZA-51.
forge_brizza_install_docker: true

# NFS mounts (used by forge-brizza role when nfs_client is true).
# Source is forge-hypervisor's bezapool/gdrive ZFS dataset.
# bezapool/vault added 2026-06-06 (ADR 0002) — the vault git clone;
# RW here (export squashes to uid 1000) for vault-sync + Hermes.
nfs_mounts:
  - src: 10.10.10.10:/bezapool/gdrive
    path: /mnt/bezapool/gdrive
  # NB: the FORGE-25 ~/.hermes backup does NOT use NFS — forge-brizza's
  # NFS client EINVALs on recursive dir traversal (FORGE-49), which broke
  # rsync --delete against an NFS target. It rsyncs over SSH instead
  # (roles/forge-brizza hermes-backup-rsync). See defaults/main.yml.
# bezapool/vault NFS mount REMOVED 2026-06-09 (FORGE-49): recursive
# traversal over the mount intermittently EINVALed when a vaultsync
# checkout on the hypervisor raced the NFS client — broke Hermes vault
# grounding. Replaced by a LOCAL git clone (vault_sync_* block below);
# the hypervisor export stanza was retired with it.

# Desktop package override. Role default is ubuntu-desktop-minimal as
# the conservative pick for a generic assistant host; forge-brizza
# wants the full meta because Insync needs a complete GNOME session
# (browser for OAuth, file manager, full app menu) and the future
# Brizza Python + LangGraph runtime may want it too for any GUI
# automation tasks.
forge_brizza_desktop_package: ubuntu-desktop

# --- vault-sync: local vault clone (FORGE-49, ADR 0002 v1.3) ---
# Hermes vault grounding reads/writes a LOCAL clone — no NFS in the
# path, so the vaultsync-checkout-vs-NFS-reader race can't occur. The
# 1-min timer commits+pushes Hermes writes to Gitea and pulls laptop
# edits. Timer-only deployment: no webhook receiver, no mirror fan-out
# (the hypervisor deployment owns offsite mirrors), no NFS lease
# sysctl (not an NFS server), no /etc/hosts pins (AdGuard resolves
# git.bezaforge.dev here).
# One-time post-deploy: register
# /home/joseph/.ssh/id_ed25519_vault_sync.pub as a WRITE deploy key on
# the Gitea vault repo — the first play run fails at the clone step
# until then (expected).
#
# ⚠️ REPOINTED 2026-08-30 (#791, Brizza #793 / RSK-02). This was
# /home/joseph/Vaults/Master-Mind, a clone of the RETIRED Master-Mind
# vault, together with an explicit pin to that repo added when the role
# default moved. Its Gitea repo froze at 2e463756 on 2026-08-15, so the
# timer kept fetching cleanly, finding nothing and exiting 0 for a
# fortnight while every vault answer Brizza gave was that date or older.
# Clean exits are why nothing alerted. Dropping the pin returns this
# host to the role default; the new path is a FRESH clone, and the old
# one is retired by hand (see the PR), never rewired in place.
vault_sync_clone_path: /home/joseph/Vaults/never-knowledge
vault_sync_user: joseph
vault_sync_create_user: false
# ⚠️ INTERIM, pending Brizza Phase 2 gate item G3 — which is UNDECIDED.
# G3 ("vault grounding re-pointed at something alive") names three
# options: re-point at the OKF vault, ground through bezaforge ADR 0003
# shared file access, or drop grounding and reintroduce it in the
# rebuild. This is option 1, and the phase plan says all three depend on
# G1 (rebuild) and G2 (dedicated-VM) and should be decided together.
# Nothing here forecloses the other two: every one of them assumes a
# live vault exists on disk first, and Brizza ADR 0012 §7 keeps the
# vault as source of truth with any memory layer a derived cache.
#
# Brizza's drop zone is now never-knowledge's own 00_Inbox, which exists
# for exactly this (a capture whose filing is not yet decided). It needs
# no variable here: nothing in this role acts on the drop zone any more,
# and the path Brizza writes to is Hermes's own config, not Ansible's.
# The drop-zone PATH is only right if G3 lands on option 1; the vault
# NAME is stale as a matter of fact either way.
#
# The 11 unprocessed handoffs left in the old 00-INBOX/Brizza are
# OpsKit-Library content that happened to sit where Brizza wrote — not
# Brizza's, and nothing here migrates them. They stay committed in the
# retired repo until that workspace triages them.
#
# vault_sync_normalize_perms_path stays absent — removed with the
# hypervisor repoint, for reasons independent of G3 (dead since Hermes
# went bare-metal 2026-06-16). Its rationale is in that commit.
vault_sync_ssh_key: /home/joseph/.ssh/id_ed25519_vault_sync
vault_sync_manage_leases: false
vault_sync_manage_etc_hosts: false
vault_sync_webhook_enabled: false
vault_sync_mirror_push: false
# Uptime Kuma freshness heartbeat (FORGE-40 pattern): the push-monitor
# URL carries a per-monitor token, so it lives in vault.yml beside this
# file (ansible-vault encrypted) as vault_sync_heartbeat_url — same
# pattern as host_vars/forge-hypervisor/. Role default "" = disabled
# until vault.yml provides the real URL.

# --- health-check expectations (health.yml) ---
health_expected_mounts:
  - {path: /mnt/bezashare, fstype: cifs}
