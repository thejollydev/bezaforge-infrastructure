    path: "/home/{{ bezaforge_admin_user }}/Projects/brand-creation-kit"
  - workspace: 01a04efd-1a2c-77f9-95b1-44ab24a5d597   # Dev Environment
    path: "/home/{{ bezaforge_admin_user }}/Projects/dotfiles"
  - workspace: 01a04eca-a3cf-74a2-8168-c11be64c63ec   # Intelligrace
    path: "/home/{{ bezaforge_admin_user }}/Projects/intelligrace"
