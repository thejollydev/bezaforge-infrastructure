---
# forge-agents: the Brizza agent team's host. The Lenovo M920Q, bare
# metal, Ubuntu Server 26.04 LTS at 10.10.50.20 on VLAN 50 (BezaForge
# ADR 0011, Brizza ADR 0018). Installed 2026-09-14 from
# docs/runbooks/install-forge-agents.md.

# Connection
ansible_host: 10.10.50.20
ansible_user: joseph

# Machine identity
hostname: forge-agents
timezone: America/Detroit
locale: en_US.UTF-8

# Feature flags
# No NFS. The vault reaches this host by Syncthing (ADR 0012), and ADR 0003
# rules out network mounts for working trees.
nfs_client: false

# ------------------------------------------------------------
# Resolver config (roles/dns-client, #638)
# ------------------------------------------------------------
# The netplan key is `eno2`, read from the host 2026-09-14 without sudo:
# networkd's generated units are /run/systemd/network/10-netplan-eno2.*,
# and netplan names those after the ID key it was given. The installer
# keyed the mapping on the kernel name it displayed.
#
# ⚠️ The NIC also carries two altnames, `enp0s31f6` (the name the install
# runbook predicted) and `enxe86a64c5f521`. A drop-in keyed on either
# would not merge into the installer's mapping; it would emit a second
# unit for the same device, the failure the role defaults warn about.
# Confirm before changing:
#     sudo netplan get ethernets
dns_client_method: netplan
dns_client_netplan_id: eno2

# ------------------------------------------------------------
# Vault sync (roles/syncthing, #1216)
# ------------------------------------------------------------
# The same path as the laptop's copy, so Never4gA's configuration carries
# over in build step 4. Runs as joseph, as Brizza v1's agent did. If the
# agents get users of their own they will need a shared group, and the
# packaged unit's UMask=7027 creates files without group write.
syncthing_user: joseph
syncthing_folder_path: /home/joseph/Vaults/never-knowledge
# Empty until the first run generates the identity and prints the ID to
# record here (docs/runbooks/vault-syncthing.md).
syncthing_device_id: WV54WLV-YC4BPXG-CB7LGKH-LZSQFZ7-WYXDUAH-XV7SR6L-UKT3XNF-YFNCAQW
# UFW is default-deny here: the hypervisor, and the laptop on Home WiFi and
# over WireGuard.
syncthing_ufw_allow_from: "{{ ['10.10.10.10'] + common_admin_ssh_sources }}"

# ------------------------------------------------------------
# Never4gA (roles/never4ga, #1217)
# ------------------------------------------------------------
# Brizza ADR 0016: the vault is the team's shared memory and every agent
# reaches it through Never4gA. Same user as the vault copy, so the index
# it builds is owned by whoever the agents run as.
#
# The wheel is a path on the machine running ansible-playbook, and it is
# built by hand first — the package is unreleased, its repository is
# private, and this host holds no credential for it. See
# docs/runbooks/never4ga-on-forge-agents.md.
never4ga_user: joseph
never4ga_vault_path: /home/joseph/Vaults/never-knowledge
never4ga_wheel: "{{ lookup('env', 'HOME') }}/Projects/never4ga/dist/never4ga-0.1.0.dev0-py3-none-any.whl"

# Repositories the agents work on, mapped so `context startup --cwd`
# resolves from inside them.
#
# ⚠️ EMPTY, AND THAT IS WHY STEP 4 IS NOT FULLY PROVABLE YET. This host
# has no checkout of any project repository and no credential to make one:
# `brizza` and `never4ga` are private, and `git ls-remote` over HTTPS from
# here answers "could not read Username". Giving the host a deploy key or
# a token is a decision in its own right, and step 5's role is explicitly
# forbidden from holding one in git, so it is not taken here by default.
#
# The role skips a mapping whose path is absent with a note rather than
# failing, so this list can be filled in the moment the decision is made
# and the checkout exists:
#
#   never4ga_mappings:
#     - workspace: 01a04efd-1861-7352-8245-8c0c6a001f79   # Brizza
#       path: /home/joseph/Projects/brizza
never4ga_mappings: []

# Step 4's done-when, asserted on every run once there is a repository to
# assert it from. never4ga_verify_repo empty skips the pack check; doctor
# still has to be clean, which is the half that does not need a checkout.
never4ga_verify_workspace: 01a04efd-1861-7352-8245-8c0c6a001f79
never4ga_verify_repo: ""

# ------------------------------------------------------------
# The agent team (roles/hermes-team, #1218)
# ------------------------------------------------------------
# Brizza ADRs 0014 and 0015. Same user as the vault copy and Never4gA, so
# each agent reads the vault as the user that owns it.
hermes_user: joseph

# Joseph's Discord user ID — who every agent takes orders from.
#
# Held in the encrypted vault.yml, not here: this repository is public, and
# an ID that points at a personal Discord account is a fact about the person
# running the estate, which the public-repository standard keeps out. It is
# not a credential; it is simply not the public's business.
#
# Empty means every agent ignores everyone, Joseph included, and the role
# refuses to start an approved agent until it is set.
hermes_discord_allowed_users: "{{ vault_hermes_discord_allowed_users }}"

# Build 5a's three. Brizza first, with the approval flow and the daily
# memory-write digest, then Samuel and Malachi so a task can be researched
# and reviewed. Jeremiah, Zechariah, Elijah and Isaiah join in #1219.
#
# ⚠️ `approved` IS JOSEPH'S SWITCH AND IT IS OFF. ADR 0014 principle 2:
# nothing starts until he approves its first run. Each agent also needs a
# Discord application (Message Content + Server Members intents) and its
# token placed at ~/.hermes/profiles/<name>/.env, which the role never
# writes. Until both are true the role creates the profile and leaves it
# waiting, which is the expected state between one application and the next.
#
# Models follow ADR 0014 principle 3 — local by default, a subscription
# Joseph already pays for only where local would drastically worsen the
# result, and no metered API spend. Bare Ollama names, because the provider
# is `custom` pointed at forge-ai (see the role defaults for why the shape
# matters). Malachi is the exception the role cards make explicitly: Codex
# for code and anything needing real reasoning.
hermes_agents:
  - name: brizza
    soul: soul-brizza.md.j2
    model: qwen3.8:27b
    # The board's only dispatcher. ADR 0014 makes her the orchestrator and
    # dispatch is orchestration; naming it here is what keeps it from
    # falling to whichever gateway systemd starts first. Moving it means
    # moving this line, not restarting things until the lock lands well.
    dispatch: true
    # Approved 2026-09-19: her Discord application exists with both
    # privileged intents, her token is on the host and she is in the
    # server. Samuel and Malachi wait for applications of their own.
    approved: true
  - name: samuel
    soul: soul-samuel.md.j2
    model: qwen3.8:27b
    dispatch: false
    # Approved 2026-09-20: application created with both privileged
    # intents, invited with the same permissions as Brizza, token on the
    # host. Malachi waits for his.
    approved: true
  - name: malachi
    soul: soul-malachi.md.j2
    # Codex, per Malachi's role card. The exact provider string is set when
    # his OAuth login is completed — Joseph's to do, and the role does not
    # guess at a credential it cannot see.
    model: qwen3-coder:30b
    dispatch: false
    approved: false
