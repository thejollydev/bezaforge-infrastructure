    path: "/home/{{ bezaforge_admin_user }}/Projects/brizza"
  - workspace: 01a09f97-4cf7-7273-a667-a12a8d6e5836   # Trading Desk
    path: "/home/{{ bezaforge_admin_user }}/Projects/trading-desk"
