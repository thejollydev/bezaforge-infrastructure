    url: "ssh://git@git.bezaforge.dev:2222/{{ bezaforge_admin_user }}/trading-desk.git"
  # Every other live repository, read-only (Joseph, 2026-10-18), so an agent
  # can see the real project and not only its vault workspace. Left out:
  # the vault itself (never-knowledge), which arrives by Syncthing, the two
