---
# Connection
# Proxmox VE 9.x on Debian 13. Default user is root (Proxmox-managed).
# Joseph ran `ssh-copy-id root@10.10.10.10` once on 2026-05-17 so Ansible's
# SSH key auth works. If that gets lost (key rotation, new workstation),
# re-run ssh-copy-id or fall back to `--ask-pass` on the playbook command.
ansible_host: 10.10.10.10
ansible_user: root

# Machine identity
hostname: forge-hypervisor
timezone: America/Detroit
locale: en_US.UTF-8

# Network
management_ip: 10.10.10.10
domain: bezaforge.dev

# Storage
zfs_pool: bezapool

# ------------------------------------------------------------
# Secondary internal resolver (roles/dnsmasq, #638)
# ------------------------------------------------------------
# Enabled 2026-08-08. AdGuard on forge-ops is primary DNS for the whole
# fleet and is a CONTAINER — `docker compose restart` there takes DNS for
# every VLAN with it. The fallback the repo claimed to have (roles/common's
# FallbackDNS=1.1.1.1) was provably inert: resolved.conf(5) only consults
# FallbackDNS when no other DNS server information is known, and DNS= is set.
#
# This host is the right home for the secondary because it is the only one
# NOT downstream of the failure, and it already refuses to depend on AdGuard
# for its own resolution (see roles/vault-sync's /etc/hosts pins).
#
# Reachability confirmed 2026-08-08 against the live Omada gateway ACL
# (8 rules, read from the controller — the vault doc listed 7): nothing
# denies Production(20) or AI(50) to Management(10), the gateway default is
# Permit, and every rule is protocol "All", so UDP/53 is covered.
dnsmasq_manage: true

# ------------------------------------------------------------
# restic-gcs role config (non-secret)
# Secrets (vault_restic_password, vault_gcs_credentials_json)
# live in vault.yml in this same directory, encrypted with
# ansible-vault. Project ID + bucket name are not secrets —
# anyone with bucket read access could enumerate the project
# from the bucket's resource ARN, so no value in hiding them.
# ------------------------------------------------------------
gcs_project_id: bezaforge-backups
gcs_bucket: bezaforge-backups-95d56ebe

# ------------------------------------------------------------
# vault-sync webhook trigger token (ADR 0002 v1.2).
# Low-sensitivity (it only gates "start the idempotent sync the
# 1-min timer runs anyway"), but it IS a Bearer token, so it lives
# in ansible-vault for defense-in-depth rather than plaintext here
# (FORGE-41). Defined as `vault_sync_webhook_token` in the sibling
# vault.yml. Gitea's webhook config holds the same value server-side.
# ------------------------------------------------------------

# --- health-check expectations (health.yml) ---
# sharepool is the one that silently failed to import after the 2026-07-25
# reboot; listing it here is what makes health.yml catch a repeat.
health_expected_zpools:
  - bezapool
  - sharepool
health_expected_mounts:
  - {path: /sharepool/files, fstype: zfs}
  - {path: /bezapool/vault, fstype: zfs}
  - {path: /bezapool/forge-ops-backup, fstype: zfs}

# --- systemd-hygiene ---
# openipmi.service can never start on this box. forge-hypervisor is an MSI
# MS-7C84 consumer board with no BMC: `dmidecode --type 38` (IPMI Device
# Information) is empty and there is no /dev/ipmi*, so the ipmi_si system
# interface driver has nothing to bind to. It is installed only as a
# transitive dependency of our own monitoring stack —
# prometheus-node-exporter-collectors recommends ipmitool, which depends on
# openipmi — and it has been in a failed state since the 2026-07-25 reboot.
# Masking (not removing) because Recommends are reinstalled on upgrade, so
# removal would not survive; masking is durable and idempotent.
systemd_masked_units:
  - openipmi.service
