---
# Connection
ansible_host: 10.10.50.10
ansible_user: joseph

# Machine identity
hostname: forge-ai
timezone: America/Detroit
locale: en_US.UTF-8

# Feature flags
nfs_client: false

# ------------------------------------------------------------
# Resolver config (roles/dns-client, #638)
# ------------------------------------------------------------
# ⚠️ THE KEY IS AN ALTNAME, AND IT IS NOT WHAT ANY TOOL SHOWS YOU.
# The netplan ID key is `enp6s18`; the interface presents as `ens18` in
# `ip -br link`, `networkctl list`, and `resolvectl status`. `enp6s18` is a
# kernel ALTERNATIVE name (`ip -d link show` -> "altname enp6s18"), and
# systemd-networkd matches altnames — which is how 50-cloud-init.yaml's
# `enp6s18:` mapping has always configured this host. Verified 2026-08-08.
#
# Keying a drop-in `ens18` would NOT merge into that mapping. It would
# generate a SECOND unit (10-netplan-ens18.network) matching the same
# device, leaving two competing configs resolved by filename sort order.
# That is worse than a no-op and it fails silently. Confirm before changing:
#     sudo netplan get ethernets     # authoritative key
#     ip -d link show                # shows the altname
dns_client_method: netplan
dns_client_netplan_id: enp6s18

# ------------------------------------------------------------
# ollama role (see ansible/roles/ollama/defaults/main.yml for
# all knobs + commentary)
# ------------------------------------------------------------
# Models the role should ensure are pulled. `ollama pull` is
# idempotent, so the role no-ops on re-runs once the digest
# matches. Run `ollama list` on forge-ai to see what's currently
# loaded; copy the names + tags here so the role matches reality
# before the next playbook pass.
# Format: YAML list of bare model NAME:TAG values — names only, no
# IDs / sizes / dates from `ollama list`. Cloud models (SIZE shown
# as `-` in `ollama list`, suffix `-cloud`) are streamed from the
# Ollama cloud at inference time, not pulled locally — leave them
# out of this list. `gemma4:31b-cloud` is the current example;
# include it only if/when `ollama pull` supports cloud refs.
# Cognee was retired 2026-06-09 — every model previously seeded here
# (gemma4, nomic-embed-text, deepseek-r1-16k, devstral-32k, the
# Qwen3.6-35B GGUF + bge-m3) was pulled solely for the Cognee extraction
# experiment and was reclaimed in the live teardown (verified 2026-06-09).
# qwen3.6:27b was Brizza's Hermes-bridge Ollama fallback (BRIZZA-52) and
# was REMOVED 2026-08-30 with the Brizza v1 teardown — it existed for
# that one consumer, which no longer exists. Same reclaim as the
# Cognee-era models above.
#
# ⚠️ Emptying this list does NOT delete the model from the host: the
# ollama role pulls what is listed, it does not prune what is not
# (tasks/main.yml has a `Seed configured models` step and no prune step).
# The blob stays on disk until removed by hand.
#
# ⚠️ NEVER4GA DEPENDS ON THIS HOST. `~/.config/never4ga/config.toml`
# points its embedding at http://10.10.50.10:11434 with the model below.
# That is a live dependency of the knowledge system on forge-ai, and it
# was never declared here — the list named only Brizza's fallback while
# 14 models sat on the host. Declared 2026-08-31 so a rebuild of forge-ai
# from this role restores what never4ga needs instead of silently
# breaking retrieval. The failure would be quiet: embedding calls fail,
# search degrades to FTS, and nothing says why.
# ⚠️ OPENCODE ON THE LAPTOP DEPENDS ON THIS HOST. It is configured
# against http://10.10.50.10:11434/v1 with qwen3-coder:30b as its
# default model and qwen2.5-coder:14b as its small_model
# (~/.config/opencode/opencode.jsonc). qwen3-coder:30b (18 GB) was
# pulled by hand 2026-08-30 and never declared; declared 2026-08-31
# (#953) so a rebuild of forge-ai restores what opencode needs instead
# of breaking it with no explanation — the same quiet failure class as
# the never4ga embedding above (#203).
ollama_models:
  # never4ga's embedder, declared by #203, removed 2026-09-06. Never4gA
  # ADR-0033 (accepted 2026-09-05) retired the semantic lane outright:
  # adapters/ollama, the vector index and the [embedding] config table are
  # all gone, and retrieval is lexical + structural + relational. Nothing
  # calls this model any more, and at 8 GB it is the largest single item on
  # a host whose GPU has 21.4 GB to work with.
  #   - hf.co/Qwen/Qwen3-Embedding-8B-GGUF:Q8_0
  # opencode's models (#953).
  - qwen3-coder:30b
  - qwen2.5-coder:14b
  # The agent team's local fallback (Brizza ADR 0014). Both were pulled by
  # hand and never declared — the same quiet-failure class as the two
  # above — and gemma4:26b is now load-bearing twice over: the base for the
  # -64k variant below, and `ollama create` cannot build that variant if
  # the base is absent.
  - gemma4:26b
  - qwen3.8:27b

# ⚠️ UNDECLARED DRIFT, deliberately left for Joseph rather than guessed.
# `ollama list` on forge-ai shows 14 models; this file declares three.
# The rest have no recorded consumer, so declaring them here would
# assert a desired state nobody chose:
#   generative — qwen3:30b-a3b (and qwen3.6:27b plus its -64k variant,
#     both retired with Brizza v1)
#   embedding  — qwen3-embedding:{0.6b,4b,8b}, bge-m3, bge-m3-8k,
#     embeddinggemma, nomic-embed-text, mxbai-embed-large,
#     snowflake-arctic-embed2
# The embedding set looks like a model bake-off for never4ga; qwen3:30b-a3b
# is what Open WebUI has to offer once Brizza's model goes. Reconcile
# deliberately — this file's header already says the list should match
# reality before the next playbook pass, and it does not.

# ⚠️ RETAINED DELIBERATELY, though its stated reason has been retired.
# FLASH_ATTENTION + KV q8_0 halve the KV cache; they were validated for
# qwen3.6:27b-64k (BRIZZA-51) but they are host-wide GPU tuning, not
# Brizza config, and they remain correct for any large-context model on
# the 20 GiB card. Removing them with the model would quietly re-inflate
# the KV cache for whatever gets loaded next. Revisit when v2's inference
# shape is known, not as part of the teardown.
ollama_extra_env:
  OLLAMA_FLASH_ATTENTION: "1"
  OLLAMA_KV_CACHE_TYPE: "q8_0"

# ⚠️ REBUILD THIS WHENEVER THE AGENTS' BASE MODEL CHANGES. A per-model
# num_ctx variant exists because OpenAI-compat /v1 consumers CANNOT set
# context per-request — it must live server-side. Upstream says so outright:
# "You cannot set context length through the OpenAI-compatible API. It must
# be configured server-side or via a Modelfile. This is the #1 source of
# confusion." A global OLLAMA_CONTEXT_LENGTH is rejected instead because
# this host serves eleven models to several consumers, and the others are
# not all sliding-window — a casual load would grab a far larger cache.
#
# The qwen3.6:27b-64k variant went with its model on 2026-08-30, leaving
# only a note. v2 wanted a local model and nobody rebuilt it, so the agents
# ran at Ollama's 4096 default. That is not a quiet degradation: Ollama
# truncates the prompt from the front until the user turn falls off the
# end, then answers HTTP 500 "no user query found in messages" — an error
# naming nothing to do with context. Samuel hit it on his first tool call,
# 2026-09-20, on a turn of ~5,600 tokens.
#
# 64K, NOT LESS: Hermes "requires at least 64,000 tokens of context for
# agent use with tools" (docs/guides/local-ollama-setup). An earlier pass
# here settled on 32768 for qwen3.8:27b, which is below that floor — the
# figure was measured against the card without checking the requirement.
#
# gemma4:26b AND NOT qwen3.8:27b, measured on this card 2026-09-20:
# qwen3.8:27b is the stronger dense model, but its KV is 38 KiB/token, so
# 64K costs 2.38 GiB on top of 18.60 GiB of weights and buffers — 20.98 GiB
# against 19.98 GiB of VRAM. Ollama publishes no tag below q4_K_M for it,
# and q3 costs 5-10% quality, which lands on tool calling first.
#
# gemma4:26b is a 26B-A4B MoE (128 experts, 8 used) with sliding-window
# attention: only 5 of its 30 blocks hold a growing cache, the other 25 sit
# at a fixed 1536 cells whatever the context. Measured at 65536, q8_0 KV:
#   KV 680 MiB (5 layers) + 159 MiB (25 SWA) + 136/19 MiB (MTP draft)
#     = 0.97 GiB, against qwen3.8's 2.38 GiB
#   weights 15.77 GiB on GPU, total ~17.7 GiB, loads 100% GPU
# 131072 was tested too and spills to 23% CPU / 77% GPU, so 64K is the
# ceiling here as well as the floor.
#
# Tool calling verified through the /v1 endpoint with a realistic schema,
# not taken from the capability flag: it returned a well-formed tool_calls
# payload with the right argument and finish_reason=tool_calls.
#
# ⚠️ KV STAYS q8_0 (see ollama_extra_env above). Dropping the KV cache to
# q4_0 would halve it, and upstream function-calling guidance is explicit
# that q4 KV degrades tool-calling accuracy specifically. The cheaper cache
# is not available to us.
ollama_modelfiles:
  - name: gemma4:26b-64k
    from: gemma4:26b
    parameters:
      num_ctx: 65536

# Long keep-alive so interactive back-and-forth doesn't pay the
# cold-load cost every prompt. Override here if a different
# pattern emerges.
ollama_keep_alive: "24h"

# --- health-check expectations (health.yml) ---
health_expected_mounts:
  - {path: /mnt/bezashare, fstype: cifs}
