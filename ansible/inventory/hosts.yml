    hypervisor_hosts:
      hosts:
        forge-hypervisor:
    docker_hosts:
      hosts:
        forge-ops:
    gpu_hosts:
      hosts:
        forge-ai:
    # forge-agents: the Brizza agent team's host, bare metal (BezaForge
    # ADR 0011). It took the address forge-brizza (Brizza v1, retired
    # 2026-08-30) held, and the reservation followed the name.
    assistant_hosts:
      hosts:
        forge-agents:
    erp_hosts:
      hosts:
        forge-erp:
    # The throwaway VM the agent host's backup is restored onto during a
    # restore drill (docs/runbooks/dr-restore-drill.md, Drill G). Empty
    # between drills: add the host here while one runs, remove it after.
    drill_hosts:
      hosts: {}
